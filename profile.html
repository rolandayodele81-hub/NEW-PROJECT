<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile — PSE PDMS</title>


  <link rel="stylesheet" href="css/style.css?v=1789132687" />
</head>

<body>
  <script src="js/bundle.js?v=1789132687"></script>
  <script>
    PDMS.mountShell('profile');
    let u = PDMS.getUser(); const I = PDMS.icon;
    const D = PDMS_DATA;

    function render() {
      u = PDMS.getUser();
      const liveUsers = (window.PDMS_REMOTE && window.PDMS_REMOTE.users) || D.users || [];
      if (u && Array.isArray(liveUsers)) {
        const liveMatch = liveUsers.find(x => String(x.id) === String(u.id) || (x.email && x.email.toLowerCase() === String(u.email || '').toLowerCase()));
        if (liveMatch) {
          u = Object.assign({}, u, liveMatch);
          PDMS.setUser(u);
        }
      }
      const canEditProfile = u && ['HR', 'PMO', 'Project Manager', 'PM Head', 'HTD', 'COO', 'System Administrator', 'General Admin'].includes(u.role);
      const userProjects = (D.projects || []).filter(p => {
        if (!p || !u) return false;
        const userId = String(u.id || '').trim().toLowerCase();
        const userName = String(u.name || '').trim().toLowerCase();
        const ownerIds = [
          String(p.projectOwnerId || p.onboardedById || p.salesOwnerId || p.createdByUserId || '').trim().toLowerCase(),
          String(p.projectOwnerName || p.onboardedByName || p.salesOwnerName || p.createdByUserName || '').trim().toLowerCase()
        ];
        return (p.pm === u.name || p.lead === u.name || (p.consultants || []).includes(u.name) || (userId && ownerIds.includes(userId)) || (userName && ownerIds.includes(userName)));
      });
      const isHistoryProject = p => {
        if (!p) return false;
        const isDelivery = (PDMS.stageOf ? PDMS.stageOf(p) === 'Delivery' : p.stage === 'Delivery');
        const isSales = (PDMS.stageOf ? PDMS.stageOf(p) === 'Sales' : p.stage === 'Sales');
        const dStat = String((PDMS.deliveryStatusOf ? PDMS.deliveryStatusOf(p) : p.deliveryStatus) || '').trim();
        const s = String(p.status || '').trim();

        if (isDelivery) {
          const activeDeliveryStatuses = ['Not Started', 'Gap Assessment', 'Risk Assessment', 'Design & Documentation/Implementation', 'VAPT', 'Internal Testing', 'Penetration Testing', 'Report Submission', 'Review', 'Training & Awareness', 'Internal Audit & Management Review', 'Remediation & Certification Readiness', 'Certification Audit', 'Ongoing', 'In Progress', 'Assess', 'Target State', 'GAP', 'Roadmap', 'Tailor/Design', 'Implement', 'Capability Building', 'Post-Implementation Assess', 'Strategy', 'Governance', 'Design', 'Select/Contract', 'Transition', 'Operate', 'Monitor', 'Improve', 'Previous Findings Closure', 'Awareness', 'Management Review', 'Readiness Assessment', 'Remediation', 'Surveillance Audit', 'Requirements Gathering', 'Configuration & Design', 'Data Preparation & Migration', 'Integration', 'Testing', 'User Acceptance Testing (UAT)', 'Go-Live', 'Project Initiation & Business Case', 'Requirements & Use-Case Definition', 'Architecture & Solution Design', 'Data Readiness & Preparation', 'PoC / Prototype', 'Software Development & AI Model Build', 'System Integration', 'Testing & AI Validation', 'UAT & Business Acceptance', 'Production Deployment & Go-Live', 'Hypercare & Operational Handover', 'On Hold'];
          if (activeDeliveryStatuses.some(a => a.toLowerCase() === dStat.toLowerCase())) {
            return false;
          }
          const deliveryDoneStatuses = ['Completed', 'Closure', 'Project Closure', 'Certification & Post Engagement', 'Closed', 'Cancelled', 'Rejected'];
          if (deliveryDoneStatuses.some(h => h.toLowerCase() === dStat.toLowerCase())) {
            return true;
          }
          return false;
        }

        if (isSales) {
          const salesHistoryStatuses = ['Cancelled', 'Rejected'];
          return salesHistoryStatuses.some(h => h.toLowerCase() === s.toLowerCase());
        }

        const historyStatuses = ['Completed', 'Closure', 'Project Closure', 'Certification & Post Engagement', 'Closed', 'Rejected', 'Cancelled'];
        return historyStatuses.some(h => h.toLowerCase() === s.toLowerCase() || (dStat && h.toLowerCase() === dStat.toLowerCase()));
      };
      const currentProjects = userProjects.filter(p => !isHistoryProject(p));
      const currentCount = currentProjects.length;
      const totalCount = userProjects.length;
      const userLeaves = PDMS.getUserLeaveHistory ? PDMS.getUserLeaveHistory(u) : [];
      const activeLeave = PDMS.getUserActiveLeave ? PDMS.getUserActiveLeave(u) : null;
      const upcomingLeaves = PDMS.getUserUpcomingLeaves ? PDMS.getUserUpcomingLeaves(u) : [];
      const currentYear = new Date().getFullYear();
      const approvedDaysThisYear = userLeaves
        .filter(l => String(l.status || '').toLowerCase() === 'approved' && String(l.startDate || '').startsWith(String(currentYear)))
        .reduce((sum, l) => sum + (parseInt(l.daysCount, 10) || 1), 0);
      const pendingCount = userLeaves.filter(l => String(l.status || '').toLowerCase() === 'pending approval' || String(l.status || '').toLowerCase() === 'pending').length;

      document.getElementById('content').innerHTML = `
  <div class="page-head"><div><div class="breadcrumbs"><span>Home</span><span>Profile</span></div>
    <h1 class="page-title">My Profile</h1><div class="page-sub">Personal information, security, and account settings</div></div></div>
  <div class="grid" style="grid-template-columns:340px 1fr;gap:20px">
    <div class="card"><div class="card-body text-center">
      <div class="avatar avatar-lg" style="margin:8px auto 12px">${PDMS.initials(u.name)}</div>
      <div class="font-bold" style="font-size:18px">${PDMS.esc(u.name)}</div>
      <div class="text-muted mb-2">${PDMS.esc(u.email)}</div>
      <div style="display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-bottom:12px">
        <span class="badge badge-primary">${PDMS.esc(u.role)}</span>
        ${activeLeave ? `<span class="badge badge-warn" title="On approved leave until ${activeLeave.endDate}">● On Leave</span>` : '<span class="badge badge-success">● Available</span>'}
      </div>
      <div class="grid grid-2 mt-3" style="gap:12px">
        <div><div class="font-bold" style="font-size:20px">${currentCount}</div><div class="text-sm text-muted">Current Project${currentCount === 1 ? '' : 's'}</div></div>
        <div><div class="font-bold" style="font-size:20px">${totalCount}</div><div class="text-sm text-muted">Total Projects</div></div>
      </div>
      <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px">
        <a href="user-details.html#id=${encodeURIComponent(u.id || '')}" class="btn btn-secondary btn-sm" style="width:100%;justify-content:center;display:flex;align-items:center;gap:6px;font-weight:600">
          ${I('folder')} View Full Profile &amp; History
        </a>
        <button class="btn btn-primary btn-sm" onclick="openRequestLeaveModal()" style="width:100%;justify-content:center;display:flex;align-items:center;gap:6px;font-weight:600">
          ${I('calendar')} Request Off Days
        </button>
      </div>
    </div></div>
    <div>
      <div class="card mb-4">
        <div class="card-head">
          <div class="card-title">Personal Information</div>
          ${canEditProfile ? '<span class="badge badge-success">Editable</span>' : ''}
        </div>
        <div class="card-body">
          <div class="form-grid">
            <div class="form-row"><label>Full Name</label><input id="profName" value="${PDMS.esc(u.name || '')}" ${!canEditProfile ? 'disabled' : ''}/></div>
            <div class="form-row"><label>Email</label><input id="profEmail" type="email" value="${PDMS.esc(u.email || '')}" ${!canEditProfile ? 'disabled' : ''}/></div>
            <div class="form-row"><label>Phone</label><input id="profPhone" type="text" value="${PDMS.esc(u.phone || '')}" placeholder="${canEditProfile ? 'e.g. +1 555 123 4567' : 'Not provided'}" ${!canEditProfile ? 'disabled' : ''}/></div>
            <div class="form-row"><label>Department</label><input id="profDept" type="text" value="${PDMS.esc(u.dept || u.role || '')}" ${!canEditProfile ? 'disabled' : ''}/></div>
            <div class="form-row"><label>Date of Birth</label><input id="profBirthday" type="text" value="${PDMS.esc(u.birthday || '')}" placeholder="${canEditProfile ? 'MM/DD' : 'Unknown'}" ${!canEditProfile ? 'disabled' : ''}/></div>
            <div class="form-row"><label>Date of Entry</label><input id="profEntry" type="date" value="${PDMS.esc(u.dateOfEntry || u.joined || '')}" ${!canEditProfile ? 'disabled' : ''}/></div>
          </div>
          ${canEditProfile ? `
          <div style="margin-top:18px">
            <button id="saveProfileBtn" class="btn btn-primary" onclick="updatePersonalInfo()">${I('check')} Save Changes</button>
          </div>
          ` : `
          <div class="text-sm text-muted mt-3">${I('info')} Contact your system administrator or HR to update your personal information.</div>
          `}
        </div>
      </div>
      
      <div class="card"><div class="card-head"><div class="card-title">Security & Password</div></div>
        <div class="card-body">
          <!-- Hidden inputs to prevent aggressive browser autofill -->
          <input type="text" style="display:none" autocomplete="username"/>
          <input type="password" style="display:none" autocomplete="current-password"/>
          <div class="form-grid">
            <div class="form-row">
              <label>New Password</label>
              <div class="password-input-wrap">
                <input id="newPassword" type="password" autocomplete="new-password" value="" placeholder="Enter new password"/>
                <button type="button" class="password-toggle-btn" onclick="PDMS.togglePasswordVisibility('newPassword', this)" aria-label="Toggle password visibility" title="Show password">
                  <svg class="eye-icon-show" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>
                  </svg>
                  <svg class="eye-icon-hide" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>
                  </svg>
                </button>
              </div>
            </div>
            <div class="form-row">
              <label>Confirm Password</label>
              <div class="password-input-wrap">
                <input id="confirmPassword" type="password" autocomplete="new-password" value="" placeholder="Confirm new password"/>
                <button type="button" class="password-toggle-btn" onclick="PDMS.togglePasswordVisibility('confirmPassword', this)" aria-label="Toggle password visibility" title="Show password">
                  <svg class="eye-icon-show" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>
                  </svg>
                  <svg class="eye-icon-hide" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>
                  </svg>
                </button>
              </div>
            </div>
          </div>
          <div style="margin-top: 16px;">
            <button id="updatePasswordBtn" class="btn btn-primary" onclick="updatePassword()">Update Password</button>
          </div>
        </div>
      </div>
    </div>
  </div>`;
      setTimeout(() => {
        const p1 = document.getElementById('newPassword');
        const p2 = document.getElementById('confirmPassword');
        if (p1) p1.value = '';
        if (p2) p2.value = '';
      }, 50);
    }

    PDMS.onRefresh(render);

    window.updatePersonalInfo = function () {
      if (!u || !['HR', 'PMO', 'Project Manager', 'PM Head', 'HTD', 'COO', 'System Administrator', 'General Admin'].includes(u.role)) return;
      const name = document.getElementById('profName').value.trim();
      const email = document.getElementById('profEmail').value.trim().toLowerCase();
      const phone = document.getElementById('profPhone').value.trim();
      const dept = document.getElementById('profDept').value.trim();
      const birthday = document.getElementById('profBirthday').value.trim();
      const dateOfEntry = document.getElementById('profEntry').value;

      if (!name || !email) {
        return PDMS.toast('Required Fields', 'Full name and email are required', 'error');
      }

      const patch = { name, email, phone, dept, birthday, dateOfEntry };
      const btn = document.getElementById('saveProfileBtn');
      PDMS.setButtonLoading(btn, true, 'Saving...');

      PDMS.api.update('users', u.id, patch).then(saved => {
        Object.assign(u, patch, saved);
        PDMS.setUser(u);
        const liveUsers = (window.PDMS_REMOTE && window.PDMS_REMOTE.users) || D.users || [];
        const liveMatch = liveUsers.find(x => String(x.id) === String(u.id));
        if (liveMatch) Object.assign(liveMatch, patch, saved);

        PDMS.setButtonLoading(btn, false);
        PDMS.toast('Success', 'Personal information updated successfully', 'success');
        render();
        if (typeof PDMS_REFRESH === 'function') PDMS_REFRESH();
      }).catch(err => {
        PDMS.setButtonLoading(btn, false);
        PDMS.toast('Error', err.message || 'Could not update profile', 'error');
      });
    };

    window.updatePassword = function () {
      const p1 = document.getElementById('newPassword').value;
      const p2 = document.getElementById('confirmPassword').value;
      if (!p1) return PDMS.toast('Error', 'Please enter a new password', 'error');
      if (p1 !== p2) return PDMS.toast('Error', 'Passwords do not match', 'error');

      const btn = document.getElementById('updatePasswordBtn');
      PDMS.setButtonLoading(btn, true);
      PDMS.api.update('users', u.id, { password: p1 }).then(() => {
        PDMS.setButtonLoading(btn, false);
        PDMS.toast('Success', 'Password updated successfully', 'success');
        document.getElementById('newPassword').value = '';
        document.getElementById('confirmPassword').value = '';
      }).catch(err => {
        PDMS.setButtonLoading(btn, false);
        PDMS.toast('Error', err.message, 'error');
      });
    };

    const LEAVE_TYPES = [
      'Annual / Vacation Leave',
      'Sick / Medical Leave',
      'Personal / Casual Off-Day',
      'Compassionate / Bereavement',
      'Study / Exam Leave',
      'Maternity / Paternity Leave',
      'Other Time Off'
    ];

    window.openRequestLeaveModal = function () {
      if (!u) return;

      const todayStr = new Date().toISOString().slice(0, 10);
      const bodyHtml = `
        <div class="form-row" style="margin-bottom:14px">
          <label>Leave Category / Type <span style="color:var(--danger)">*</span></label>
          <select id="leaveType" style="width:100%">
            ${LEAVE_TYPES.map(t => `<option value="${t}">${t}</option>`).join('')}
          </select>
        </div>

        <div class="grid grid-2" style="gap:14px;margin-bottom:14px">
          <div class="form-row" style="margin-bottom:0">
            <label>Start Date <span style="color:var(--danger)">*</span></label>
            <input type="date" id="leaveStartDate" value="${todayStr}" style="width:100%"/>
          </div>
          <div class="form-row" style="margin-bottom:0">
            <label>End Date <span style="color:var(--danger)">*</span></label>
            <input type="date" id="leaveEndDate" value="${todayStr}" style="width:100%"/>
          </div>
        </div>

        <div style="background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between">
          <span style="font-size:12.5px;color:var(--text-muted)">Estimated Duration:</span>
          <span id="leaveDaysDisplay" style="font-weight:700;font-size:13px;color:var(--primary)">1 Day</span>
        </div>

        <div class="form-row" style="margin-bottom:6px">
          <label>Reason / Handover Notes <span style="color:var(--danger)">*</span></label>
          <textarea id="leaveReason" rows="4" placeholder="Describe the reason for your time-off request and any project handover details..." style="width:100%"></textarea>
        </div>
      `;

      const footHtml = `
        <button class="btn btn-ghost" data-close>Cancel</button>
        <button class="btn btn-primary" id="submitLeaveBtn">${I('send')} Submit to HR</button>
      `;

      const modal = PDMS.modal('Request Off Days / Leave', bodyHtml, footHtml);

      const startInput = modal.querySelector('#leaveStartDate');
      const endInput = modal.querySelector('#leaveEndDate');
      const daysDisplay = modal.querySelector('#leaveDaysDisplay');

      function calculateDays() {
        const sVal = startInput.value;
        const eVal = endInput.value;
        if (!sVal || !eVal) return 1;
        const d1 = new Date(sVal);
        const d2 = new Date(eVal);
        const diffTime = d2.getTime() - d1.getTime();
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
        return diffDays > 0 ? diffDays : 0;
      }

      function updateDays() {
        const count = calculateDays();
        if (count <= 0) {
          daysDisplay.textContent = 'Invalid date range';
          daysDisplay.style.color = 'var(--danger)';
        } else {
          daysDisplay.textContent = count === 1 ? '1 Day' : `${count} Days`;
          daysDisplay.style.color = 'var(--primary)';
        }
      }

      startInput.onchange = () => {
        if (endInput.value < startInput.value) {
          endInput.value = startInput.value;
        }
        updateDays();
      };
      endInput.onchange = updateDays;

      const submitBtn = modal.querySelector('#submitLeaveBtn');
      submitBtn.onclick = function () {
        const type = modal.querySelector('#leaveType').value;
        const startDate = startInput.value;
        const endDate = endInput.value;
        const reason = modal.querySelector('#leaveReason').value.trim();
        const daysCount = calculateDays();

        if (!startDate || !endDate || !reason) {
          return PDMS.toast('Missing Info', 'Please provide start date, end date, and reason.', 'error');
        }
        if (daysCount <= 0) {
          return PDMS.toast('Invalid Dates', 'End date must be on or after start date.', 'error');
        }

        const btn = this;
        PDMS.setButtonLoading(btn, true, 'Submitting...');

        const record = {
          id: 'LV-' + Date.now(),
          userId: String(u.id || ''),
          userName: String(u.name || ''),
          userEmail: String(u.email || ''),
          userRole: String(u.role || ''),
          dept: String(u.dept || ''),
          startDate: startDate,
          endDate: endDate,
          daysCount: daysCount,
          type: type,
          reason: reason,
          status: 'Pending Approval',
          createdAt: new Date().toISOString(),
          reviewerId: '',
          reviewerName: '',
          reviewerRole: '',
          reviewNote: '',
          reviewedAt: ''
        };

        PDMS.api.create('leaveRequests', record).then(saved => {
          const finalObj = Object.assign({}, record, saved || {});
          D.leaveRequests = D.leaveRequests || [];
          D.leaveRequests.unshift(finalObj);
          if (window.PDMS_REMOTE) {
            window.PDMS_REMOTE.leaveRequests = window.PDMS_REMOTE.leaveRequests || [];
            window.PDMS_REMOTE.leaveRequests.unshift(finalObj);
          }

          PDMS.notify('New Time-Off Request', `${u.name} requested ${daysCount} off-day(s) (${startDate} to ${endDate})`, 'calendar', 'dashboard-hr.html', 'HR,System Administrator');

          modal.remove();
          PDMS.toast('Request Submitted', `Your time off request (${daysCount} day${daysCount===1?'':'s'}) has been sent to HR for approval.`, 'success');
          render();
        }).catch(err => {
          PDMS.setButtonLoading(btn, false);
          PDMS.toast('Error', err.message || 'Could not submit time off request', 'error');
        });
      };
    };

    window.cancelLeaveRequest = function (leaveId) {
      const list = PDMS.getAllLeaveRequests ? PDMS.getAllLeaveRequests() : (D.leaveRequests || []);
      const item = list.find(l => String(l.id) === String(leaveId));
      if (!item) return;

      if (!confirm('Are you sure you want to cancel this pending time-off request?')) return;

      PDMS.api.update('leaveRequests', leaveId, { status: 'Cancelled', updatedAt: new Date().toISOString() }).then(saved => {
        Object.assign(item, { status: 'Cancelled' }, saved || {});
        PDMS.toast('Cancelled', 'Time off request cancelled.', 'success');
        render();
      }).catch(err => {
        PDMS.toast('Error', err.message || 'Could not cancel request', 'error');
      });
    };
  </script>
</body>

</html>
