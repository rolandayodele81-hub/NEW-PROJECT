<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>

<link rel="stylesheet" href="css/style.css"/></head><body>
<script src="js/bundle.js"></script>
<script>
// A hash survives any host's clean-URL rewriting untouched, since it's never
// sent to the server — unlike ?id=, which some static hosts strip on redirect.
window.addEventListener('hashchange', ()=>location.reload());
PDMS.mountShell('projects');
const D = PDMS_DATA; const I = PDMS.icon;
let p;

// Project issues are stored in D.issues — separate from D.reviews (the general
// community reviews page) so they never appear there.
function projectIssues(proj){
  const liveIssues = (window.PDMS_REMOTE && window.PDMS_REMOTE.issues) || D.issues || [];
  return liveIssues.filter(r=>String(r.projectId)===String(proj.id)).slice().sort((a,b)=>new Date(b.time)-new Date(a.time));
}
function timeAgo(iso){
  if(!iso) return '';
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.round(diffMs/60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins+'m ago';
  const hrs = Math.round(mins/60);
  if(hrs < 24) return hrs+'h ago';
  return Math.round(hrs/24)+'d ago';
}
function healthOf(proj){
  if(proj.status==='Completed') return {label:'Completed', cls:'badge-success'};
  if(proj.status==='Cancelled') return {label:'Cancelled', cls:'badge-danger'};
  if(proj.status==='Closed') return {label:'Closed', cls:'badge-primary'};
  if(proj.status==='On Hold') return {label:'On Hold', cls:'badge-muted'};
  const start = new Date(proj.start), due = new Date(proj.due), today = new Date();
  if(isNaN(start)||isNaN(due)||due<=start) return {label:'On Track', cls:'badge-success'};
  const expected = Math.min(100, Math.max(0, ((today-start)/(due-start))*100));
  const gap = expected - (proj.progress||0);
  if(gap > 25) return {label:'Delayed', cls:'badge-danger'};
  if(gap > 10) return {label:'At Risk', cls:'badge-warn'};
  return {label:'On Track', cls:'badge-success'};
}
function milestoneStages(proj){
  // 'Approved'/'Rejected'/'On Hold' are outcomes, not sequential steps — they
  // can't all sit in the same line at once. The timeline only ever walks the
  // main sequence, which normally ends at Approved (Sales) / Completed (Delivery).
  const viewer = PDMS.getUser();
  const isConsultantView = viewer && (viewer.role === 'Consultant' || viewer.role === 'PMO');
  const D = window.PDMS_DATA;
  const hasDeliveryStatus = D && D.deliveryStatuses && D.deliveryStatuses.includes(proj.status);
  const hasSalesStatus = D && D.salesStatuses && D.salesStatuses.includes(proj.status);
  // Use delivery timeline if the project is currently on a delivery status,
  // or if viewer is a Consultant/PMO (always delivery context).
  const isSales = !isConsultantView && !hasDeliveryStatus && hasSalesStatus;
  const mainSequence = isSales
    ? ['Incoming','Initial Contact','Requirement Gathering','Proposal Sent','Negotiation','Awaiting Client Approval','PO / Award Granted','SLA Signed','Closed']
    : ['Not Started','In Progress','Awaiting Review','Testing / Quality Assurance','Completed'];
  const status = proj.status;

  if(status==='Cancelled'){
    return mainSequence.map((label,i)=> i===mainSequence.length-1 ? {label:'Cancelled', state:'active'} : {label, state:'done'});
  }

  if(status==='On Hold'){
    // On Hold isn't a fixed slot — it can happen at any point, so position it
    // right after however far progress actually got, not at a fixed spot in the list.
    const stepsBeforeFinal = mainSequence.length-1;
    const doneCount = Math.min(stepsBeforeFinal, Math.floor(((proj.progress||0)/100)*stepsBeforeFinal));
    const result = mainSequence.slice(0,doneCount).map(label=>({label, state:'done'}));
    result.push({label:'On Hold', state:'active'});
    mainSequence.slice(doneCount).forEach(label=>result.push({label, state:''}));
    return result;
  }

  const currentIndex = mainSequence.indexOf(status);
  return mainSequence.map((label,i)=>{
    const state = currentIndex===-1 ? '' : i<currentIndex ? 'done' : i===currentIndex ? 'active' : '';
    return {label, state};
  });
}

function render(){
const liveProjects = (window.PDMS_REMOTE && window.PDMS_REMOTE.projects) || D.projects;
const hasProjects = Array.isArray(liveProjects) && liveProjects.length > 0;
const id = hasProjects ? new URLSearchParams(location.hash.replace(/^#/,'')).get('id') || liveProjects[0].id : null;
p = hasProjects ? liveProjects.find(x=>x.id===id) || liveProjects[0] : null;

if(!p){
  document.getElementById('content').innerHTML = window.PDMS_REMOTE ? `
    <div class="page-head"><div><div class="breadcrumbs"><span>Home</span><span>Projects</span></div>
      <h1 class="page-title">No Project Data</h1><div class="page-sub">You currently do not have any project records.</div></div>
      <div class="flex gap-2"><a class="btn btn-primary" href="projects.html">Open Projects</a></div></div>
    <div class="card"><div class="card-body"><p class="text-muted">Add your own project data in <code>js/data.js</code> or use the template structure to populate this app.</p></div></div>
  ` : `
    <div class="page-head"><div><div class="breadcrumbs"><span>Home</span><span>Projects</span></div>
      <h1 class="page-title">Loading Project...</h1><div class="page-sub">Fetching your project data</div></div></div>
    <div class="card"><div class="card-body pdms-loading-inline"><span class="pdms-spinner"></span>Loading...</div></div>
  `;
} else if(PDMS.isPendingAccountApproval(p) && !(PDMS.getUser() && ['Accounts','General Admin'].includes(PDMS.getUser().role))) {
  // Locked state — non-Accounts users see a professional pending screen
  const u = PDMS.getUser();
  document.getElementById('content').innerHTML = `
  <div class="breadcrumbs" style="margin-bottom:20px"><span>Home</span><span>Projects</span><span>${PDMS.esc(p.client||p.name)}</span></div>
  <div style="max-width:580px;margin:60px auto;text-align:center">
    <div style="width:80px;height:80px;border-radius:24px;background:linear-gradient(135deg,#7c3aed,#a855f7);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;box-shadow:0 12px 32px rgba(124,58,237,.35)">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h2 style="font-size:22px;font-weight:800;margin:0 0 10px;color:var(--text)">Pending Account Approval</h2>

    <div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;text-align:left;margin-bottom:28px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div><div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--text-soft);margin-bottom:4px">Client</div><div style="font-weight:700;color:var(--text)">${PDMS.esc(p.client||'—')}</div></div>
        <div><div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--text-soft);margin-bottom:4px">Project</div><div style="font-weight:700;color:var(--text)">${PDMS.esc(p.name)}</div></div>
        <div><div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--text-soft);margin-bottom:4px">Type</div><div style="color:var(--text)">${PDMS.esc(p.type||'—')}</div></div>
        <div><div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--text-soft);margin-bottom:4px">Priority</div><div><span class="badge badge-${D.prioColors[p.priority]||'muted'}">${PDMS.esc(p.priority||'—')}</span></div></div>
      </div>
    </div>
    <div style="display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;background:rgba(124,58,237,.08);border:1px solid rgba(124,58,237,.2);border-radius:12px;color:#7c3aed;font-size:13px;font-weight:600;margin-bottom:24px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Awaiting review by the Accounts team
    </div>
    <a href="projects.html#view=delivery" class="btn btn-secondary">← Back to Projects</a>
  </div>`;
} else {
  const user = PDMS.getUser();
  const liveUsers = (window.PDMS_REMOTE && window.PDMS_REMOTE.users) || D.users;
  const liveClients = (window.PDMS_REMOTE && window.PDMS_REMOTE.clients) || D.clients;
  const clientObj = liveClients.find(c => c.name === p.client || c.email === p.client || c.id === p.client);
  const clientName = (clientObj && clientObj.name) || p.client || '—';
  const health = healthOf(p);
  const stages = milestoneStages(p);
  const reviews = projectIssues(p);
  const latest = reviews[0];
  const canUpdate = PDMS.can('Add Remarks');
  const canUploadDoc = canUpdate && !(user && user.role==='HR');
  const isConsultant = user && user.role === 'Consultant';
  const myTasks = isConsultant ? (p.privateTasks||[]).filter(t =>
    (t.ownerName||'').toLowerCase() === (user.name||'').toLowerCase() ||
    (t.ownerId||'') === (user.id||'')
  ) : [];
  const isAssignedConsultant = isConsultant && (
    myTasks.length > 0 ||
    (Array.isArray(p.consultants) && p.consultants.map(n=>String(n).toLowerCase()).includes((user.name||'').toLowerCase()))
  );
  const isPMO = user && user.role==='PMO';
  const myName = (user&&user.name||'').toLowerCase();
  const isAssignedPMO = isPMO && (
    (p.pm||'').toLowerCase()===myName ||
    (p.lead||'').toLowerCase()===myName ||
    (Array.isArray(p.consultants) && p.consultants.map(n=>n.toLowerCase()).includes(myName))
  );
  // Determine effective stage from current status (more reliable than stored stage field,
  // since projects moved from sales still carry stage='Sales' in the sheet).
  const _D = window.PDMS_DATA;
  const pStage = (_D && _D.deliveryStatuses && _D.deliveryStatuses.includes(p.status)) ? 'Delivery'
    : (_D && _D.salesStatuses && _D.salesStatuses.includes(p.status)) ? 'Sales'
    : PDMS.stageOf(p);
  const isDeliveryStage = pStage === 'Delivery';
  const isSalesStage = pStage === 'Sales';
  const canAssign = PDMS.can('Assign Consultant') && isDeliveryStage && (!isPMO || isAssignedPMO);
  const canManageStatus = user && (
    (PDMS.isSalesRole(user) && isSalesStage) ||
    (['HTD','COO','PM Head'].includes(user.role) && isDeliveryStage) ||
    (isPMO && isDeliveryStage && isAssignedPMO)
  );
  const canStartDelivery = PDMS.can('Start Delivery') && isSalesStage && p.status==='Approved';
  const canEditDetails = user && (
    (PDMS.isSalesRole(user) && isSalesStage) ||
    (['HTD','COO','PM Head'].includes(user.role) && isDeliveryStage) ||
    (isPMO && isDeliveryStage && isAssignedPMO)
  );

  document.getElementById('content').innerHTML = `
<div style="border-radius:20px;overflow:hidden;margin-bottom:24px;box-shadow:0 8px 32px rgba(29,60,136,.18)">
    <!-- Hero banner -->
    <div style="background:linear-gradient(135deg,#090d16 0%,#1d3c88 45%,#8b5cf6 80%,#ec4899 100%);padding:28px 28px 24px;position:relative;overflow:hidden">
      <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 80% 50%,rgba(139,92,246,.25) 0%,transparent 60%)"></div>
      <div style="position:relative;z-index:1;display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap">
        <div style="flex:1;min-width:240px">
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
            <span style="background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:3px 10px;font-size:11px;font-weight:600;letter-spacing:.6px">${p.id}</span>
            <span style="background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:3px 10px;font-size:11px;font-weight:600;letter-spacing:.6px">${PDMS.stageOf(p)==='Sales'?'SALES PIPELINE':'DELIVERY'}</span>
            <span class="badge badge-${D.statusColors[p.status]||'muted'}">${p.status}</span>
            <span class="badge ${health.cls}">${health.label}</span>
          </div>
          <h1 style="font-size:26px;font-weight:800;color:#fff;margin:0 0 6px;line-height:1.2;text-wrap:balance">${PDMS.esc(clientName)}</h1>
          <div style="color:rgba(255,255,255,.7);font-size:13px;margin-bottom:14px">${PDMS.esc(p.name)} &nbsp;·&nbsp; ${PDMS.esc(p.type||'—')}</div>
          <p style="color:rgba(255,255,255,.65);font-size:13px;line-height:1.6;max-width:520px;margin:0">${PDMS.esc(p.description||'No description provided.')}</p>
        </div>
        <div style="display:flex;gap:8px;flex-shrink:0;align-self:flex-start">
          ${canStartDelivery?`<button class="btn btn-primary" onclick="startDelivery()" style="background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:#fff">${I('zap')} Start Delivery</button>`:''}
          ${canManageStatus?`<button class="btn btn-primary" onclick="changeStatus()" style="background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:#fff">${I('refresh')} Change Status</button>`:''}
          ${canEditDetails?`<button class="btn btn-primary" onclick="editDetails()" style="background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:#fff">${I('edit')} Edit Details</button>`:''}
        </div>
      </div>
    </div>

    <!-- Metadata strip -->
    <div style="background:var(--surface);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">
      ${[
        {label:'Client', value: p.client||'—'},
        {label:'Workstream', value: p.workstream||p.dept||'—'},
        {label:'Start Date', value: p.start||'TBD'},
        {label:'Planned Completion', value: p.due||'TBD'},
        {label:'Actual Completion', value: p.actualCompletion||'—'},
      ].map((f,i,arr) => `
        <div style="padding:16px 20px;${i<arr.length-1?'border-right:1px solid var(--border)':''}">
          <div style="font-size:11px;font-weight:600;letter-spacing:.6px;color:var(--text-soft);text-transform:uppercase;margin-bottom:5px">${f.label}</div>
          <div style="font-size:14px;font-weight:600;color:var(--text)">${PDMS.esc(f.value)}</div>
        </div>`).join('')}
    </div>
  </div>

  <div class="grid" style="grid-template-columns:2fr 1fr;gap:20px">
    <div class="flex flex-col gap-4">
      <div style="display:grid;grid-template-columns:${isAssignedConsultant?'1fr 1fr':'1fr'};gap:16px">
        <div class="card"><div class="card-head"><div class="card-title">Project Timeline</div></div>
          <div class="card-body">
            <div class="timeline">
              ${stages.map(s=>`<div class="tl-item ${s.state}"><div class="tl-title">${s.label}</div><div class="tl-meta">${s.state==='done'?'Completed':s.state==='active'?'Ongoing':'Upcoming'}</div></div>`).join('')}
            </div>
          </div>
        </div>
        ${isAssignedConsultant ? `
        <div class="card"><div class="card-head"><div class="card-title">Task Timeline</div><div class="card-sub">Your scheduled activities</div></div>
          <div class="card-body">
            <div class="timeline">
              ${myTasks.length ? myTasks.map(t=>{
                const done = t.done===true;
                const today = new Date(); today.setHours(0,0,0,0);
                const td = t.date ? new Date(t.date) : null;
                if(td) td.setHours(0,0,0,0);
                const state = done ? 'done' : !td ? '' : td<today ? 'done' : td.getTime()===today.getTime() ? 'active' : '';
                return `<div class="tl-item ${state}"><div class="tl-title">${PDMS.esc(t.activity||'Task')}</div><div class="tl-meta">${PDMS.esc(t.deliverable||'—')} · ${PDMS.esc(t.date||'No date')}</div></div>`;
              }).join('') : '<div style="text-align:center;padding:24px 0;color:var(--text-muted);font-size:13px">No tasks yet</div>'}
            </div>
          </div>
        </div>` : ''}
      </div>

      ${isAssignedConsultant ? `
      <!-- My Tasks — consultant only -->
      <div class="card">
        <div class="card-head">
          <div><div class="card-title">My Tasks</div><div class="card-sub">Your activities and deliverables for this project</div></div>
          <button class="btn btn-primary btn-sm" onclick="addConsultantTask()">${I('plus')} Add Task</button>
        </div>
        <div style="overflow-x:auto">
          <table class="data">
            <thead><tr><th>Activity</th><th>Deliverable</th><th>Due Date</th><th>Completion Date</th><th>Status</th></tr></thead>
            <tbody>
              ${myTasks.length ? myTasks.map(t=>{
                const done = t.done === true;
                const today = new Date(); today.setHours(0,0,0,0);
                const td = t.dueDate ? new Date(t.dueDate) : null;
                if(td) td.setHours(0,0,0,0);
                const isOverdue = !done && td && td < today;
                const statusLabel = done ? 'Done' : isOverdue ? 'Due' : 'Pending';
                const statusClass = done ? 'badge-success' : isOverdue ? 'badge-danger' : 'badge-muted';
                return `<tr style="cursor:pointer;${done?'opacity:.65':''}" onclick="viewConsultantTask('${t.id}')">
                  <td style="font-weight:600;${done?'text-decoration:line-through;color:var(--text-muted)':''}">${PDMS.esc(t.activity||'—')}</td>
                  <td>${PDMS.esc(t.deliverable||'—')}</td>
                  <td style="${isOverdue?'color:var(--danger);font-weight:600':''}"><span>${PDMS.esc(t.dueDate||'—')}</span></td>
                  <td>${done && t.completedAt ? `<span style="color:var(--success);font-size:12px">${PDMS.esc(t.completedAt)}</span>` : '<span style="color:var(--text-soft);font-size:12px">—</span>'}</td>
                  <td><span class="badge ${statusClass}">${statusLabel}</span></td>
                </tr>`;
              }).join('') : `<tr><td colspan="5" style="text-align:center;padding:28px;color:var(--text-muted);font-size:13px">No tasks yet — click Add Task to get started</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>` : ''}

      <!-- Issues & Remarks — comment section style -->
      <div class="card" style="display:flex;flex-direction:column">
        <div class="card-head">
          <div><div class="card-title">Issues & Remarks</div><div class="card-sub">Visible only on this project</div></div>
        </div>
        <div style="padding:16px 20px;display:flex;flex-direction:column;gap:20px">

          ${canUpdate?`
          <!-- Chat input -->
          <div style="border:1px solid var(--border);border-radius:16px;background:var(--surface-2);display:flex;flex-direction:column;min-height:120px">
            <div style="flex:1"></div>
            <div style="display:flex;gap:10px;align-items:center;padding:10px 14px">
              <div class="avatar" style="width:32px;height:32px;font-size:12px;flex-shrink:0">${PDMS.initials((PDMS.getUser()||{}).name||'?')}</div>
              <textarea id="inlineIssue" rows="2" placeholder="Type an issue or remark…" style="flex:1;border:none;background:transparent;color:var(--text);font-size:13px;font-family:inherit;outline:none;resize:none;line-height:1.5;" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();submitInlineIssue();}"></textarea>
              <button onclick="submitInlineIssue()" title="Send" style="background:var(--primary);color:#fff;border:none;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              </button>
            </div>
          </div>`:''}

          <!-- Comments list -->
          <div>
            <div style="font-size:14px;font-weight:700;color:var(--text);margin-bottom:14px">${reviews.length} comment${reviews.length!==1?'s':''}</div>
            <div style="display:flex;flex-direction:column;gap:12px">
              ${reviews.length ? reviews.map(r=>{
                // Strip legacy "[Late Delivery] Task ... Reason: " prefix if present
                const isLate = r.type==='late-delivery' || r.tag==='Late Delivery' || /^\[Late Delivery\]/.test(r.message||'');
                const reasonMatch = (r.message||'').match(/Reason:\s*(.+)$/s);
                const displayMsg = isLate && reasonMatch ? reasonMatch[1].trim() : (r.message||'');
                return `
                <div style="display:flex;gap:12px;align-items:flex-start">
                  <div class="avatar" style="width:40px;height:40px;font-size:14px;flex-shrink:0">${PDMS.initials(r.author||'?')}</div>
                  <div style="flex:1;background:var(--surface-2);border-radius:10px;padding:12px 16px">
                    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap">
                      <span style="font-size:13px;font-weight:700;color:var(--primary)">${PDMS.esc(r.author||'Unknown')}</span>
                      ${isLate ? `<span style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:2px 7px;border-radius:6px;background:rgba(239,68,68,.1);color:#ef4444;border:1px solid rgba(239,68,68,.2)">Late Delivery</span>` : ''}
                      <span style="font-size:11px;color:var(--text-soft)">${timeAgo(r.time)}</span>
                    </div>
                    <div style="font-size:13px;color:var(--text);line-height:1.6">${PDMS.esc(displayMsg)}</div>
                  </div>
                </div>`;
              }).join('') : `<div style="text-align:center;padding:24px 0;color:var(--text-muted);font-size:13px">${PDMS.emptyOrLoading('No comments yet — be the first to post.')}</div>`}
            </div>
          </div>

        </div>
      </div>
    </div>

    <div class="flex flex-col gap-4">
      <div class="card"><div class="card-head"><div class="card-title">Project Team</div></div>
        <div class="card-body">
          ${(()=>{
            function safeArr(v){if(Array.isArray(v))return v;if(typeof v==='string'&&v.trim().startsWith('[')){try{const r=JSON.parse(v);return Array.isArray(r)?r:[];}catch(e){}}return[];}
            function safeStr(v){if(!v)return '';if(typeof v==='string'&&v.trim().startsWith('[')){try{const r=JSON.parse(v);return Array.isArray(r)?r[0]||'':'';}catch(e){return '';}}return v;}

function applyTaskPatch(taskId, patch){
  if(!p.privateTasks) p.privateTasks = [];
  const idx = p.privateTasks.findIndex(t=>t.id===taskId);
  if(idx!==-1) Object.assign(p.privateTasks[idx], patch);
  // Deep-copy the array NOW before render() can touch it
  const snapshot = JSON.parse(JSON.stringify(p.privateTasks));
  const projectId = p.id;
  render();
  PDMS.api.update('projects', projectId, { privateTasks: snapshot })
    .then(saved=>{ if(saved && Array.isArray(saved.privateTasks)) p.privateTasks = saved.privateTasks; })
    .catch(err=>PDMS.toast('Sync error', err.message||'Changes may not have saved','error'));
}

function markTaskDone(taskId, lateReason){
  const today = new Date().toISOString().slice(0,10);
  const task = (p.privateTasks||[]).find(t=>t.id===taskId);
  const user = PDMS.getUser();

  // Optimistically mark done right away
  applyTaskPatch(taskId, {done:true, completedAt:today});

  if(lateReason && task){
    const record = {
      author: user?user.name:'Unknown', authorRole: user?user.role:'Consultant',
      projectId: p.id, projectName: p.name,
      message: lateReason,
      tag: 'Late Delivery',
      time: new Date().toISOString(), type: 'late-delivery'
    };
    if(!D.issues) D.issues = [];
    // Optimistically add to local issues so it appears immediately in the remarks section
    const tempRecord = Object.assign({ id: 'tmp-'+Date.now() }, record);
    D.issues.unshift(tempRecord);
    if(window.PDMS_REMOTE){ if(!PDMS_REMOTE.issues) PDMS_REMOTE.issues=[]; PDMS_REMOTE.issues.unshift(tempRecord); }
    render();
    PDMS.api.create('issues', record).then(saved=>{
      // Replace temp record with saved one
      const replaceIn = arr => { const i=arr.findIndex(x=>x.id===tempRecord.id); if(i!==-1) arr[i]=saved; };
      replaceIn(D.issues);
      if(window.PDMS_REMOTE && PDMS_REMOTE.issues) replaceIn(PDMS_REMOTE.issues);
    }).catch(()=>{});
  }
}

function toggleConsultantTask(taskId, checked){
  if(!checked){
    applyTaskPatch(taskId, {done:false, completedAt:null});
    return;
  }

  const task = (p.privateTasks||[]).find(t=>t.id===taskId);
  const today = new Date(); today.setHours(0,0,0,0);
  const due = task && task.dueDate ? new Date(task.dueDate) : null;
  if(due) due.setHours(0,0,0,0);

  if(due && today > due){
    const daysLate = Math.ceil((today - due) / 86400000);
    const modal = PDMS.modal('Task Delivered Late',`
      <div style="display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.25);border-radius:10px;margin-bottom:16px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span style="font-size:13px;color:var(--danger)">This task was due on <strong>${PDMS.esc(task.dueDate)}</strong> — <strong>${daysLate} day${daysLate!==1?'s':''} late</strong>.</span>
      </div>
      <p style="font-size:13px;color:var(--text-soft);margin:0 0 14px">Please explain why the task was delivered after its due date. This note will be logged under the project's Issues &amp; Remarks.</p>
      <div class="form-row"><label>Reason for Late Delivery</label><textarea id="lateReason" rows="3" placeholder="e.g. Client feedback required additional revision cycles..."></textarea></div>
    `,`<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="lateConfirmBtn" style="background:var(--danger);border-color:var(--danger)">Submit &amp; Mark Done</button>`);

    modal.querySelector('#lateConfirmBtn').onclick = function(){
      const reason = modal.querySelector('#lateReason').value.trim();
      if(!reason){ PDMS.toast('Required','Please provide a reason for the late delivery','error'); return; }
      modal.remove();
      markTaskDone(taskId, reason);
    };
  } else {
    markTaskDone(taskId, null);
  }
}
window.toggleConsultantTask = toggleConsultantTask;

function pushIssueOptimistic(record){
  if(!D.issues) D.issues = [];
  // PDMS_REMOTE.issues and D.issues may share the same array reference after bootstrap.
  // Push only once: prefer PDMS_REMOTE if it exists, otherwise D.issues.
  const issueArr = (window.PDMS_REMOTE && PDMS_REMOTE.issues) ? PDMS_REMOTE.issues : D.issues;
  if(window.PDMS_REMOTE && !PDMS_REMOTE.issues) PDMS_REMOTE.issues = issueArr;
  if(D.issues !== issueArr) D.issues = issueArr;
  issueArr.unshift(record);
  render();
  PDMS.api.create('issues', record).then(saved=>{
    const i = issueArr.findIndex(x=>x===record);
    if(i!==-1) issueArr[i] = saved;
  }).catch(()=>PDMS.toast('Sync error','Remark may not have saved to the server','error'));
}

        <input type="text" class="chip-role-input" data-name="${PDMS.esc(name)}" value="${PDMS.esc(role)}" placeholder="Role / skill in this project…" style="width:100%;border:none;border-top:1px solid rgba(99,102,241,.2);background:transparent;color:var(--text);font-size:13px;padding:6px 0 2px;outline:none;font-family:inherit"/>
      </div>`).join('');
    modal.querySelectorAll('.assign-chip-x').forEach(btn=>{
      btn.onclick = ()=>{ syncRolesFromDOM(); state.consultantMap = state.consultantMap.filter(e=>e.name!==btn.dataset.name); refreshChips(); };
    });
  }
  refreshChips();

  const pmInput = modal.querySelector('#assignPm'), pmDrop = modal.querySelector('#pmDrop');
  pmInput.oninput = ()=>{ const q=pmInput.value.trim().toLowerCase(); const m=allUsers.filter(u=>u.name.toLowerCase().includes(q)).slice(0,8); if(q&&m.length) showDrop(pmDrop,m,name=>{pmInput.value=name;state.pm=name;hideDrop(pmDrop);}); else hideDrop(pmDrop); };
  pmInput.onblur = ()=>setTimeout(()=>hideDrop(pmDrop),150);
  pmInput.onchange = ()=>{ state.pm=pmInput.value.trim(); };

  const leadInput = modal.querySelector('#assignLead'), leadDrop = modal.querySelector('#leadDrop');
  leadInput.oninput = ()=>{ const q=leadInput.value.trim().toLowerCase(); const m=allUsers.filter(u=>u.name.toLowerCase().includes(q)).slice(0,8); if(q&&m.length) showDrop(leadDrop,m,name=>{leadInput.value=name;state.lead=name;hideDrop(leadDrop);}); else hideDrop(leadDrop); };
  leadInput.onblur = ()=>setTimeout(()=>hideDrop(leadDrop),150);
  leadInput.onchange = ()=>{ state.lead=leadInput.value.trim(); };

  const consultInput = modal.querySelector('#assignConsult'), consultDrop = modal.querySelector('#consultDrop');
  consultInput.oninput = ()=>{
    const q = consultInput.value.trim().toLowerCase();
    if(!q){ hideDrop(consultDrop); return; }
    const taken = state.consultantMap.map(e=>e.name);
    const matches = allUsers.filter(u=>u.name.toLowerCase().includes(q) && !taken.includes(u.name)).slice(0,8);
    showDrop(consultDrop, matches, name=>{ state.consultantMap.push({name, role:''}); consultInput.value=''; hideDrop(consultDrop); refreshChips(); });
  };
  consultInput.onblur = ()=>setTimeout(()=>hideDrop(consultDrop),150);

  modal.querySelector('#saveAssignBtn').onclick = function(){
    syncRolesFromDOM();
    state.pm = pmInput.value.trim() || state.pm;
    state.lead = leadInput.value.trim() || state.lead;
    const consultants = state.consultantMap.map(e=>e.name);
    const consultantRoles = {};
    state.consultantMap.forEach(e=>{ if(e.role) consultantRoles[e.name]=e.role; });
    const btn = this;
    PDMS.setButtonLoading(btn, true, 'Saving…');
    PDMS.api.update('projects',p.id,{pm:state.pm, lead:state.lead, consultants, consultantRoles}).then(saved=>{
      Object.assign(p,saved);
      modal.remove();
      PDMS.toast('Team updated','Assignment saved','success');
      const assignUser = PDMS.getUser();
      const parts = [];
      if(state.pm) parts.push('PM: '+state.pm);
      if(state.lead) parts.push('Lead: '+state.lead);
      if(consultants.length) parts.push(consultants.length+' consultant(s)');
      PDMS.notify('Team Assigned', `${assignUser.name} (${assignUser.role}) assigned team on "${p.name}" — ${parts.join(', ')}`, 'users', 'project-details.html#id='+p.id);
      render();
    }).catch(err=>{ PDMS.setButtonLoading(btn,false); PDMS.toast('Error',err.message||'Could not update assignment','error'); });
  };
}
function uploadDoc(){
  const user = PDMS.getUser();
  const modal = PDMS.modal('Upload Document',`
    <div class="form-row"><label>File</label><input id="docFile" type="file" accept="*/*"/></div>
    <div class="form-row"><label>Description <span style="color:var(--text-soft);font-weight:400">(optional)</span></label><input id="docDesc" placeholder="e.g. Q3 Delivery Plan"/></div>
  `,`<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="docSaveBtn">${I('upload')} Upload</button>`);

  modal.querySelector('#docSaveBtn').onclick = function(){
    const fileInput = modal.querySelector('#docFile');
    const file = fileInput.files[0];
    if(!file){ PDMS.toast('Required','Please select a file','error'); return; }
    const description = modal.querySelector('#docDesc').value.trim();
    const btn = this;
    PDMS.setButtonLoading(btn, true, 'Uploading…');

    const reader = new FileReader();
    reader.onload = function(e){
      const base64 = e.target.result.split(',')[1];
      fetch(PDMS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'uploaddoc', fileName: file.name, mimeType: file.type || 'application/octet-stream', base64 })
      })
      .then(r => r.json())
      .then(json => {
        if(!json.ok) throw new Error(json.error || 'Upload failed');
        const downloadUrl = `https://drive.google.com/uc?export=download&id=${json.data.fileId}`;
        const doc = { name: file.name, url: downloadUrl, fileId: json.data.fileId, description, uploadedBy: user?user.name:'', uploadedAt: new Date().toISOString().slice(0,10) };
        if(!p.documents) p.documents = [];
        p.documents.unshift(doc);
        modal.remove();
        render();
        PDMS.api.update('projects', p.id, { documents: JSON.parse(JSON.stringify(p.documents)) })
          .then(saved=>{ if(saved && Array.isArray(saved.documents)) p.documents = saved.documents; })
          .catch(()=>{});
        PDMS.toast('Uploaded', `"${file.name}" uploaded successfully`, 'success');
      })
      .catch(err=>{ PDMS.setButtonLoading(btn, false); PDMS.toast('Upload failed', err.message||'Could not upload file','error'); });
    };
    reader.readAsDataURL(file);
  };
}
function editDetails(){
  const isSales = PDMS.stageOf(p) === 'Sales';
  const liveClients = (window.PDMS_REMOTE && window.PDMS_REMOTE.clients) || D.clients;
  const clientOpts = liveClients.map(c=>`<option value="${PDMS.esc(c.name)}" ${c.name===p.client?'selected':''}>${PDMS.esc(c.name)}</option>`).join('');
  const typeOpts = D.types.map(t=>`<option ${t===p.type?'selected':''}>${t}</option>`).join('');
  const prioOpts = D.priorities.map(pr=>`<option ${pr===p.priority?'selected':''}>${pr}</option>`).join('');
  const modal = PDMS.modal('Edit Project Details',`
    <div class="form-row"><label>Project Name</label><input id="ed-name" value="${PDMS.esc(p.name||'')}"/></div>
    <div class="form-row"><label>Client</label><select id="ed-client"><option value="">— Select —</option>${clientOpts}</select></div>
    <div class="form-row"><label>Type</label><select id="ed-type"><option value="">— Select —</option>${typeOpts}</select></div>
    <div class="form-row"><label>Workstream</label><input id="ed-workstream" value="${PDMS.esc(p.workstream||p.dept||'')}"/></div>
    <div class="form-row"><label>Priority</label><select id="ed-priority"><option value="">— Select —</option>${prioOpts}</select></div>
    <div class="form-row"><label>Start Date</label><input id="ed-start" type="date" value="${PDMS.esc(p.start||'')}"/></div>
    <div class="form-row"><label>Planned Completion</label><input id="ed-due" type="date" value="${PDMS.esc(p.due||'')}"/></div>
    ${!isSales?`<div class="form-row"><label>Actual Completion</label><input id="ed-actual" type="date" value="${PDMS.esc(p.actualCompletion||'')}"/></div>`:''}
    <div class="form-row"><label>Description</label><textarea id="ed-desc" rows="3" style="resize:vertical">${PDMS.esc(p.description||'')}</textarea></div>
  `,`<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="ed-save">Save Changes</button>`);
  modal.querySelector('#ed-save').onclick = function(){
    const name = modal.querySelector('#ed-name').value.trim();
    if(!name){ PDMS.toast('Required','Project name is required','error'); return; }
    const patch = {
      name,
      client: modal.querySelector('#ed-client').value,
      type: modal.querySelector('#ed-type').value,
      workstream: modal.querySelector('#ed-workstream').value.trim(),
      priority: modal.querySelector('#ed-priority').value,
      start: modal.querySelector('#ed-start').value,
      due: modal.querySelector('#ed-due').value,
      description: modal.querySelector('#ed-desc').value.trim(),
    };
    if(!isSales) patch.actualCompletion = modal.querySelector('#ed-actual').value;
    const btn = this;
    PDMS.setButtonLoading(btn, true, 'Saving...');
    PDMS.api.update('projects', p.id, patch).then(saved=>{
      Object.assign(p, patch);
      modal.remove();
      PDMS.toast('Saved','Project details updated','success');
      renderProject();
    }).catch(err=>{ PDMS.setButtonLoading(btn,false); PDMS.toast('Error',err.message||'Could not save','error'); });
  };
}
function changeStatus(){
  const options = PDMS.statusOptionsFor();
  const modal = PDMS.modal('Change Project Status',`<div class="form-row"><label>New Status</label><select id="ns">${options.map(s=>`<option ${s===p.status?'selected':''}>${s}</option>`).join('')}</select></div>`,
    `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="saveStatusBtn">Update</button>`);
  modal.querySelector('#saveStatusBtn').onclick = function(){
    const newStatus = modal.querySelector('#ns').value;
    if(!PDMS.canChangeStatus(p,newStatus)){
      PDMS.toast('Not allowed',"You don't have permission to set this status",'error');
      return;
    }
    // SLA Signed → sent to Accounts for approval before delivery begins.
    const savedStatus = newStatus === 'SLA Signed' ? 'Awaiting Account Approval' : newStatus;
    const savedStage  = newStatus === 'SLA Signed' ? 'Delivery' : undefined;
    const patch = savedStage ? {status:savedStatus, stage:savedStage} : {status:savedStatus};
    PDMS.api.update('projects',p.id,patch).then(saved=>{
      Object.assign(p,saved);
      modal.remove();
      const label = newStatus === 'SLA Signed' ? 'Sent for Account Approval' : 'Status updated';
      const detail = newStatus === 'SLA Signed' ? `"${p.name}" is awaiting financial approval before delivery begins` : 'Project status has been updated';
      PDMS.toast(label, detail,'success');
      const statusUser = PDMS.getUser();
      PDMS.notify('Status Changed', `${statusUser.name} (${statusUser.role}) changed "${p.name}" status to "${savedStatus}"`, 'refresh', 'project-details.html#id='+p.id);
      render();
    }).catch(err=>PDMS.toast('Error',err.message||'Could not update status','error'));
  };
}
function startDelivery(){
  const modal = PDMS.modal('Start Delivery',`
    <p class="text-sm text-muted" style="margin-bottom:16px">This moves ${PDMS.esc(p.name)} from the Sales pipeline into delivery, starting at "Not Started". You can assign a Project Manager and Lead now or later.</p>
    <style>
      .assign-ac-wrap{position:relative}.assign-ac-wrap input{width:100%;box-sizing:border-box}
      .assign-ac-drop{position:absolute;top:100%;left:0;right:0;z-index:9999;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.12);max-height:180px;overflow-y:auto;display:none}
      .assign-ac-drop.open{display:block}
      .assign-ac-item{padding:8px 12px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:8px}
      .assign-ac-item:hover{background:var(--primary-10,rgba(99,102,241,.08))}
      .assign-ac-avatar{width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
    </style>
    <div class="form-grid">
      <div class="form-row"><label>Project Manager</label>
        <div class="assign-ac-wrap"><input id="startDelPm" autocomplete="off" placeholder="Search by name…"/><div class="assign-ac-drop" id="startPmDrop"></div></div>
      </div>
      <div class="form-row"><label>Project Lead</label>
        <div class="assign-ac-wrap"><input id="startDelLead" autocomplete="off" placeholder="Search by name…"/><div class="assign-ac-drop" id="startLeadDrop"></div></div>
      </div>
    </div>
  `,`<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="startDelBtn">Start Delivery</button>`);

  function acItem(u){ return `<div class="assign-ac-item" data-name="${PDMS.esc(u.name)}"><div class="assign-ac-avatar">${PDMS.initials(u.name)}</div><div><div style="font-weight:600">${PDMS.esc(u.name)}</div><div style="font-size:12px;color:var(--text-muted)">${PDMS.esc(u.role||'')}</div></div></div>`; }
  function wireAc(input, drop){
    input.oninput = ()=>{
      const q = input.value.trim().toLowerCase();
      const hits = D.users.filter(u=>u.name.toLowerCase().includes(q)).slice(0,8);
      if(q && hits.length){ drop.innerHTML = hits.map(acItem).join(''); drop.classList.add('open'); drop.querySelectorAll('.assign-ac-item[data-name]').forEach(el=>{ el.onmousedown=e=>{e.preventDefault();input.value=el.dataset.name;drop.classList.remove('open');}; }); }
      else drop.classList.remove('open');
    };
    input.onblur = ()=>setTimeout(()=>drop.classList.remove('open'),150);
  }
  wireAc(modal.querySelector('#startDelPm'), modal.querySelector('#startPmDrop'));
  wireAc(modal.querySelector('#startDelLead'), modal.querySelector('#startLeadDrop'));

  modal.querySelector('#startDelBtn').onclick = function(){
    const pm = modal.querySelector('#startDelPm').value.trim();
    const lead = modal.querySelector('#startDelLead').value.trim();
    const patch = { stage:'Delivery', status:'Not Started' };
    if(pm) patch.pm = pm;
    if(lead) patch.lead = lead;
    PDMS.api.update('projects',p.id,patch).then(saved=>{
      Object.assign(p,saved);
      modal.remove();
      PDMS.toast('Delivery started', `${p.name} is now being managed by delivery`,'success');
      const delUser = PDMS.getUser();
      PDMS.notify('Delivery Started', `${delUser.name} (${delUser.role}) moved "${p.name}" into delivery`, 'zap', 'project-details.html#id='+p.id);
      render();
    }).catch(err=>PDMS.toast('Error',err.message||'Could not start delivery','error'));
  };
}
window.postProjectReview=postProjectReview;window.submitInlineIssue=submitInlineIssue;window.assignTeam=assignTeam;window.uploadDoc=uploadDoc;window.changeStatus=changeStatus;window.startDelivery=startDelivery;
