<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project Details — PSE PDMS</title>


  <link rel="stylesheet" href="css/style.css?v=1788426378" />
</head>

<body>
  <script src="js/bundle.js?v=1788426378"></script>
  <script>
    // A hash survives any host's clean-URL rewriting untouched, since it's never
    // sent to the server — unlike ?id=, which some static hosts strip on redirect.
    window.addEventListener('hashchange', () => location.reload());
    PDMS.mountShell('projects');
    const D = PDMS_DATA; const I = PDMS.icon;
    let p;

    // Project issues are stored in D.issues — separate from D.reviews (the general
    // community reviews page) so they never appear there.
    function projectIssues(proj) {
      const liveIssues = (window.PDMS_REMOTE && window.PDMS_REMOTE.issues) || D.issues || [];
      return liveIssues.filter(r => String(r.projectId) === String(proj.id)).slice().sort((a, b) => new Date(b.time) - new Date(a.time));
    }
    function timeAgo(iso) {
      if (!iso) return '';
      const diffMs = Date.now() - new Date(iso).getTime();
      const mins = Math.round(diffMs / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return mins + 'm ago';
      const hrs = Math.round(mins / 60);
      if (hrs < 24) return hrs + 'h ago';
      return Math.round(hrs / 24) + 'd ago';
    }
    PDMS.timeAgo = PDMS.relativeTime = timeAgo;
    function healthOf(proj) {
      if (proj.status === 'Completed') return { label: 'Completed', cls: 'badge-success' };
      if (proj.status === 'Cancelled') return { label: 'Cancelled', cls: 'badge-danger' };
      if (proj.status === 'Closed') return { label: 'Closed', cls: 'badge-primary' };
      if (proj.status === 'On Hold') return { label: 'On Hold', cls: 'badge-muted' };

      const _D = window.PDMS_DATA || D;
      const normalizedStatus = PDMS.normalizeStatus ? PDMS.normalizeStatus(proj.status) : proj.status;
      const isPendingSalesHead = proj.status === 'Awaiting Sales Head Approval';
      const pStage = isPendingSalesHead ? 'Sales'
        : (_D && _D.deliveryStatuses && (_D.deliveryStatuses.includes(proj.status) || _D.deliveryStatuses.includes(normalizedStatus))) ? 'Delivery'
          : (PDMS.isSalesStatus && PDMS.isSalesStatus(proj.status)) ? 'Sales'
            : (PDMS.stageOf ? PDMS.stageOf(proj) : 'Delivery');
      const defaultLabel = pStage === 'Sales' ? 'Incoming' : 'In Progress';

      const start = new Date(proj.start), due = new Date(proj.due), today = new Date();
      if (isNaN(start) || isNaN(due) || due <= start) return { label: defaultLabel, cls: 'badge-success' };
      const expected = Math.min(100, Math.max(0, ((today - start) / (due - start)) * 100));
      const gap = expected - (proj.progress || 0);
      if (gap > 25) return { label: 'Delayed', cls: 'badge-danger' };
      if (gap > 10) return { label: 'At Risk', cls: 'badge-warn' };
      return { label: defaultLabel, cls: 'badge-success' };
    }
    function milestoneStages(proj) {
      // 'Approved'/'Rejected'/'On Hold' are outcomes, not sequential steps — they
      // can't all sit in the same line at once. The timeline only ever walks the
      // main sequence, which normally ends at Approved (Sales) / Completed (Delivery).
      const viewer = PDMS.getUser();
      const isConsultantView = viewer && (viewer.role === 'Consultant' || viewer.role === 'PMO');
      const D = window.PDMS_DATA;
      const isPendingSalesHead = proj.status === 'Awaiting Sales Head Approval';
      const hasDeliveryStatus = !isPendingSalesHead && D && D.deliveryStatuses && D.deliveryStatuses.includes(proj.status);
      const hasSalesStatus = isPendingSalesHead || (PDMS.isSalesStatus && PDMS.isSalesStatus(proj.status));
      const isSalesStage = (PDMS.stageOf ? PDMS.stageOf(proj) === 'Sales' : proj.stage === 'Sales') || isPendingSalesHead;
      // Use delivery timeline if the project is currently on a delivery status,
      // or if viewer is a Consultant/PMO (always delivery context).
      const isSales = !isConsultantView && (isPendingSalesHead || isSalesStage || (!hasDeliveryStatus && hasSalesStatus));
      const mainSequence = isSales
        ? ['Lead', 'Opportunity', 'Initial Proposal', 'Negotiation', 'Invoicing', 'Award/SLA', 'Closed']
        : ['Not Started', 'In Progress', 'Awaiting Review', 'Internal Audit', 'External Audit', 'Testing / Quality Assurance', 'Completed'];

      let statusToMatch = proj.status;
      if (isPendingSalesHead) {
        statusToMatch = proj.requestedStatus || proj.targetStatus || 'Lead';
      }
      const status = PDMS.normalizeStatus ? PDMS.normalizeStatus(statusToMatch) : statusToMatch;

      if (status === 'Cancelled') {
        const lastKnown = proj.previousStatus || proj.requestedStatus || proj.targetStatus || 'Lead';
        const normLast = PDMS.normalizeStatus ? PDMS.normalizeStatus(lastKnown) : lastKnown;
        const targetIndex = mainSequence.indexOf(normLast);
        const effectiveIndex = targetIndex === -1 ? 0 : targetIndex;
        return mainSequence.map((label, i) => {
          const isTarget = i === effectiveIndex;
          const isDone = i < effectiveIndex;
          const state = isDone ? 'done' : isTarget ? 'cancelled' : '';
          return {
            label,
            state,
            isCancelled: isTarget,
            meta: isDone ? 'Completed' : isTarget ? 'Cancelled' : 'Upcoming'
          };
        });
      }

      if (status === 'On Hold') {
        // On Hold isn't a fixed slot — it can happen at any point, so position it
        // right after however far progress actually got, not at a fixed spot in the list.
        const stepsBeforeFinal = mainSequence.length - 1;
        const doneCount = Math.min(stepsBeforeFinal, Math.floor(((proj.progress || 0) / 100) * stepsBeforeFinal));
        const result = mainSequence.slice(0, doneCount).map(label => ({ label, state: 'done' }));
        result.push({ label: 'On Hold', state: 'active' });
        mainSequence.slice(doneCount).forEach(label => result.push({ label, state: '' }));
        return result;
      }

      const currentIndex = mainSequence.indexOf(status);
      const effectiveIndex = currentIndex === -1 ? 0 : currentIndex;
      return mainSequence.map((label, i) => {
        const isCurrent = i === effectiveIndex;
        const isDone = i < effectiveIndex;
        const state = isDone ? 'done' : isCurrent ? 'active' : '';
        const isPendingApproval = isPendingSalesHead && isCurrent;
        return {
          label,
          state,
          isPendingApproval,
          meta: state === 'done' ? 'Completed' : state === 'active' ? 'Ongoing' : 'Upcoming'
        };
      });
    }

    function getSubStatuses(project) {
      if (!project) return [];
      if (Array.isArray(project.subStatuses)) return project.subStatuses;
      if (typeof project.subStatuses === 'string' && project.subStatuses.trim()) {
        try {
          const parsed = JSON.parse(project.subStatuses);
          if (Array.isArray(parsed)) return parsed;
        } catch (e) { }
      }
      return project.subStatus ? [project.subStatus] : [];
    }

    function render() {
      const liveProjects = (window.PDMS_REMOTE && window.PDMS_REMOTE.projects) || D.projects;
      const hasProjects = Array.isArray(liveProjects) && liveProjects.length > 0;
      const id = hasProjects ? new URLSearchParams(location.hash.replace(/^#/, '')).get('id') || liveProjects[0].id : null;
      p = hasProjects ? liveProjects.find(x => x.id === id) || liveProjects[0] : null;

      if (!p) {
        document.getElementById('content').innerHTML = window.PDMS_REMOTE ? `
    <div class="page-head"><div><div class="breadcrumbs"><span>Home</span><span>Projects</span></div>
      <h1 class="page-title">No Project Data</h1><div class="page-sub">You currently do not have any project records.</div></div>
      <div class="flex gap-2"><a class="btn btn-primary" href="projects.html">Open Projects</a></div></div>
    <div class="card"><div class="card-body"><p class="text-muted">Add your own project data in <code>js/data.js</code> or use the template structure to populate this app.</p></div></div>
  ` : `
    <div class="page-head"><div><div class="breadcrumbs"><span>Home</span><span>Projects</span></div>
      <h1 class="page-title">Loading Project...</h1><div class="page-sub">Fetching your project data</div></div></div>
    <div class="card"><div class="card-body pdms-loading-inline"><span class="pdms-spinner"></span>Loading...</div></div>
  `;
      } else if ((p.accountsRejectionNote || p.rejectionNote) && p.status !== 'Cancelled' && !p.salesHeadRejectionNote) {
        // Accounts rejected this — show locked rejection page for EVERYONE including lead owner
        // Lead owner gets inline Update Details & Resend to Accounts + Documents
        const fromVal = new URLSearchParams(location.hash.replace(/^#/, '')).get('from');
        const breadcrumbText = fromVal === 'accounts' ? 'Awaiting Projects' : fromVal === 'sales' ? 'Sales Pipeline' : 'Projects';
        const reviews = projectIssues(p);
        const canUpdate = PDMS.can('Add Remarks');
        const user = PDMS.getUser();
        const isLeadOwner = user && PDMS.isSalesRole(user) && PDMS.projectOwnedByUser(p, user);
        const dealOwner = p.projectOwnerName || (p.sales && p.sales !== 'Sales Team' ? p.sales : '') || p.salesOwnerName || p.onboardedByName || p.createdByUserName || p.sales || '—';
        const rejNote = p.accountsRejectionNote || p.rejectionNote;
        const docs = Array.isArray(p.documents) ? p.documents : [];
        document.getElementById('content').innerHTML = `
  <div class="breadcrumbs" style="margin-bottom:20px"><span>Home</span><span>${breadcrumbText}</span><span>${PDMS.esc(p.client || p.name)}</span></div>
  <div style="max-width:960px;margin:30px auto 40px">
    <div style="background:rgba(239,68,68,0.07);border:1.5px solid rgba(239,68,68,0.25);border-radius:20px;padding:24px 28px;margin-bottom:24px">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px">
        <div style="width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#ef4444,#b91c1c);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 8px 24px rgba(239,68,68,.3)">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </div>
        <div>
          <div style="font-size:18px;font-weight:800;color:var(--text);margin-bottom:2px">Returned by Accounts</div>
          <div style="font-size:13px;color:var(--text-soft)">This Award/SLA was reviewed and returned for revision</div>
        </div>
      </div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-bottom:16px">
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:#ef4444;margin-bottom:5px">Accounts Feedback / Reason</div>
        <div style="font-size:13px;line-height:1.6;color:var(--text);font-weight:500">${PDMS.esc(rejNote)}</div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));gap:16px;margin-bottom:16px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 20px">
        <div><div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--text-soft);margin-bottom:3px">Client</div><div style="font-weight:700;color:var(--text);font-size:14px">${PDMS.esc(p.client || '—')}</div></div>
        <div><div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--text-soft);margin-bottom:3px">Deal Owner</div><div style="font-weight:700;color:var(--text);font-size:14px">${PDMS.esc(dealOwner)}</div></div>
        <div><div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--text-soft);margin-bottom:3px">Status / Stage</div><div><span class="badge badge-danger">Returned / Rejected</span></div></div>
        <div><div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--text-soft);margin-bottom:3px">Type</div><div style="font-weight:600;color:var(--text);font-size:13px">${PDMS.esc(p.type || '—')}</div></div>
        <div><div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--text-soft);margin-bottom:3px">Workstream / Dept</div><div style="font-weight:600;color:var(--text);font-size:13px">${PDMS.esc(p.workstream || p.dept || '—')}</div></div>
        <div><div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--text-soft);margin-bottom:3px">Opportunity Value</div><div style="font-weight:700;color:var(--text);font-size:14px">${Number.isFinite(Number(p.opportunityValue || p.negotiatedPrice)) && Number(p.opportunityValue || p.negotiatedPrice) > 0 ? PDMS.currency(p.opportunityValue || p.negotiatedPrice) : '—'}</div></div>
        <div><div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--text-soft);margin-bottom:3px">Award Value (excl. VAT)</div><div style="font-weight:800;color:var(--primary);font-size:15px">${Number.isFinite(Number(p.awardValue || p.negotiatedPrice)) && Number(p.awardValue || p.negotiatedPrice) > 0 ? PDMS.currency(p.awardValue || p.negotiatedPrice) : '—'}</div></div>
        <div style="grid-column:1/-1;border-top:1px solid var(--border);padding-top:12px;margin-top:2px">
          <div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--text-soft);margin-bottom:4px">Project Description</div>
          <div style="font-size:13px;color:var(--text);line-height:1.6">${PDMS.esc(p.description || 'No description provided.')}</div>
        </div>
      </div>
      ${isLeadOwner ? `
      <div style="margin-top:18px;padding-top:16px;border-top:1px solid var(--border);display:flex;gap:10px;flex-wrap:wrap">
        <button onclick="resendToAccountsInline()" style="display:inline-flex;align-items:center;gap:8px;padding:10px 20px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 4px 16px rgba(99,102,241,.25)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
          Update Details &amp; Resend to Accounts
        </button>
        <a href="projects.html#view=sales" style="display:inline-flex;align-items:center;gap:6px;padding:10px 16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;font-size:13px;font-weight:600;color:var(--text);text-decoration:none">← Back to Pipeline</a>
      </div>` : ''}
    </div>

    ${isLeadOwner ? `
    <div class="card" style="margin-bottom:20px">
      <div class="card-head"><div><div class="card-title">Documents</div><div class="card-sub">${docs.length} file${docs.length !== 1 ? 's' : ''} attached</div></div><button class="btn btn-secondary btn-sm" onclick="uploadDoc()">${I('upload')} Upload</button></div>
      <div style="padding:16px 20px">
        ${docs.length ? docs.map(d => `
        <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)">
          <div style="width:36px;height:36px;background:rgba(99,102,241,.1);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0">${I('file')}</div>
          <div style="flex:1;min-width:0">
            <div class="font-semi text-sm" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${PDMS.esc(d.name || d.description || 'Document')}</div>
            <div class="text-sm text-muted">${PDMS.esc(d.description || '')}${d.uploadedBy ? ' · ' + PDMS.esc(d.uploadedBy) : ''}${d.uploadedAt ? ' · ' + PDMS.esc(d.uploadedAt) : ''}</div>
          </div>
          ${d.url ? `<a href="${PDMS.esc(d.url)}" target="_blank" style="font-size:12px;font-weight:600;color:var(--primary);text-decoration:none">View</a>` : ''}
        </div>`).join('') : `<div class="text-muted text-sm" style="text-align:center;padding:24px 0">${PDMS.emptyOrLoading('No documents uploaded yet')}</div>`}
      </div>
    </div>` : ''}

    <div class="card">
      <div class="card-head"><div><div class="card-title">Issues &amp; Remarks</div><div class="card-sub">Visible only on this project</div></div></div>
      <div style="padding:16px 20px;display:flex;flex-direction:column;gap:20px">
        ${canUpdate ? `
        <div style="border:1px solid var(--border);border-radius:16px;background:var(--surface-2);display:flex;flex-direction:column;min-height:120px">
          <div style="flex:1"></div>
          <div style="display:flex;gap:10px;align-items:center;padding:10px 14px">
            <div class="avatar" style="width:32px;height:32px;font-size:12px;flex-shrink:0">${PDMS.initials((PDMS.getUser() || {}).name || '?')}</div>
            <textarea id="inlineIssue" rows="2" placeholder="Type an issue or remark…" style="flex:1;border:none;background:transparent;color:var(--text);font-size:13px;font-family:inherit;outline:none;resize:none;line-height:1.5;" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();submitInlineIssue();}"></textarea>
            <button onclick="submitInlineIssue()" title="Send" style="background:var(--primary);color:#fff;border:none;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
        </div>` : ''}
        <div>
          <div style="font-size:14px;font-weight:700;color:var(--text);margin-bottom:14px">${reviews.length} comment${reviews.length !== 1 ? 's' : ''}</div>
          <div style="display:flex;flex-direction:column;gap:12px">
            ${reviews.length ? reviews.map(r => {
          const isRejection = /^\[Rejection Reason\]/.test(r.message || '');
          const displayMsg = (r.message || '').replace(/^\[(Rejection Reason|Resubmission Note)\]\s*/, '');
          return `<div class="activity" style="${isRejection ? 'border-left:3px solid var(--danger);background:rgba(239,68,68,.04);padding:10px 14px;border-radius:0 10px 10px 0' : ''}">
                <div class="avatar" style="width:32px;height:32px;font-size:12px;${isRejection ? 'background:var(--danger)' : ''}">${PDMS.initials(r.author || '?')}</div>
                <div style="flex:1">
                  <div style="display:flex;align-items:center;gap:8px;margin-bottom:2px">
                    <span class="font-semi" style="font-size:13px">${PDMS.esc(r.author || 'User')}</span>
                    ${r.authorRole ? `<span class="badge badge-muted" style="font-size:10px">${PDMS.esc(r.authorRole)}</span>` : ''}
                    ${isRejection ? `<span class="badge badge-danger" style="font-size:10px">Accounts Feedback</span>` : ''}
                    <span class="text-muted" style="font-size:11px;margin-left:auto">${r.time ? timeAgo(r.time) : ''}</span>
                  </div>
                  <div class="text-sm" style="color:var(--text);line-height:1.5">${PDMS.esc(displayMsg)}</div>
                </div>
              </div>`;
        }).join('') : '<div style="color:var(--text-soft);font-size:13px;text-align:center;padding:24px 0">No remarks yet.</div>'}
          </div>
        </div>
      </div>
    </div>
  </div>`;

      } else if ((p.status === 'Cancelled' || p.salesHeadRejectionNote) && !p.accountsRejectionNote) {
        // Sales Head rejected this — show locked rejection page for EVERYONE including lead owner
        // Lead owner gets inline Edit & Resend Request + Documents
        const fromVal = new URLSearchParams(location.hash.replace(/^#/, '')).get('from');
        const breadcrumbText = fromVal === 'sales' ? 'Sales Pipeline' : 'Projects';
        const reviews = projectIssues(p);
        const canUpdate = PDMS.can('Add Remarks');
        const user = PDMS.getUser();
        const isLeadOwner = user && PDMS.isSalesRole(user) && PDMS.projectOwnedByUser(p, user);
        const dealOwner = p.projectOwnerName || (p.sales && p.sales !== 'Sales Team' ? p.sales : '') || p.salesOwnerName || p.onboardedByName || p.createdByUserName || p.sales || '—';
        const targetStage = p.requestedStatus || p.targetStatus || 'Lead';
        const rejNote = p.salesHeadRejectionNote || p.rejectionNote || 'No rejection note provided.';
        const docs = Array.isArray(p.documents) ? p.documents : [];
        document.getElementById('content').innerHTML = `
  <div class="breadcrumbs" style="margin-bottom:20px"><span>Home</span><span>${breadcrumbText}</span><span>${PDMS.esc(p.client || p.name)}</span></div>
  <div style="max-width:960px;margin:30px auto 40px">
    <div style="background:rgba(239,68,68,0.07);border:1.5px solid rgba(239,68,68,0.25);border-radius:20px;padding:24px 28px;margin-bottom:24px">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px">
        <div style="width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#ef4444,#b91c1c);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 8px 24px rgba(239,68,68,.3)">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </div>
        <div>
          <div style="font-size:18px;font-weight:800;color:var(--text);margin-bottom:2px">Rejected by Sales Head</div>
          <div style="font-size:13px;color:var(--text-soft)">This status change request was reviewed and returned for revision</div>
        </div>
      </div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-bottom:16px">
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:#ef4444;margin-bottom:5px">Sales Head Feedback / Reason</div>
        <div style="font-size:13px;line-height:1.6;color:var(--text);font-weight:500">${PDMS.esc(rejNote)}</div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));gap:16px;margin-bottom:16px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 20px">
        <div><div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--text-soft);margin-bottom:3px">Client</div><div style="font-weight:700;color:var(--text);font-size:14px">${PDMS.esc(p.client || '—')}</div></div>

  `, `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="ctSaveBtn">Save Task</button>`);
      modal.querySelector('#ctSaveBtn').onclick = function () {
        const btn = this;
        const activity = modal.querySelector('#ctActivity').value.trim();
        const deliverable = modal.querySelector('#ctDeliverable').value.trim();
        const dueDate = modal.querySelector('#ctDueDate').value;
        if (!activity || !deliverable || !dueDate) { PDMS.toast('Missing fields', 'Please fill in all fields', 'error'); return; }
        const task = { id: 'T-' + Math.floor(1000 + Math.random() * 9000), activity, deliverable, dueDate, done: false, completedAt: null, ownerId: user?.id || '', ownerName: user?.name || '' };
        if (!p.privateTasks) p.privateTasks = [];
        p.privateTasks.unshift(task);
        modal.remove();
        render();
        PDMS.api.update('projects', p.id, { privateTasks: p.privateTasks })
          .then(saved => { if (saved && saved.privateTasks) p.privateTasks = saved.privateTasks; })

    function editConsultantTask(taskId) {
      const task = (p.privateTasks || []).find(t => t.id === taskId);
      if (!task) return;
      const modal = PDMS.modal('Edit Task', `
    <div class="form-row"><label>Activity</label><input id="etActivity" value="${PDMS.esc(task.activity || '')}"/></div>
    <div class="form-row"><label>Deliverable</label><input id="etDeliverable" value="${PDMS.esc(task.deliverable || '')}"/></div>
    <div class="form-row"><label>Due Date</label><input id="etDueDate" type="date" value="${PDMS.esc(task.dueDate || '')}"/></div>
  `, `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="etSaveBtn">Save Changes</button>`);
      modal.querySelector('#etSaveBtn').onclick = function () {
        const btn = this;
        const activity = modal.querySelector('#etActivity').value.trim();
        const deliverable = modal.querySelector('#etDeliverable').value.trim();
        const dueDate = modal.querySelector('#etDueDate').value;
        if (!activity || !deliverable || !dueDate) { PDMS.toast('Missing fields', 'Please fill in all fields', 'error'); return; }
        if (!p.privateTasks) p.privateTasks = [];
        const idx = p.privateTasks.findIndex(t => t.id === taskId);
        if (idx !== -1) Object.assign(p.privateTasks[idx], { activity, deliverable, dueDate });
        modal.remove();
        render();
        PDMS.api.update('projects', p.id, { privateTasks: p.privateTasks })
          .then(saved => { if (saved && saved.privateTasks) p.privateTasks = saved.privateTasks; })
          .catch(err => PDMS.toast('Sync error', err.message || 'Changes may not have saved', 'error'));
      };
    }

    function viewConsultantTask(taskId) {
      const task = (p.privateTasks || []).find(t => t.id === taskId);
      if (!task) return;
      const done = task.done === true;
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const td = task.dueDate ? new Date(task.dueDate) : null;
      if (td) td.setHours(0, 0, 0, 0);
      const isOverdue = !done && td && td < today;

        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
          <span class="badge ${statusClass}" style="font-size:11px">${statusLabel}</span>
          ${isOverdue ? `<span style="font-size:12px;color:var(--danger);font-weight:600">${daysLate} day${daysLate !== 1 ? 's' : ''} overdue</span>` : ''}
        </div>
        <div style="font-size:18px;font-weight:800;color:var(--text);line-height:1.3">${PDMS.esc(task.activity || '—')}</div>
      </div>
    </div>

    <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:16px">
      <div style="padding:14px 18px;border-bottom:1px solid var(--border)">
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text-soft);margin-bottom:5px">Deliverable</div>
        <div style="font-size:14px;color:var(--text);line-height:1.5">${PDMS.esc(task.deliverable || '—')}</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--border)">
        <div style="padding:14px 18px;border-right:1px solid var(--border)">
          <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text-soft);margin-bottom:5px">Due Date</div>
          <div style="font-size:14px;font-weight:600;${isOverdue ? 'color:var(--danger)' : 'color:var(--text)'}">${PDMS.esc(task.dueDate || '—')}</div>
        </div>
        <div style="padding:14px 18px">
          <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text-soft);margin-bottom:5px">Completion Date</div>
          <div style="font-size:14px;font-weight:600;${done ? 'color:var(--success)' : 'color:var(--text-soft)'}">${done && task.completedAt ? PDMS.esc(task.completedAt) : '—'}</div>
        </div>
      </div>
    </div>
  `, done
        ? `<button class="btn btn-ghost" data-close>Close</button>`
        : `<button class="btn btn-ghost" data-close>Close</button>
       <button class="btn btn-secondary" id="vtEditBtn">${I('edit')} Edit Task</button>
       <button class="btn btn-primary" id="vtDoneBtn" style="background:${accentColor};border-color:${accentColor}">${I('check')} Mark as Complete</button>`
      );

      if (!done) {
        modal.querySelector('#vtEditBtn').onclick = function () {
          modal.remove();
          editConsultantTask(taskId);
        };
        modal.querySelector('#vtDoneBtn').onclick = function () {
          modal.remove();
          toggleConsultantTask(taskId, true);
        };
      }
    }
    window.viewConsultantTask = viewConsultantTask;

    function applyTaskPatch(taskId, patch) {
      if (!p.privateTasks) p.privateTasks = [];
      const idx = p.privateTasks.findIndex(t => t.id === taskId);
      if (idx !== -1) Object.assign(p.privateTasks[idx], patch);
      // Deep-copy the array NOW before render() can touch it
      const snapshot = JSON.parse(JSON.stringify(p.privateTasks));
      const projectId = p.id;
      render();
      PDMS.api.update('projects', projectId, { privateTasks: snapshot })
        .then(saved => { if (saved && Array.isArray(saved.privateTasks)) p.privateTasks = saved.privateTasks; })
        .catch(err => PDMS.toast('Sync error', err.message || 'Changes may not have saved', 'error'));
    }

    function markTaskDone(taskId, lateReason) {
      const today = new Date().toISOString().slice(0, 10);
      const task = (p.privateTasks || []).find(t => t.id === taskId);
      const user = PDMS.getUser();

      // Optimistically mark done right away
      applyTaskPatch(taskId, { done: true, completedAt: today });

      if (lateReason && task) {
        const record = {
          author: user ? user.name : 'Unknown', authorRole: user ? user.role : 'Consultant',
          projectId: p.id, projectName: p.name,
          message: lateReason,
          tag: 'Late Delivery',
          time: new Date().toISOString(), type: 'late-delivery'
        };
        if (!D.issues) D.issues = [];
        // Optimistically add to local issues so it appears immediately in the remarks section
        const tempRecord = Object.assign({ id: 'tmp-' + Date.now() }, record);
        D.issues.unshift(tempRecord);
        if (window.PDMS_REMOTE) { if (!PDMS_REMOTE.issues) PDMS_REMOTE.issues = []; PDMS_REMOTE.issues.unshift(tempRecord); }
        render();
        PDMS.api.create('issues', record).then(saved => {
          // Replace temp record with saved one
          const replaceIn = arr => { const i = arr.findIndex(x => x.id === tempRecord.id); if (i !== -1) arr[i] = saved; };
          replaceIn(D.issues);
          if (window.PDMS_REMOTE && PDMS_REMOTE.issues) replaceIn(PDMS_REMOTE.issues);
        }).catch(() => { });
      }
    }

    function toggleConsultantTask(taskId, checked) {
      if (!checked) {
        applyTaskPatch(taskId, { done: false, completedAt: null });
        return;
      }

      const task = (p.privateTasks || []).find(t => t.id === taskId);
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const due = task && task.dueDate ? new Date(task.dueDate) : null;
      if (due) due.setHours(0, 0, 0, 0);

      if (due && today > due) {
        const daysLate = Math.ceil((today - due) / 86400000);
        const modal = PDMS.modal('Task Delivered Late', `
      <div style="display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.25);border-radius:10px;margin-bottom:16px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span style="font-size:13px;color:var(--danger)">This task was due on <strong>${PDMS.esc(task.dueDate)}</strong> — <strong>${daysLate} day${daysLate !== 1 ? 's' : ''} late</strong>.</span>
      </div>
      <p style="font-size:13px;color:var(--text-soft);margin:0 0 14px">Please explain why the task was delivered after its due date. This note will be logged under the project's Issues &amp; Remarks.</p>
      <div class="form-row"><label>Reason for Late Delivery</label><textarea id="lateReason" rows="3" placeholder="e.g. Client feedback required additional revision cycles..."></textarea></div>
    `, `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="lateConfirmBtn" style="background:var(--danger);border-color:var(--danger)">Submit &amp; Mark Done</button>`);

        modal.querySelector('#lateConfirmBtn').onclick = function () {
          const reason = modal.querySelector('#lateReason').value.trim();
          if (!reason) { PDMS.toast('Required', 'Please provide a reason for the late delivery', 'error'); return; }
          modal.remove();
          markTaskDone(taskId, reason);
        };
      } else {
        markTaskDone(taskId, null);
      }
    }
    window.toggleConsultantTask = toggleConsultantTask;

    function pushIssueOptimistic(record) {
      if (!D.issues) D.issues = [];
      // PDMS_REMOTE.issues and D.issues may share the same array reference after bootstrap.
      // Push only once: prefer PDMS_REMOTE if it exists, otherwise D.issues.
      const issueArr = (window.PDMS_REMOTE && PDMS_REMOTE.issues) ? PDMS_REMOTE.issues : D.issues;
      if (window.PDMS_REMOTE && !PDMS_REMOTE.issues) PDMS_REMOTE.issues = issueArr;
      if (D.issues !== issueArr) D.issues = issueArr;
      issueArr.unshift(record);
      render();
      PDMS.api.create('issues', record).then(saved => {
        const i = issueArr.findIndex(x => x === record);
        if (i !== -1) issueArr[i] = saved;
      }).catch(() => PDMS.toast('Sync error', 'Remark may not have saved to the server', 'error'));
    }

    function postProjectReview() {

        modal.remove();
        pushIssueOptimistic(record);
        PDMS.notify('Project Issue', `${record.author} raised an issue on "${p.name}"`, 'message', 'project-details.html#id=' + p.id, '', '', p.id);

    function assignTeam() {

        return `
      <style>

        </div>

      }

      const modal = PDMS.modal('Assign Team', buildModal(),
        `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="saveAssignBtn">Save Assignment</button>`);

      function acItem(name, role) { return `<div class="assign-ac-item" data-name="${PDMS.esc(name)}"><div class="assign-ac-avatar">${PDMS.initials(name)}</div><div><div style="font-weight:600">${PDMS.esc(name)}</div><div style="font-size:12px;color:var(--text-muted)">${PDMS.esc(role || '')}</div></div></div>`; }
      function showDrop(drop, items, onPick) {
        drop.innerHTML = items.map(u => acItem(u.name, u.role)).join('') || '<div class="assign-ac-item" style="color:var(--text-muted)">No matches</div>';
        drop.classList.add('open');
        drop.querySelectorAll('.assign-ac-item[data-name]').forEach(el => { el.onmousedown = e => { e.preventDefault(); onPick(el.dataset.name); }; });
      }
      function hideDrop(drop) { drop.classList.remove('open'); }

      function syncRolesFromDOM() {
        modal.querySelectorAll('.chip-role-input').forEach(inp => {
          const entry = state.consultantMap.find(e => e.name === inp.dataset.name);
          if (entry) entry.role = inp.value.trim();
        });

      function refreshChips() {
        syncRolesFromDOM();
        modal.querySelector('#consultChips').innerHTML = state.consultantMap.map(({ name, role }) => `
      <div class="assign-chip" style="flex-direction:column;align-items:flex-start;padding:6px 10px;border-radius:10px;gap:2px">
        <div style="display:flex;align-items:center;gap:6px;width:100%">

      refreshChips();

      const pmInput = modal.querySelector('#assignPm'), pmDrop = modal.querySelector('#pmDrop');

      const leadInput = modal.querySelector('#assignLead'), leadDrop = modal.querySelector('#leadDrop');

    function uploadDoc() {

      modal.querySelector('#docSaveBtn').onclick = function () {
        let url = modal.querySelector('#docUrl').value.trim();
        if (!url) { PDMS.toast('Required', 'Please enter a link / URL', 'error'); return; }
        if (!/^https?:\/\//i.test(url)) {
          url = 'https://' + url;
        }
        const description = modal.querySelector('#docDesc').value.trim();
        let name = description;
        if (!name) {
          try {
            const parsed = new URL(url);
            const pathParts = parsed.pathname.split('/').filter(Boolean);
            name = pathParts.length ? decodeURIComponent(pathParts[pathParts.length - 1]) : parsed.hostname;
          } catch (e) {
            name = 'Document';
          }
        }
        const btn = this;
        PDMS.setButtonLoading(btn, true, 'Uploading…');

        const doc = {
          name: name || 'Document',
          url,
          description: description || '',
          uploadedBy: user ? user.name : '',
          uploadedAt: new Date().toISOString().slice(0, 10)
        };

        if (!p.documents) p.documents = [];
        p.documents.unshift(doc);
        modal.remove();
        render();

        PDMS.api.update('projects', p.id, { documents: JSON.parse(JSON.stringify(p.documents)) })
          .then(saved => {
            if (saved && Array.isArray(saved.documents)) p.documents = saved.documents;
            PDMS.toast('Uploaded', `"${doc.name}" uploaded successfully`, 'success');
          })
          .catch(err => {
            PDMS.toast('Error', err.message || 'Could not save document', 'error');
          });
      };

    function editDetails() {

      const isSalesHeadEdit = !!(user && user.role === 'Sales Head' && isSales);
      const priceLocked = isSalesEdit && !isSalesHeadEdit;
      const liveClients = (window.PDMS_REMOTE && window.PDMS_REMOTE.clients) || D.clients || [];
      const currentClient = p.client || p.name || '';
      const clientExists = liveClients.some(c => (c.name || c) === currentClient);
      const clientOpts = `
        ${!clientExists && currentClient ? `<option value="${PDMS.esc(currentClient)}" selected>${PDMS.esc(currentClient)}</option>` : ''}
        ${liveClients.map(c => {
          const cName = c.name || c;
          return `<option value="${PDMS.esc(cName)}" ${cName === currentClient ? 'selected' : ''}>${PDMS.esc(cName)}</option>`;
        }).join('')}
      `;
      const typeOpts = D.types.map(t => `<option ${t === p.type ? 'selected' : ''}>${t}</option>`).join('');
      const prioOpts = D.priorities.map(pr => `<option ${pr === p.priority ? 'selected' : ''}>${pr}</option>`).join('');

            p.priceUpdatePending = false;
            const user = PDMS.getUser();
            const record = { id: 'tmp-' + Date.now(), author: user ? user.name : 'Sales Head', authorRole: user ? user.role : 'Sales Head', projectId: p.id, projectName: p.name, message: `[Rejection Reason] ${reason}`, time: new Date().toISOString() };
            pushIssueOptimistic(record);
            modal.remove();
            PDMS.toast('Rejected', `"${p.name}" has been rejected by Sales Head.`, 'warn');
            PDMS.workflowNotify('lead.rejected', p, { reason });
            render();
          })
          .catch(err => {
            PDMS.setButtonLoading(btn2, false);
            PDMS.toast('Error', err.message || 'Could not reject project', 'error');
          });
      };
    }

    window.approveProjectInline = approveProjectInline; window.rejectProjectInline = rejectProjectInline;
    window.approveSalesHeadInline = approveSalesHeadInline; window.rejectSalesHeadInline = rejectSalesHeadInline;
  </script>
</body>

</html>
