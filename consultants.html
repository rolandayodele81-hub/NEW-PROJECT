<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Consultants — PSE PDMS</title>
  
  
<link rel="stylesheet" href="css/style.css?v=1789049499"/>
</head>

<body>
  <script src="js/bundle.js?v=1789049499"></script>
  <script>
    PDMS.mountShell('consultants');
    const D = PDMS_DATA; const I = PDMS.icon;

    function getUser() {
      return PDMS.getUser();
    }

    function isAssignedConsultant(project, user) {
      if (!user) return false;
      const consultantNames = Array.isArray(project.consultants) ? project.consultants.map(String) : [];
      const userName = String(user.name || '').toLowerCase();
      const userEmail = String(user.email || '').toLowerCase();
      return consultantNames.some(name => {
        const value = String(name).trim().toLowerCase();
        return value === userName || value === userEmail;
      });
    }

    function consultantProjects(user) {
      if (!user) return [];
      return (D.projects || []).filter(project => isAssignedConsultant(project, user));
    }

    function projectDocs(project) {
      const user = PDMS.getUser();
      const raw = Array.isArray(project.documents) ? project.documents : [];
      return PDMS.visibleDocs ? PDMS.visibleDocs(raw, user) : raw;
    }

    function projectTasks(project, user) {
      return (project.privateTasks || []).filter(task => {
        const ownerId = String(task.ownerId || '').trim();
        const ownerName = String(task.ownerName || '').trim().toLowerCase();
        const currentName = String(user?.name || '').trim().toLowerCase();
        const currentId = String(user?.id || '').trim();
        return ownerId === currentId || ownerName === currentName || ownerId === currentName;
      }).sort((a, b) => new Date(a.date || '2999-12-31') - new Date(b.date || '2999-12-31'));
    }

    function projectNotifications(project, user) {
      return (D.notifications || []).filter(notification => {
        const sameProject = String(notification.projectId || '') === String(project.id || '');
        const recipient = String(notification.recipientId || notification.recipient || '').trim();
        return sameProject && (!recipient || recipient === String(user?.id || '') || recipient === String(user?.name || ''));
      }).sort((a, b) => new Date(b.time || 0) - new Date(a.time || 0));
    }

    function projectReviews(project) {
      return (D.reviews || []).filter(review => String(review.projectId || '') === String(project.id || '')).sort((a, b) => new Date(b.time || 0) - new Date(a.time || 0));
    }

    function saveProject(project, patch) {
      return PDMS.api.update('projects', project.id, patch).then(saved => {
        Object.assign(project, saved);
        return project;
      });
    }

    function renderProjectCard(project, user) {
      const docs = projectDocs(project);
      const tasks = projectTasks(project, user);
      const notifications = projectNotifications(project, user);
      const reviews = projectReviews(project);
      return `
        <div class="card" style="margin-bottom:16px">
          <div class="card-head">
            <div>
              <div class="card-title">${PDMS.esc(project.name || project.id)}</div>
              <div class="card-sub">${PDMS.esc(project.client || 'Client')} • ${PDMS.esc(project.status || 'Active')}</div>
            </div>
            <div class="flex gap-2">
              <button class="btn btn-secondary btn-sm" onclick="uploadDeliveryPlan('${project.id}')">${I('upload')} Delivery Plan</button>
            </div>
          </div>
          <div class="card-body">
            <div class="grid grid-2 mb-3" style="gap:16px">
              <div>
                <div class="text-sm text-muted mb-2">Project Overview</div>
                <div class="text-sm">${PDMS.esc(project.description || 'No summary yet.')}</div>
                <div class="mt-2 text-sm text-muted">PM: ${PDMS.esc(project.pm || 'Unassigned')} • Lead: ${PDMS.esc(project.lead || 'Unassigned')}</div>
              </div>
              <div>
                <div class="text-sm text-muted mb-2">Private Tasks</div>
                <button class="btn btn-secondary btn-sm mb-2" onclick="addPrivateTask('${project.id}')">${I('plus')} Add Task</button>
                ${tasks.length ? tasks.map(task => `<div style="padding:8px 0;border-bottom:1px solid var(--border)"><div class="font-semi text-sm">${PDMS.esc(task.activity || 'Task')}</div><div class="text-sm text-muted">Deliverable: ${PDMS.esc(task.deliverable || '—')}</div><div class="text-sm text-muted">Date: ${PDMS.esc(task.date || 'TBD')}</div></div>`).join('') : '<div class="text-muted text-sm">No private tasks assigned yet.</div>'}
              </div>
            </div>

            <div class="card" style="margin-bottom:12px">
              <div class="card-head"><div class="card-title">Delivery Plan Documents</div></div>
              <div class="card-body">
                ${docs.length ? docs.map((doc, idx) => `
                  <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)">
                    <div onclick="${doc.url ? `PDMS.viewDoc('${PDMS.esc(doc.url)}', '${PDMS.esc(doc.fileName || doc.name || 'document')}', '${PDMS.esc(doc.fileType || '')}')` : ''}" style="width:36px;height:36px;border-radius:8px;background:rgba(29,60,136,.1);display:flex;align-items:center;justify-content:center;color:var(--primary);flex-shrink:0;cursor:${doc.url ? 'pointer' : 'default'}">
                      ${I('file')}
                    </div>
                    <div onclick="${doc.url ? `PDMS.viewDoc('${PDMS.esc(doc.url)}', '${PDMS.esc(doc.fileName || doc.name || 'document')}', '${PDMS.esc(doc.fileType || '')}')` : ''}" style="flex:1;min-width:0;cursor:${doc.url ? 'pointer' : 'default'}">
                      <div class="font-semi text-sm" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)">${PDMS.esc(doc.name || doc.description || 'Document')}</div>
                      <div class="text-xs text-muted">${PDMS.esc(doc.description || '')}${doc.uploadedBy ? ' · ' + PDMS.esc(doc.uploadedBy) : ''}${doc.uploadedAt ? ' · ' + PDMS.esc(new Date(doc.uploadedAt).toLocaleDateString()) : ''}${doc.fileSize ? ' · ' + PDMS.formatBytes(doc.fileSize) : ''}</div>
                    </div>
                    <div class="flex items-center gap-1" style="flex-shrink:0">
                      ${doc.url ? `<button type="button" class="btn btn-primary btn-sm" onclick="PDMS.viewDoc('${PDMS.esc(doc.url)}', '${PDMS.esc(doc.fileName || doc.name || 'document')}', '${PDMS.esc(doc.fileType || '')}')" title="View document directly" style="display:inline-flex;align-items:center;gap:4px">${I('eye')} View</button>` : ''}
                      ${doc.url ? `<button type="button" class="btn btn-secondary btn-sm" onclick="PDMS.downloadDoc('${PDMS.esc(doc.url)}', '${PDMS.esc(doc.fileName || doc.name || 'document')}')" title="Download document" style="display:inline-flex;align-items:center;gap:4px">${I('download')} Download</button>` : ''}
                      ${PDMS.isDocOwner(doc, user) ? `<button type="button" class="btn btn-ghost btn-sm" style="color:var(--danger);padding:4px 8px" onclick="deleteConsultantDoc('${project.id}', '${doc.id || idx}')" title="Delete document"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button>` : ''}
                    </div>
                  </div>`).join('') : '<div class="text-muted text-sm" style="text-align:center;padding:16px 0">No delivery plan documents uploaded yet.</div>'}
              </div>
            </div>

            <div class="card" style="margin-bottom:12px">
              <div class="card-head"><div class="card-title">Issues & Remarks</div></div>
              <div class="card-body">
                <button class="btn btn-secondary btn-sm mb-3" onclick="addProjectRemark('${project.id}')">${I('message')} Add Remark</button>
                ${reviews.length ? reviews.map(review => `<div style="padding:8px 0;border-bottom:1px solid var(--border)"><div class="flex items-center gap-2"><div class="font-semi text-sm">${PDMS.esc(review.author || 'Unknown')}</div><div class="text-sm text-muted" style="margin-left:auto">${PDMS.esc(review.time ? new Date(review.time).toLocaleString() : '')}</div></div><div class="text-sm mt-1">${PDMS.esc(review.message || '')}</div></div>`).join('') : '<div class="text-muted text-sm">No issues or remarks for this project yet.</div>'}
              </div>
            </div>

            <div class="card" style="margin-bottom:12px">
              <div class="card-head"><div class="card-title">Project Notifications</div></div>
              <div class="card-body">
                ${notifications.length ? notifications.map(notification => `<div style="padding:8px 0;border-bottom:1px solid var(--border)"><div class="font-semi text-sm">${PDMS.esc(notification.title || 'Notification')}</div><div class="text-sm text-muted">${PDMS.esc(notification.message || '')}</div></div>`).join('') : '<div class="text-muted text-sm">No project notifications yet.</div>'}
              </div>
            </div>
          </div>
        </div>`;
    }

    function getAllUserTasks(user) {
      const allTasks = [];
      (consultantProjects(user) || []).forEach(project => {
        const tasks = projectTasks(project, user) || [];
        tasks.forEach(task => {
          allTasks.push(Object.assign({}, task, { projectId: project.id, projectName: project.name }));
        });
      });
      return allTasks.sort((a, b) => new Date(a.date || '2999-12-31') - new Date(b.date || '2999-12-31'));
    }

    function renderMyTasks(user) {
      const allTasks = getAllUserTasks(user);
      const today = new Date(); today.setHours(0,0,0,0);
      const rows = allTasks.map(task => {
        const taskDate = task.date ? new Date(task.date) : null;
        if(taskDate) taskDate.setHours(0,0,0,0);
        let statusLabel='Upcoming', statusClass='badge-muted';
        if(task.done || task.status === 'Completed' || task.status === 'Done'){
          statusLabel='Done'; statusClass='badge-success';
        } else if(taskDate){
          if(taskDate < today){ statusLabel='Overdue'; statusClass='badge-danger'; }
          else if(taskDate.getTime()===today.getTime()){ statusLabel='Today'; statusClass='badge-warn'; }
        }
        return `<tr>
          <td><div style="font-weight:600;color:var(--text)">${PDMS.esc(task.activity||'—')}</div></td>
          <td>${PDMS.esc(task.deliverable||'—')}</td>
          <td><span style="font-size:12px;color:var(--primary);font-weight:600">${PDMS.esc(task.projectName||'—')}</span></td>
          <td>${task.date||'—'}</td>
          <td><span class="badge ${statusClass}">${statusLabel}</span></td>
        </tr>`;
      }).join('');
      return `<div class="card mb-4">
        <div class="card-head">
          <div><div class="card-title">My Tasks</div><div class="card-sub">Activities and deliverables across all assigned projects</div></div>
          <button class="btn btn-primary btn-sm" onclick="addTaskGlobal()">${I('plus')} Add Task</button>
        </div>
        <div style="overflow-x:auto">
          <table class="data">
            <thead><tr><th>Activity</th><th>Deliverable</th><th>Project</th><th>Date</th><th>Status</th></tr></thead>
            <tbody>${rows||`<tr><td colspan="5" style="text-align:center;padding:28px;color:var(--text-muted);font-size:13px">No tasks yet — click Add Task to get started</td></tr>`}</tbody>
          </table>
        </div>
      </div>`;
    }

    let selectedConsultantFilter = '';

    function selectConsultantFilter(filterType) {
      if (selectedConsultantFilter === filterType) {
        selectedConsultantFilter = '';
      } else {
        selectedConsultantFilter = filterType;
      }
      render();
    }
    window.selectConsultantFilter = selectConsultantFilter;

    function renderConsultantWorkspace(user) {
      const projects = consultantProjects(user);
      document.getElementById('content').innerHTML = `
        <div class="page-head"><div><div class="breadcrumbs"><span>Home</span><span>Consultants</span></div>
          <h1 class="page-title">My Projects</h1><div class="page-sub">Assigned projects, delivery plans, private tasks, and project-specific remarks.</div></div></div>
        <div class="grid grid-3 mb-4">
          <a class="stat i-primary" href="projects.html" title="View all your assigned projects">
            <div class="label">Current Projects</div>
            <div class="value">${projects.filter(p=>p.status!=='Completed'&&p.status!=='Closed'&&p.status!=='Cancelled').length}</div>
            <div class="delta">All active projects</div>
            <div class="icon-wrap">${I('folder')}</div>
          </a>
          <a class="stat i-success" href="projects.html#status=In Progress" title="Filter in-progress projects">
            <div class="label">In Progress</div>
            <div class="value">${projects.filter(p=>p.status==='In Progress').length}</div>
            <div class="delta">Active delivery</div>
            <div class="icon-wrap">${I('activity')}</div>
          </a>
          <a class="stat i-info" href="projects.html#status=Completed" title="Filter completed projects">
            <div class="label">Completed</div>
            <div class="value">${projects.filter(p=>p.status==='Completed').length}</div>
            <div class="delta">Delivered</div>
            <div class="icon-wrap">${I('check')}</div>
          </a>
        </div>
        ${renderMyTasks(user)}
        ${projects.length ? projects.map(project => renderProjectCard(project, user)).join('') : '<div class="card"><div class="card-body"><div class="text-muted">You are not assigned to any projects yet.</div></div></div>'}`;
    }

    function renderConsultantDirectory() {
      const currentUser = getUser();
      const isPMO = currentUser && currentUser.role === 'PMO';
      const liveUsers = (window.PDMS_REMOTE && window.PDMS_REMOTE.users) || D.users;
      const liveProjects = (window.PDMS_REMOTE && window.PDMS_REMOTE.projects) || D.projects;

      const allConsultants = liveUsers.filter(u => u.role === 'Consultant').slice().sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), undefined, { sensitivity: 'base', numeric: true }));

      const myName = (currentUser?.name || '').trim().toLowerCase();
      const myEmail = (currentUser?.email || '').trim().toLowerCase();
      const myId = String(currentUser?.id || '').trim().toLowerCase();

      const myProjects = liveProjects.filter(p => {
        const pm = (p.pm || '').trim().toLowerCase();
        const lead = (p.lead || '').trim().toLowerCase();
        const consultantsList = Array.isArray(p.consultants) ? p.consultants.map(n => String(n).trim().toLowerCase()) : [];
        const ownerId = String(p.projectOwnerId || p.onboardedById || p.createdByUserId || '').trim().toLowerCase();
        const ownerName = String(p.projectOwnerName || p.onboardedByName || p.createdByUserName || '').trim().toLowerCase();
        return pm === myName || pm === myEmail || lead === myName || lead === myEmail ||
               consultantsList.includes(myName) || consultantsList.includes(myEmail) ||
               (myId && ownerId === myId) || (myName && ownerName === myName);
      });

      const myConsultantSet = new Set();
      myProjects.forEach(p => {
        if (Array.isArray(p.consultants)) {
          p.consultants.forEach(c => {
            if (c) myConsultantSet.add(String(c).trim().toLowerCase());
          });
        }
        if (p.lead) myConsultantSet.add(String(p.lead).trim().toLowerCase());
        if (p.pm) myConsultantSet.add(String(p.pm).trim().toLowerCase());
      });

      const isMyConsultantFn = c => {
        const cName = (c.name || '').trim().toLowerCase();
        const cEmail = (c.email || '').trim().toLowerCase();
        return myConsultantSet.has(cName) || myConsultantSet.has(cEmail);
      };

      const hasProjectsFn = c => {
        const rName = (c.name || '').toLowerCase();
        const rEmail = (c.email || '').toLowerCase();
        const n = liveProjects.filter(p => (p.pm || '').toLowerCase() === rName || (p.lead || '').toLowerCase() === rName || (Array.isArray(p.consultants) && p.consultants.some(x => { const val = String(x).toLowerCase(); return val === rName || val === rEmail; }))).length;
        return n > 0;
      };

      const myConsultantsCount = allConsultants.filter(c => isMyConsultantFn(c)).length;
      const withProjCount = allConsultants.filter(c => hasProjectsFn(c)).length;
      const withoutProjCount = allConsultants.length - withProjCount;

      const customFilter = selectedConsultantFilter === 'myConsultants'
        ? (c => isMyConsultantFn(c))
        : (selectedConsultantFilter === 'withProj'
          ? (c => hasProjectsFn(c))
          : (selectedConsultantFilter === 'withoutProj'
            ? (c => !hasProjectsFn(c))
            : null));

      document.getElementById('content').innerHTML = `
        <div class="page-head"><div><div class="breadcrumbs"><span>Home</span><span>Consultants</span></div>
          <h1 class="page-title">Consultants</h1><div class="page-sub">${isPMO ? 'Consultant resource directory and engagement tracking' : 'Resource pool availability and specialties'}</div></div></div>
        <div class="grid grid-4 mb-4">
          <div class="stat i-primary ${!selectedConsultantFilter ? 'active-filter' : ''}" onclick="selectConsultantFilter('')" title="Click to show all consultants" style="cursor:pointer">
            <div class="label">Total Consultants</div>
            <div class="value">${allConsultants.length}</div>
            <div class="delta">All specialists</div>
            <div class="icon-wrap">${I('users')}</div>
          </div>
          <div class="stat i-purple ${selectedConsultantFilter === 'myConsultants' ? 'active-filter' : ''}" onclick="selectConsultantFilter('myConsultants')" title="Click to filter consultants on your projects" style="cursor:pointer">
            <div class="label">My Consultants</div>
            <div class="value" style="color:#7c3aed">${myConsultantsCount}</div>
            <div class="delta" style="color:#7c3aed">On my engagements</div>
            <div class="icon-wrap" style="background:linear-gradient(135deg,#8b5cf6,#7c3aed)">${I('briefcase')}</div>
          </div>
          <div class="stat i-success ${selectedConsultantFilter === 'withProj' ? 'active-filter' : ''}" onclick="selectConsultantFilter('withProj')" title="Click to filter consultants with assigned projects" style="cursor:pointer">
            <div class="label">With Projects</div>
            <div class="value">${withProjCount}</div>
            <div class="delta">Active on engagements</div>
            <div class="icon-wrap">${I('folder')}</div>
          </div>
          <div class="stat i-warn ${selectedConsultantFilter === 'withoutProj' ? 'active-filter' : ''}" onclick="selectConsultantFilter('withoutProj')" title="Click to filter unassigned consultants on bench" style="cursor:pointer">
            <div class="label">Without Projects</div>
            <div class="value">${withoutProjCount}</div>
            <div class="delta">Bench / Available</div>
            <div class="icon-wrap">${I('activity')}</div>
          </div>
        </div>
        <div id="tbl" class="table-wrap"></div>`;
      PDMS.renderTable(document.getElementById('tbl'), {
        columns: [
          { key: 'name', label: 'Consultant', render: r => `<div class="flex items-center gap-2"><div class="avatar avatar-sm">${PDMS.initials(r.name)}</div><div><div class="font-semi">${PDMS.esc(r.name)}</div><div class="text-sm text-muted">${PDMS.esc(r.email)}</div></div></div>` },
          { key: 'dept', label: 'Designation', render: r => PDMS.esc(r.dept || r.specialty || 'Consultant') },
          { key: 'projects', label: 'Projects', render: r => {
            const rName = (r.name || '').toLowerCase();
            const rEmail = (r.email || '').toLowerCase();
            const allAssigned = liveProjects.filter(p => (p.pm || '').toLowerCase() === rName || (p.lead || '').toLowerCase() === rName || (Array.isArray(p.consultants) && p.consultants.some(c => { const val = String(c).toLowerCase(); return val === rName || val === rEmail; })));
            const myAssigned = myProjects.filter(p => (p.pm || '').toLowerCase() === rName || (p.lead || '').toLowerCase() === rName || (Array.isArray(p.consultants) && p.consultants.some(c => { const val = String(c).toLowerCase(); return val === rName || val === rEmail; })));
            const n = allAssigned.length;
            if (n === 0) return '<span class="badge badge-muted">Bench / Available</span>';
            return `<span class="badge badge-primary">${n} project${n!==1?'s':''}</span>${isPMO && myAssigned.length > 0 ? ` <span class="badge badge-purple" style="margin-left:4px;font-size:10px;padding:2px 6px">${myAssigned.length} on mine</span>` : ''}`;
          }},
          { key: 'dateOfEntry', label: 'Date of Entry', render: r => PDMS.esc(r.dateOfEntry || r.joined || '—') }
        ], rows: allConsultants, searchKeys: ['name', 'dept', 'email'],
        defaultSortKey: 'name',
        defaultSortDir: 1,
        customFilter: customFilter,
        rowHref: r => 'user-details.html#id=' + encodeURIComponent(r.id || '') + (r.email ? '&email=' + encodeURIComponent(r.email) : ''),
        filterOptions: []
      });
    }

    function render() {
      const user = getUser();
      if (user && user.role === 'Consultant') {
        renderConsultantWorkspace(user);
      } else {
        renderConsultantDirectory();
      }
    }

    function uploadDeliveryPlan(projectId) {
      const user = getUser();
      const project = (D.projects || []).find(item => String(item.id) === String(projectId));
      if (!project) return;
      let selectedFile = null;

      const modal = PDMS.modal('Upload Delivery Plan / Document', `
        <div class="form-row">
          <label style="display:flex;justify-content:space-between;align-items:center">
            <span>Select File <span style="color:var(--danger)">*</span></span>
            <span class="text-xs text-muted">Max 25MB</span>
          </label>
          <div id="planDropzone" class="file-dropzone" style="margin-top:4px">
            <div class="file-dropzone-icon">${I('upload')}</div>
            <div style="font-weight:600;font-size:13px;color:var(--text);margin-top:4px">Click or drag & drop a file here</div>
            <div class="text-xs text-muted">Supports PDF, Word, Excel, PowerPoint, Images, CSV, etc.</div>
            <input type="file" id="planFileInput" style="display:none" />
          </div>
          <div id="planSelectedBox" class="file-selected-box" style="display:none">
            <div style="width:36px;height:36px;border-radius:8px;background:rgba(29,60,136,.1);display:flex;align-items:center;justify-content:center;color:var(--primary);flex-shrink:0">
              ${I('file')}
            </div>
            <div class="file-info">
              <div class="file-name" id="planSelectedName"></div>
              <div class="file-size" id="planSelectedSize"></div>
            </div>
            <button type="button" class="file-remove-btn" id="planRemoveFileBtn" title="Remove file">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
        </div>
        <div class="form-row" style="margin-top:14px">
          <label>Description / Title <span style="color:var(--text-soft);font-weight:400">(optional)</span></label>
          <input id="planDescription" placeholder="e.g. Delivery plan v1" autocomplete="off" />
        </div>
      `, `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="savePlanBtn" disabled>${I('upload')} Upload File</button>`);

      const dropzone = modal.querySelector('#planDropzone');
      const fileInput = modal.querySelector('#planFileInput');
      const selectedBox = modal.querySelector('#planSelectedBox');
      const selectedNameEl = modal.querySelector('#planSelectedName');
      const selectedSizeEl = modal.querySelector('#planSelectedSize');
      const removeBtn = modal.querySelector('#planRemoveFileBtn');
      const descInput = modal.querySelector('#planDescription');
      const saveBtn = modal.querySelector('#savePlanBtn');

      function handleFile(file) {
        if (!file) return;
        selectedFile = file;
        selectedNameEl.textContent = file.name;
        selectedSizeEl.textContent = PDMS.formatBytes ? PDMS.formatBytes(file.size) : (Math.round(file.size / 1024) + ' KB');
        dropzone.style.display = 'none';
        selectedBox.style.display = 'flex';
        saveBtn.disabled = false;
        if (!descInput.value.trim()) {
          const baseName = file.name.replace(/\.[^/.]+$/, '');
          descInput.value = baseName;
        }
      }

      dropzone.onclick = () => fileInput.click();
      fileInput.onchange = (e) => {
        if (e.target.files && e.target.files[0]) handleFile(e.target.files[0]);
      };
      dropzone.ondragover = (e) => { e.preventDefault(); dropzone.classList.add('dragover'); };
      dropzone.ondragleave = (e) => { e.preventDefault(); dropzone.classList.remove('dragover'); };
      dropzone.ondrop = (e) => {
        e.preventDefault();
        dropzone.classList.remove('dragover');
        if (e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
      };
      removeBtn.onclick = (e) => {
        e.stopPropagation();
        selectedFile = null;
        fileInput.value = '';
        selectedBox.style.display = 'none';
        dropzone.style.display = 'flex';
        saveBtn.disabled = true;
      };

      saveBtn.onclick = function () {
        if (!selectedFile) {
          PDMS.toast('File Required', 'Please choose a file to upload', 'error');
          return;
        }
        const btn = this;
        PDMS.setButtonLoading(btn, true, 'Uploading…');

        const reader = new FileReader();
        reader.onerror = () => {
          PDMS.setButtonLoading(btn, false);
          PDMS.toast('Error', 'Failed to read file', 'error');
        };
        reader.onload = () => {
          const result = reader.result;
          const base64 = typeof result === 'string' && result.includes(',') ? result.split(',')[1] : result;
          const mimeType = selectedFile.type || 'application/octet-stream';
          const fileName = selectedFile.name;
          const description = descInput.value.trim() || fileName;

          PDMS.api.uploadDoc(fileName, mimeType, base64)
            .then(res => {
              const url = (res && res.url) ? res.url : (result || '#');
              const doc = {
                id: 'DOC-' + Math.floor(1000 + Math.random() * 9000),
                name: description || fileName,
                fileName: fileName,
                url: url,
                description: description !== fileName ? description : '',
                fileSize: selectedFile.size,
                fileType: mimeType,
                uploadedAt: new Date().toISOString().slice(0, 10),
                uploadedBy: user?.name || 'Consultant',
                uploadedByEmail: user?.email || '',
                uploadedByRole: user?.role || 'Consultant',
                uploaderId: user?.id || ''
              };
              const documents = projectDocs(project);
              documents.unshift(doc);
              return saveProject(project, { documents }).then(() => {
                modal.remove();
                PDMS.toast('Uploaded', `"${doc.name}" uploaded successfully`, 'success');
                render();
              });
            })
            .catch(err => {
              PDMS.setButtonLoading(btn, false);
              PDMS.toast('Error', err.message || 'Could not upload document', 'error');
            });
        };
        reader.readAsDataURL(selectedFile);
      };
    }

    function deleteConsultantDoc(projectId, docIdOrIdx) {
      const user = getUser();
      const project = (D.projects || []).find(item => String(item.id) === String(projectId));
      if (!project) return;
      const documents = projectDocs(project);
      let docIndex = -1;
      if (typeof docIdOrIdx === 'number') {
        docIndex = docIdOrIdx;
      } else {
        docIndex = documents.findIndex((d, i) => String(d.id || i) === String(docIdOrIdx) || String(d.url) === String(docIdOrIdx));
      }
      if (docIndex < 0 || docIndex >= documents.length) return;
      const targetDoc = documents[docIndex];
      if (!PDMS.isDocOwner(targetDoc, user)) {
        PDMS.toast('Permission Denied', 'You can only delete documents that you uploaded', 'error');
        return;
      }

      PDMS.confirm(
        'Delete Document',
        `Are you sure you want to delete "${PDMS.esc(targetDoc.name || targetDoc.description || 'Document')}"? This action cannot be undone.`,
        () => {
          documents.splice(docIndex, 1);
          saveProject(project, { documents }).then(() => {
            PDMS.toast('Deleted', 'Document removed successfully', 'success');
            render();
          }).catch(err => PDMS.toast('Error', err.message || 'Could not delete document', 'error'));
        }
      );
    }

    function addPrivateTask(projectId) {
      const user = getUser();
      const project = (D.projects || []).find(item => String(item.id) === String(projectId));
      if (!project) return;
      const modal = PDMS.modal('Add Private Task', `<div class="form-row"><label>Activity</label><input id="taskActivity" placeholder="e.g. Analysis" /></div><div class="form-row"><label>Deliverable</label><input id="taskDeliverable" placeholder="e.g. Draft report" /></div><div class="form-row"><label>Date</label><input id="taskDate" type="date" /></div>`, `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="saveTaskBtn">Save</button>`);
      modal.querySelector('#saveTaskBtn').onclick = function () {
        const activity = modal.querySelector('#taskActivity').value.trim();
        const deliverable = modal.querySelector('#taskDeliverable').value.trim();
        const date = modal.querySelector('#taskDate').value;
        if (!activity || !deliverable || !date) {
          PDMS.toast('Missing fields', 'Please fill in the activity, deliverable, and date', 'error');
          return;
        }
        const task = { id: 'T-' + Math.floor(1000 + Math.random() * 9000), activity, deliverable, date, ownerId: user?.id || '', ownerName: user?.name || '' };
        const privateTasks = Array.isArray(project.privateTasks) ? project.privateTasks.slice() : [];
        privateTasks.unshift(task);
        saveProject(project, { privateTasks }).then(() => {
          modal.remove();
          PDMS.toast('Saved', 'Private task added for your view and the project manager', 'success');
          render();
        }).catch(err => PDMS.toast('Error', err.message || 'Could not save task', 'error'));
      };
    }

    function addProjectRemark(projectId) {
      const user = getUser();
      const project = (D.projects || []).find(item => String(item.id) === String(projectId));
      if (!project) return;
      const modal = PDMS.modal('Add Issue / Remark', `<div class="form-row"><label>Your update</label><textarea id="remarkMessage" rows="4" placeholder="Share a project-specific issue or remark..."></textarea></div>`, `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="saveRemarkBtn">Post</button>`);
      modal.querySelector('#saveRemarkBtn').onclick = function () {
        const message = modal.querySelector('#remarkMessage').value.trim();
        if (!message) {
          PDMS.toast('Empty remark', 'Please write something first', 'error');
          return;
        }
        const record = {
          id: 'RV-' + Math.floor(1000 + Math.random() * 9000),
          author: user?.name || 'Consultant',
          authorRole: user?.role || 'Consultant',
          projectId: project.id,
          projectName: project.name,
          message,
          time: new Date().toISOString(),
          comments: []
        };
        PDMS.api.create('reviews', record).then(saved => {
          D.reviews.unshift(saved);
          modal.remove();
          PDMS.toast('Posted', 'Remark posted for this project only', 'success');
          render();
        }).catch(err => PDMS.toast('Error', err.message || 'Could not post remark', 'error'));
      };
    }

    function addTaskGlobal() {
      const user = getUser();
      const projects = consultantProjects(user);
      if (!projects.length) { PDMS.toast('No projects', 'You have no assigned projects to add tasks to', 'error'); return; }
      const projectOptions = projects.map(p => `<option value="${PDMS.esc(p.id)}">${PDMS.esc(p.name)}</option>`).join('');
      const modal = PDMS.modal('Add Task', `
        <div class="form-row"><label>Project</label><select id="taskProject">${projectOptions}</select></div>
        <div class="form-row"><label>Activity</label><input id="taskActivity" placeholder="e.g. Requirements analysis"/></div>
        <div class="form-row"><label>Deliverable</label><input id="taskDeliverable" placeholder="e.g. Analysis report"/></div>
        <div class="form-row"><label>Date</label><input id="taskDate" type="date"/></div>
      `, `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="saveTaskBtn">Save Task</button>`);
      modal.querySelector('#saveTaskBtn').onclick = function () {
        const projectId = modal.querySelector('#taskProject').value;
        const activity = modal.querySelector('#taskActivity').value.trim();
        const deliverable = modal.querySelector('#taskDeliverable').value.trim();
        const date = modal.querySelector('#taskDate').value;
        if (!activity || !deliverable || !date) {
          PDMS.toast('Missing fields', 'Please fill in all fields', 'error'); return;
        }
        const project = (D.projects || []).find(p => String(p.id) === String(projectId));
        if (!project) return;
        const task = { id: 'T-' + Math.floor(1000 + Math.random() * 9000), activity, deliverable, date, ownerId: user?.id || '', ownerName: user?.name || '' };
        const privateTasks = Array.isArray(project.privateTasks) ? project.privateTasks.slice() : [];
        privateTasks.unshift(task);
        saveProject(project, { privateTasks }).then(() => {
          modal.remove();
          PDMS.toast('Saved', 'Task added successfully', 'success');
          render();
        }).catch(err => PDMS.toast('Error', err.message || 'Could not save task', 'error'));
      };
    }

    window.uploadDeliveryPlan = uploadDeliveryPlan;
    window.deleteConsultantDoc = deleteConsultantDoc;
    window.addPrivateTask = addPrivateTask;
    window.addProjectRemark = addProjectRemark;
    window.addTaskGlobal = addTaskGlobal;
    PDMS.onRefresh(render);
  </script>
</body>

</html>
