<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PMO Dashboard — PSE PDMS</title>
  
  
  <link rel="stylesheet" href="css/style.css?v=1788961869"/>
  <style>
    .pmo-hero {
      display: grid;
      grid-template-columns: 1.3fr 0.7fr;
      gap: 20px;
      padding: 24px 26px;
      border-radius: 28px;
      background: linear-gradient(135deg, #090d16 0%, #1d3c88 40%, #8b5cf6 75%, #ec4899 100%);
      color: #fff;
      position: relative;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(29, 60, 136, .25);
      margin-bottom: 24px;
    }

    .pmo-hero::before {
      content: "";
      position: absolute;
      inset: -20% -10% auto auto;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(255, 255, 255, .2), rgba(255, 255, 255, 0) 70%);
      filter: blur(10px);
      animation: drift 8s ease-in-out infinite alternate;
    }

    .pmo-hero-copy { position: relative; z-index: 1 }

    .pmo-hero-card {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px;
      border-radius: 20px;
      background: rgba(255, 255, 255, .12);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, .18);
    }

    @keyframes drift {
      from { transform: translate3d(0, 0, 0) }
      to   { transform: translate3d(-20px, -10px, 0) }
    }

    @media(max-width:900px) {
      .pmo-hero { grid-template-columns: 1fr }
      .pmo-hero-card { margin-top: 8px }
    }
  </style>
</head>

<body>
  <script src="js/bundle.js?v=1788961869"></script>
  <script>
    PDMS.mountShell('dashboard');
    const D = PDMS_DATA; const I = PDMS.icon;

    function myProjects() {
      const lp = (window.PDMS_REMOTE && window.PDMS_REMOTE.projects) || D.projects;
      const user = PDMS.getUser();
      if (!user) return [];
      const myName = (user.name || '').toLowerCase();
      const myEmail = (user.email || '').toLowerCase();
      const myId = String(user.id || '').toLowerCase();
      const res = lp.filter(p => {
        const consultants = Array.isArray(p.consultants) ? p.consultants.map(n => String(n).toLowerCase()) : [];
        return (p.pm || '').toLowerCase() === myName
          || (p.pm || '').toLowerCase() === myEmail
          || (p.lead || '').toLowerCase() === myName
          || (p.lead || '').toLowerCase() === myEmail
          || consultants.includes(myName)
          || consultants.includes(myEmail)
          || consultants.includes(myId)
          || (PDMS.projectOwnedByUser && PDMS.projectOwnedByUser(p, user));
      });
      return PDMS.sortNewestFirst ? PDMS.sortNewestFirst(res.slice()) : res;
    }

    function render() {
      const user = PDMS.getUser();
      const projects = myProjects();
      const getDeliveryStatus = p => PDMS.deliveryStatusOf ? PDMS.deliveryStatusOf(p) : (p.deliveryStatus || p.status || 'Not Started');
      const isClosedStatus = st => ['Closure', 'Project Closure'].includes(st);
      const isOngoingStatus = st => st && st !== 'Not Started' && st !== 'Completed' && !isClosedStatus(st) && st !== 'On Hold' && st !== 'Cancelled';

      const notStarted = projects.filter(p => getDeliveryStatus(p) === 'Not Started' || p.status === 'Not Started').length;
      const ongoing = projects.filter(p => isOngoingStatus(getDeliveryStatus(p))).length;
      const onHold = projects.filter(p => getDeliveryStatus(p) === 'On Hold' || p.status === 'On Hold').length;
      const completed = projects.filter(p => getDeliveryStatus(p) === 'Completed').length;
      const closed = projects.filter(p => isClosedStatus(getDeliveryStatus(p))).length;
      const cancelled = projects.filter(p => getDeliveryStatus(p) === 'Cancelled' || p.status === 'Cancelled').length;
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const in14 = new Date(today); in14.setDate(in14.getDate() + 14);
      const dueSoon = projects.filter(p => {
        const st = getDeliveryStatus(p);
        if (!p.due || st === 'Completed' || isClosedStatus(st) || st === 'On Hold' || st === 'Cancelled') return false;
        const d = new Date(p.due); return d >= today && d <= in14;
      }).length;

      document.getElementById('content').innerHTML = `
  <div class="pmo-hero">
    <div class="pmo-hero-copy">
      <h1 class="page-title" style="font-size:30px;line-height:1.1;margin-top:10px">Good day, ${PDMS.esc((user.name||'').split(' ')[0])} 👋</h1>
      <p class="page-sub" style="font-size:14px;max-width:640px;color:rgba(255,255,255,.9);margin-top:8px">Manage timelines, track deliverables, monitor project status and report incidents on your assigned projects.</p>
      <div class="hero-actions">
        <a class="btn btn-primary" href="projects.html">${I('folder')} My Projects</a>
        <a class="btn btn-secondary" href="consultants.html" style="background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.18)">${I('users')} View Consultants</a>
      </div>
    </div>
    <div class="pmo-hero-card">
      <div>
        <div class="hero-card-title">My Project Load</div>
        <div class="hero-card-text">${projects.length} assigned project${projects.length !== 1 ? 's' : ''} · ${dueSoon} due within 14 days.</div>
        <div class="hero-card-foot">Live Tracking</div>
      </div>
    </div>
  </div>

  <div class="grid grid-4 mb-4" style="gap:16px">
    <a class="stat i-primary" href="projects.html" title="View all assigned projects">
      <div class="label">Total Assigned</div>
      <div class="value">${projects.length}</div>
      <div class="delta up">My projects</div>
      <div class="icon-wrap">${I('folder')}</div>
    </a>
    <a class="stat i-info" href="projects.html#status=Not Started" style="background:var(--surface)" title="Filter new / not started assigned projects">
      <div class="label">New Projects</div>
      <div class="value" style="color:#0284c7">${notStarted}</div>
      <div class="delta" style="color:#0284c7">Awaiting kickoff</div>
      <div class="icon-wrap" style="background:linear-gradient(135deg,#0ea5e9,#0284c7)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </div>
    </a>
    <a class="stat i-success" href="projects.html#status=Ongoing" title="Filter ongoing assigned projects">
      <div class="label">Ongoing</div>
      <div class="value">${ongoing}</div>
      <div class="delta up">Currently in progress</div>
      <div class="icon-wrap">${I('activity')}</div>
    </a>
    <a class="stat i-warn" href="projects.html#status=On Hold" style="background:var(--surface)" title="Filter assigned projects on hold">
      <div class="label">On Hold</div>
      <div class="value" style="color:#d97706">${onHold}</div>
      <div class="delta" style="color:#d97706">Paused / on hold</div>
      <div class="icon-wrap" style="background:linear-gradient(135deg,#f59e0b,#d97706)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </div>
    </a>
    <a class="stat i-info" href="projects.html#status=Completed" title="Filter completed assigned projects">
      <div class="label">Completed</div>
      <div class="value">${completed}</div>
      <div class="delta up">Delivered</div>
      <div class="icon-wrap">${I('check')}</div>
    </a>
    <a class="stat i-muted" href="projects.html#status=Closed" title="Filter closed assigned projects">
      <div class="label">Closed</div>
      <div class="value">${closed}</div>
      <div class="delta">Formally closed</div>
      <div class="icon-wrap">${I('zap')}</div>
    </a>
    <a class="stat i-danger" href="projects.html#status=Cancelled" title="Filter cancelled assigned projects">
      <div class="label">Cancelled</div>
      <div class="value">${cancelled}</div>
      <div class="delta down">Terminated / cancelled</div>
      <div class="icon-wrap" style="background:linear-gradient(135deg,#ef4444,#dc2626)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </div>
    </a>
    <a class="stat i-danger" href="projects.html#filter=dueSoon" title="Filter assigned projects due for completion">
      <div class="label">Due for Completion</div>
      <div class="value">${dueSoon}</div>
      <div class="delta down">Due within 14 days</div>
      <div class="icon-wrap">${I('calendar')}</div>
    </a>
  </div>

  <div class="grid" style="grid-template-columns:1.6fr 1fr;gap:20px;margin-bottom:24px;align-items:stretch">
    <div class="card" style="display:flex;flex-direction:column">
      <div class="card-head">
        <div><div class="card-title">Project Status Breakdown</div><div class="card-sub">How your assigned projects are distributed across statuses</div></div>
        <span class="badge badge-primary">${projects.length} total</span>
      </div>
      <div class="card-body" style="padding:12px 20px 20px;flex:1">
        ${(() => {
          const sc = { 'Not Started':'#0ea5e9','Completed':'#10b981','Closure':'#10b981','Project Closure':'#10b981','On Hold':'#64748b','Gap Assessment':'#0ea5e9','Risk Assessment':'#f59e0b','Design & Documentation/Implementation':'#8b5cf6','Management System Design & Documentation/Implementation':'#8b5cf6','VAPT':'#8b5cf6','Training & Awareness':'#6366f1','Internal Audit & Management Review':'#06b6d4','Remediation & Certification Readiness':'#f59e0b','Certification Audit':'#8b5cf6','Certification & Post Engagement':'#6366f1','Certification & Post engagement':'#6366f1','Post Engagement':'#6366f1','Internal Audit':'#06b6d4','External Audit':'#f59e0b','Training':'#6366f1','Awareness':'#6366f1','Awareness & VAPT':'#8b5cf6','Testing':'#8b5cf6','Implementation':'#8b5cf6','Internal Testing':'#0ea5e9','Penetration Testing':'#8b5cf6','Report Submission':'#6366f1','Review':'#f59e0b','Requirements Gathering':'#0ea5e9','Configuration & Design':'#6366f1','Data Preparation & Migration':'#8b5cf6','Integration':'#6366f1','User Acceptance Testing (UAT)':'#f59e0b','Go-Live':'#10b981','Previous Findings Closure':'#0ea5e9','Management Review':'#8b5cf6','Readiness Assessment':'#0ea5e9','Remediation':'#f59e0b','Surveillance Audit':'#8b5cf6','Cancelled':'#ef4444' };
          const getDeliveryStatus = p => PDMS.deliveryStatusOf ? PDMS.deliveryStatusOf(p) : (p.deliveryStatus || p.status);
          const allStatuses = [...new Set([...(D.deliveryStatuses || []), ...projects.map(p => getDeliveryStatus(p)).filter(Boolean)])];
          const activeList = allStatuses.map(s => {
            const count = projects.filter(p => getDeliveryStatus(p) === s).length;
            return { status: s, count, color: sc[s] || '#94a3b8' };
          }).filter(item => item.count > 0);

          const listToDisplay = activeList.length > 0 ? activeList : allStatuses.slice(0, 6).map(s => ({ status: s, count: 0, color: sc[s] || '#94a3b8' }));
          const max = Math.max(...listToDisplay.map(s => s.count), 1);

          return listToDisplay.map(item => {
            const pct = Math.round((item.count / max) * 100);
            return `
            <div style="display:grid;grid-template-columns:minmax(180px, 240px) 1fr 40px;align-items:center;gap:14px;padding:9px 0;border-bottom:1px solid var(--border)">
              <div class="text-sm font-medium" style="display:flex;align-items:center;gap:8px;min-width:0" title="${PDMS.esc(item.status)}">
                <span style="width:9px;height:9px;border-radius:3px;background:${item.color};flex-shrink:0;display:inline-block"></span>
                <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)">${PDMS.esc(item.status)}</span>
              </div>
              <div style="background:var(--surface-2);border-radius:6px;height:12px;overflow:hidden">
                <div style="width:${pct}%;height:100%;background:${item.color};border-radius:6px;transition:width .4s ease;opacity:${item.count === 0 ? '0.25' : '1'}"></div>
              </div>
              <div class="text-sm font-bold" style="text-align:right;color:${item.count === 0 ? 'var(--text-muted)' : 'var(--text)'}">${item.count}</div>
            </div>`;
          }).join('');
        })()}
        ${projects.length === 0 ? `<div class="text-muted text-sm text-center" style="padding:20px 0">${PDMS.emptyOrLoading('No assigned projects yet')}</div>` : ''}
      </div>
    </div>
    <div class="card" style="display:flex;flex-direction:column">
      <div class="card-head"><div><div class="card-title">Project Progress</div><div class="card-sub">Ongoing vs completed</div></div></div>
      <div class="card-body" style="padding:16px 20px 24px;flex:1;display:flex;flex-direction:column;justify-content:center">
        <div class="chart-wrap" style="height:210px;width:100%;margin:0 auto"><canvas id="pmoDonut"></canvas></div>
        <div id="pmoDonutLegend" style="margin-top:16px;display:flex;flex-direction:column;gap:10px;padding:0 8px"></div>
      </div>
    </div>
  </div>

  <!-- Projects Due for Completion -->
  <div class="card mb-4">
    <div class="card-head">
      <div>
        <div class="card-title">Projects Due for Completion</div>
        <div class="card-sub">Your assigned projects due within the next 14 days</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <span class="badge badge-danger">${dueSoon} due soon</span>
        <a href="projects.html" class="btn btn-secondary btn-sm" style="font-size:12px;padding:4px 12px;display:inline-flex;align-items:center;gap:4px">View all →</a>
      </div>
    </div>
    <div class="card-body" style="padding:0">
      <div style="overflow-x:auto">
        <table class="data">
          <thead><tr><th>Client</th><th>Project Type</th><th>Status</th><th>Start Date</th><th>Due Date</th></tr></thead>
          <tbody>
            ${(() => {
              const due = projects.filter(p => {
                if (!p.due || p.status === 'Completed' || p.status === 'Closed' || p.status === 'On Hold' || p.status === 'Cancelled') return false;
                const d = new Date(p.due); return d >= today && d <= in14;
              }).sort((a, b) => new Date(a.due) - new Date(b.due));
              const displayList = due.slice(0, 5);
              return due.length ? displayList.map(p => {
                const daysLeft = Math.ceil((new Date(p.due) - today) / 86400000);
                const urgency = daysLeft <= 3 ? 'badge-danger' : daysLeft <= 7 ? 'badge-warn' : 'badge-muted';
                const dStat = PDMS.deliveryStatusOf ? (PDMS.deliveryStatusOf(p) || 'Not Started') : (p.deliveryStatus || p.status);
                return `<tr onclick="location.href='project-details.html#id=${p.id}'" style="cursor:pointer">
                  <td><div class="font-semi" style="color:var(--primary)">${PDMS.esc(p.client || p.name || '—')}</div></td>
                  <td class="text-muted">${PDMS.esc(p.type || '—')}</td>
                  <td><span class="badge badge-${D.statusColors[dStat] || 'muted'}">${PDMS.esc(dStat)}</span></td>
                  <td class="text-muted">${PDMS.esc(p.start || p.startDate || '—')}</td>
                  <td><span class="badge ${urgency}">${PDMS.esc(p.due)} · ${daysLeft}d left</span></td>
                </tr>`;
              }).join('') : `<tr><td colspan="5" class="text-muted" style="text-align:center;padding:32px">${PDMS.emptyOrLoading('No projects due in the next 14 days')}</td></tr>`;
            })()}
          </tbody>
        </table>
      </div>
      ${(() => {
        const due = projects.filter(p => {
          if (!p.due || p.status === 'Completed' || p.status === 'Closed' || p.status === 'On Hold' || p.status === 'Cancelled') return false;
          const d = new Date(p.due); return d >= today && d <= in14;
        });
        return due.length > 5 ? `
        <div style="padding:12px 16px;border-top:1px solid var(--border);background:var(--surface-2);display:flex;align-items:center;justify-content:space-between">
          <span style="font-size:12px;color:var(--text-muted)">Showing 5 of ${due.length} projects due soon</span>
          <a href="projects.html" style="font-size:12px;font-weight:700;color:var(--primary);text-decoration:none;display:inline-flex;align-items:center;gap:4px">View all my projects →</a>
        </div>` : '';
      })()}
    </div>
  </div>
      `;
    }

    function renderPmoDonut() {
      const canvas = document.getElementById('pmoDonut');
      const legend = document.getElementById('pmoDonutLegend');
      if (!canvas || !legend) return;
      const projects = myProjects();
      const getDeliveryStatus = p => PDMS.deliveryStatusOf ? PDMS.deliveryStatusOf(p) : (p.deliveryStatus || p.status || 'Not Started');
      const isClosedStatus = st => ['Closure', 'Project Closure'].includes(st);
      const isOngoingStatus = st => st && st !== 'Not Started' && st !== 'Completed' && !isClosedStatus(st) && st !== 'On Hold' && st !== 'Cancelled';
      const notStarted = projects.filter(p => getDeliveryStatus(p) === 'Not Started' || p.status === 'Not Started').length;
      const ongoing = projects.filter(p => isOngoingStatus(getDeliveryStatus(p))).length;
      const completed = projects.filter(p => getDeliveryStatus(p) === 'Completed').length;
      const closed = projects.filter(p => isClosedStatus(getDeliveryStatus(p))).length;
      const onHold = projects.filter(p => getDeliveryStatus(p) === 'On Hold' || p.status === 'On Hold').length;
      const cancelled = projects.filter(p => getDeliveryStatus(p) === 'Cancelled' || p.status === 'Cancelled').length;
      PDMS.charts.donut(canvas, [notStarted, ongoing, completed, closed, onHold, cancelled], ['#0ea5e9', '#f59e0b', '#10b981', '#64748b', '#d97706', '#ef4444']);
      legend.innerHTML = [
        ['#0ea5e9', 'Not Started', notStarted],
        ['#f59e0b', 'Ongoing', ongoing],
        ['#10b981', 'Completed', completed],
        ['#64748b', 'Closed', closed],
        ['#d97706', 'On Hold', onHold],
        ['#ef4444', 'Cancelled', cancelled]
      ].map(([c, l, v]) => `<div style="display:flex;align-items:center;justify-content:space-between;font-size:12px">
        <div style="display:flex;align-items:center;gap:7px"><span style="width:10px;height:10px;border-radius:50%;background:${c};flex-shrink:0"></span><span style="color:var(--text-muted)">${l}</span></div>
        <span style="font-weight:700;color:var(--text)">${v}</span>
      </div>`).join('');
    }

    function renderAll() { render(); setTimeout(renderPmoDonut, 50); }
    PDMS.onRefresh(renderAll);
  </script>
</body>

</html>
