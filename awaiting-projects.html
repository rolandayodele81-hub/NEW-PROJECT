<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Awaiting Approval — PSE PDMS</title>
  <link rel="stylesheet" href="css/style.css?v=1788357757"/>
  <style>
    .approve-btn {
      padding:5px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;
      background:#10b981;color:#fff;border:none;transition:opacity .15s;
    }
    .approve-btn:hover { opacity:.85 }
    .reject-btn {
      padding:5px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;
      background:transparent;color:var(--danger);border:1px solid var(--danger);transition:opacity .15s;
    }
    .reject-btn:hover { opacity:.7 }
    .action-row { display:flex;gap:8px;align-items:center }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    .pending-dot { width:8px;height:8px;border-radius:50%;background:#7c3aed;display:inline-block;animation:pulse 2s infinite }
  </style>
</head>
<body>
<script src="js/bundle.js?v=1788357757"></script>
<script>
  PDMS.mountShell('awaiting-approval');
  const D = PDMS_DATA; const I = PDMS.icon;

  const currentUser = PDMS.getUser();
  const isSalesHead = currentUser && currentUser.role === 'Sales Head';
  const isAccounts = currentUser && currentUser.role === 'Accounts';
  const isDeliveryApprover = currentUser && ['PM Head', 'COO', 'HTD'].includes(currentUser.role);
  // Sales Head sees 'Awaiting Sales Head Approval'; Accounts and Delivery Leadership see 'Awaiting Account Approval'
  const pendingStatus = isSalesHead ? 'Awaiting Sales Head Approval' : 'Awaiting Account Approval';
  const pageTitle = isSalesHead ? 'Projects Awaiting Sales Head Approval' : (isAccounts ? 'Projects Awaiting Approval' : 'Projects Awaiting Account Approval');
  const pageSub = isSalesHead
    ? 'Review new projects from the sales team before they enter the pipeline'
    : (isAccounts ? 'Review and approve projects before they enter active delivery' : 'Monitor projects pending Accounts financial sign-off before active delivery begins');
  const cardTitle = isSalesHead ? 'Pending Sales Head Review' : (isAccounts ? 'Pending Financial Review' : 'Pending Account Approval');
  const emptyMsg = isSalesHead
    ? 'No projects are currently awaiting your approval.'
    : (isAccounts ? 'No projects are currently awaiting financial approval.' : 'No projects are currently awaiting account approval.');
  const accentColor = isSalesHead ? '#f59e0b' : '#7c3aed';
  const accentRgba = isSalesHead ? '245,158,11' : '124,58,237';
  const showActions = isAccounts;

  let activeTab = 'pending';

  function render() {
    const liveProjects = (window.PDMS_REMOTE && window.PDMS_REMOTE.projects) || D.projects;
    const liveClients  = (window.PDMS_REMOTE && window.PDMS_REMOTE.clients)  || D.clients;
    const rawPending = liveProjects.filter(p => p.status === pendingStatus);
    const pending = PDMS.sortNewestFirst ? PDMS.sortNewestFirst(rawPending.slice()) : rawPending;
    const rawCancelled = isSalesHead ? liveProjects.filter(p => p.status === 'Cancelled' && (p.stage === 'Sales' || (!p.stage && p.sales))) : [];
    const cancelled = PDMS.sortNewestFirst ? PDMS.sortNewestFirst(rawCancelled.slice()) : rawCancelled;

    const displayList = (isSalesHead && activeTab === 'cancelled') ? cancelled : pending;

    document.getElementById('content').innerHTML = `
    <div class="page-head">
      <div>
        <div class="breadcrumbs"><span>Home</span><span>Awaiting Projects</span></div>
        <h1 class="page-title">${pageTitle}</h1>
        <div class="page-sub">${pageSub}</div>
      </div>
      <span style="display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:20px;font-size:13px;font-weight:700;background:rgba(${accentRgba},.1);color:${accentColor};border:1px solid rgba(${accentRgba},.25)">
        <span class="pending-dot" style="background:${accentColor}"></span> ${pending.length} pending
      </span>
    </div>

    <div class="grid ${isSalesHead ? 'grid-2' : 'grid-1'} mb-4">
      <div class="stat" style="border:1.5px solid rgba(${accentRgba},.25);cursor:${isSalesHead ? 'pointer' : 'default'};${isSalesHead && activeTab==='pending' ? 'box-shadow:0 0 0 2px '+accentColor : ''}" onclick="${isSalesHead ? "setAwaitingTab('pending')" : ''}">
        <div class="label">Awaiting Review</div>
        <div class="value" style="color:${accentColor}">${pending.length}</div>
        <div class="delta">Pending approval</div>
        <div class="icon-wrap" style="color:${accentColor}">${I('clock')}</div>
      </div>
      ${isSalesHead ? `
      <div class="stat" style="border:1.5px solid rgba(239,68,68,.25);cursor:pointer;${activeTab==='cancelled' ? 'box-shadow:0 0 0 2px #ef4444' : ''}" onclick="setAwaitingTab('cancelled')">
        <div class="label">Cancelled Leads</div>
        <div class="value" style="color:#ef4444">${cancelled.length}</div>
        <div class="delta" style="color:#ef4444">Rejected / Cancelled</div>
        <div class="icon-wrap" style="color:#ef4444">${I('alert')}</div>
      </div>` : ''}
    </div>

    ${isSalesHead ? `
    <div style="display:flex;gap:10px;margin-bottom:16px">
      <button class="btn btn-sm ${activeTab === 'pending' ? 'btn-primary' : 'btn-secondary'}" onclick="setAwaitingTab('pending')">${I('clock')} Pending Review (${pending.length})</button>
      <button class="btn btn-sm ${activeTab === 'cancelled' ? 'btn-primary' : 'btn-secondary'}" style="${activeTab === 'cancelled' ? 'background:#ef4444;border-color:#ef4444;color:#fff' : ''}" onclick="setAwaitingTab('cancelled')">✕ Cancelled Leads (${cancelled.length})</button>
    </div>` : ''}

    <div class="card" style="border:1.5px solid ${isSalesHead && activeTab==='cancelled' ? 'rgba(239,68,68,.25)' : `rgba(${accentRgba},.25)`};box-shadow:0 4px 32px rgba(${accentRgba},.08)">
      <div class="card-head">
        <div>
          <div class="card-title" style="display:flex;align-items:center;gap:8px">
            <span class="pending-dot" style="background:${isSalesHead && activeTab==='cancelled' ? '#ef4444' : accentColor}"></span>
            ${isSalesHead && activeTab === 'cancelled' ? 'Cancelled / Rejected Leads' : cardTitle}
          </div>
          <div class="card-sub">${isSalesHead && activeTab === 'cancelled' ? 'Leads that were cancelled or rejected by the Sales Head.' : 'Click a row to open and review project details.'}</div>
        </div>
      </div>
      <div class="card-body" style="padding:0">
        ${displayList.length === 0 ? `
          <div style="text-align:center;padding:64px 24px;color:var(--text-soft)">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto 16px;display:block;opacity:.35"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            <div style="font-size:16px;font-weight:700;margin-bottom:6px">All clear!</div>
            <div style="font-size:13px">${activeTab === 'cancelled' ? 'No cancelled leads found.' : emptyMsg}</div>
          </div>
        ` : `
        <div style="overflow-x:auto">
          <table class="data">
            <thead>
              <tr>
                <th>Client</th>
                <th>Deal Owner</th>
                <th>Opportunity Value</th>
                <th>Award Value (excl. VAT)</th>
                <th>Project Type</th>
                <th>Status</th>
                ${activeTab === 'cancelled' ? '<th>Rejection Reason</th>' : ''}
              </tr>
            </thead>
            <tbody>
              ${displayList.map(p => {
                const clientObj = liveClients.find(c => c.name===p.client||c.email===p.client||c.id===p.client);
                const clientName = (clientObj && clientObj.name) || p.client || p.name || '—';
                const creator = p.projectOwnerName || (p.sales && p.sales !== 'Sales Team' ? p.sales : '') || p.salesOwnerName || p.onboardedByName || p.createdByUserName || p.sales || '—';
                const isItemCancelled = p.status === 'Cancelled';
                return `<tr style="cursor:pointer" onclick="location.href='project-details.html#id=${p.id}'">
                  <td class="font-bold" style="color:var(--primary)">${PDMS.esc(clientName)}</td>
                  <td class="font-semi" style="color:var(--text)">${PDMS.esc(creator)}</td>
                  <td class="font-semi">${p.requestedNegotiatedPrice ? `<span style="color:#d97706;font-weight:700">${PDMS.currency(p.requestedNegotiatedPrice)}</span> <span style="font-size:10px;padding:2px 6px;border-radius:4px;background:rgba(245,158,11,.15);color:#d97706;margin-left:4px">Requested</span>` : (Number.isFinite(Number(p.opportunityValue || p.negotiatedPrice)) && Number(p.opportunityValue || p.negotiatedPrice) > 0 ? PDMS.currency(p.opportunityValue || p.negotiatedPrice) : '—')}</td>
                  <td class="font-semi">${Number.isFinite(Number(p.awardValue || p.negotiatedPrice)) && Number(p.awardValue || p.negotiatedPrice) > 0 ? PDMS.currency(p.awardValue || p.negotiatedPrice) : '—'}</td>
                  <td class="text-muted">${PDMS.esc(p.type||'—')}</td>
                  <td><span class="badge ${isItemCancelled ? 'badge-danger' : ''}" style="${!isItemCancelled ? `background:rgba(${accentRgba},.12);color:${accentColor}` : ''}">${isItemCancelled ? 'Cancelled' : 'Awaiting Approval'}</span></td>
                  ${activeTab === 'cancelled' ? `<td class="text-sm" style="color:var(--danger);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${PDMS.esc(p.salesHeadRejectionNote || '—')}</td>` : ''}
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>`}
      </div>
    </div>
    `;
  }

  function setAwaitingTab(tab) {
    activeTab = tab;
    render();
  }
  window.setAwaitingTab = setAwaitingTab;

  let sessionApproved = 0;
  let sessionRejected = 0;

  function updateSessionCounts() {
    const ac = document.getElementById('approvedCount');
    const rc = document.getElementById('rejectedCount');
    if (ac) ac.textContent = sessionApproved;
    if (rc) rc.textContent = sessionRejected;
  }

  function approveProject(id, btn) {
    const liveProjects = (window.PDMS_REMOTE && window.PDMS_REMOTE.projects) || D.projects;
    const p = liveProjects.find(x => x.id === id);
    if (!p) { PDMS.toast('Error', 'Project not found', 'error'); return; }

    const hasPriceUpdate = isSalesHead && p.requestedNegotiatedPrice !== undefined && p.requestedNegotiatedPrice !== null && p.requestedNegotiatedPrice !== '';
    const modalTitle = isSalesHead ? 'Approve Project (Sales Head)' : 'Approve Project (Accounts)';
    const modalDesc = isSalesHead ? `You are approving <strong>${PDMS.esc(p.name)}</strong> to enter the sales pipeline.` : `You are approving <strong>${PDMS.esc(p.name)}</strong> to move into Delivery (Not Started).`;
    const priceNotice = hasPriceUpdate ? `
      <div style="margin:12px 0;padding:12px 14px;background:rgba(245,158,11,.1);border:1.5px solid rgba(245,158,11,.3);border-radius:10px;font-size:13px">
        <div style="font-weight:700;color:#d97706;margin-bottom:8px">Opportunity Value Update Request</div>
        <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
          <div><span style="font-size:11px;color:var(--text-soft);text-transform:uppercase;display:block">Current Value (Old)</span><strong>${Number.isFinite(Number(p.negotiatedPrice)) && Number(p.negotiatedPrice) > 0 ? PDMS.currency(p.negotiatedPrice) : 'Not set'}</strong></div>
          <div style="color:var(--text-muted);font-size:18px">➔</div>
          <div><span style="font-size:11px;color:#d97706;text-transform:uppercase;display:block">To Be Value (New)</span><strong style="color:#d97706;font-size:15px">${PDMS.currency(p.requestedNegotiatedPrice)}</strong></div>
        </div>
      </div>` : '';
    const modal = PDMS.modal(modalTitle, `
      <p style="color:var(--text-soft);margin:0 0 12px;font-size:14px">${modalDesc}</p>
      ${priceNotice}
      <div class="form-row" style="margin-top:12px">
        <label>Approval Comment / Remarks</label>
        <textarea id="apprComment" rows="3" placeholder="Enter approval remarks or comments..."></textarea>
      </div>
    `, `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="confirmApprBtn" style="background:#10b981;border-color:#10b981">✓ Confirm Approval</button>`);

    modal.querySelector('#confirmApprBtn').onclick = function() {
      const comment = modal.querySelector('#apprComment').value.trim();
      const btn2 = this;
      PDMS.setButtonLoading(btn2, true, 'Approving...');
      const user = PDMS.getUser();

      if (isSalesHead) {
        const patch = PDMS.salesHeadApprovalPatch(p);
        const forwardedToAccounts = patch.status === 'Awaiting Account Approval';
        if (hasPriceUpdate && !forwardedToAccounts) {
          patch.negotiatedPrice = p.requestedNegotiatedPrice;
          patch.requestedNegotiatedPrice = '';
        }
        PDMS.api.update('projects', id, patch)
          .then(() => {
            Object.assign(p, patch);
            if (hasPriceUpdate && !forwardedToAccounts) p.requestedNegotiatedPrice = '';
            if (comment) {
              const record = { id: 'tmp-' + Date.now(), author: user ? user.name : 'Sales Head', authorRole: user ? user.role : 'Sales Head', projectId: p.id, projectName: p.name, message: `[Approval Remarks] ${comment}`, time: new Date().toISOString() };
              PDMS.api.create('issues', record).catch(()=>{});
              if (D.issues) D.issues.unshift(record);
            }
            modal.remove();
            sessionApproved++;
            PDMS.toast('Approved', forwardedToAccounts ? `"${p.name}" approved and forwarded to Accounts.` : `"${p.name}" has been approved.${hasPriceUpdate ? ' Opportunity value updated.' : ''}`, 'success');
            PDMS.workflowNotify('lead.accepted', p);
            if (forwardedToAccounts) PDMS.workflowNotify('award.submitted', p);
            render();
            updateSessionCounts();
          })
          .catch(err => {
            PDMS.setButtonLoading(btn2, false);
            PDMS.toast('Error', err.message || 'Could not approve project', 'error');
          });
      } else {
        PDMS.api.update('projects', id, { status: 'Not Started', stage: 'Delivery' })
          .then(() => {
            p.status = 'Not Started'; p.stage = 'Delivery';
            if (comment) {
              const record = { id: 'tmp-' + Date.now(), author: user ? user.name : 'Accounts', authorRole: user ? user.role : 'Accounts', projectId: p.id, projectName: p.name, message: `[Approval Remarks] ${comment}`, time: new Date().toISOString() };
              PDMS.api.create('issues', record).catch(()=>{});
              if (D.issues) D.issues.unshift(record);
            }
            modal.remove();
            sessionApproved++;
            PDMS.toast('Approved', `"${p.name}" has been approved and moved to Not Started in delivery.`, 'success');
            PDMS.workflowNotify('award.approved', p);
            render();
            updateSessionCounts();
          })
          .catch(err => {
            PDMS.setButtonLoading(btn2, false);
            PDMS.toast('Error', err.message || 'Could not approve project', 'error');
          });
      }
    };
  }

  function rejectProject(id, btn) {
    const liveProjects = (window.PDMS_REMOTE && window.PDMS_REMOTE.projects) || D.projects;
    const p = liveProjects.find(x => x.id === id);
    if (!p) return;
    const user = PDMS.getUser();

    if (isSalesHead) {
      const modal = PDMS.modal('Reject Project', `
        <p style="color:var(--text-soft);margin:0 0 16px;font-size:14px">You are about to reject <strong>${PDMS.esc(p.name)}</strong>. The project will be cancelled and the Sales user will see your rejection note.</p>
        <div class="form-row"><label>Reason for Rejection / Remarks</label><textarea id="rejectReason" rows="3" placeholder="Explain why this project was rejected..."></textarea></div>
      `, `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="confirmRejectBtn" style="background:var(--danger);border-color:var(--danger)">Reject Project</button>`);

      modal.querySelector('#confirmRejectBtn').onclick = function() {
        const reason = modal.querySelector('#rejectReason').value.trim();
        if (!reason) { PDMS.toast('Required', 'Please provide a rejection reason', 'error'); return; }
        const btn2 = this;
        PDMS.setButtonLoading(btn2, true, 'Rejecting...');
        const prevStage = p.previousStatus || p.requestedStatus || 'Lead';
        PDMS.api.update('projects', id, { status: 'Cancelled', stage: 'Sales', previousStatus: prevStage, salesHeadRejectionNote: reason, priceUpdatePending: false })
          .then(() => {
            p.status = 'Cancelled';
            p.stage = 'Sales';
            p.previousStatus = prevStage;
            p.priceUpdatePending = false;
            const record = { id: 'tmp-' + Date.now(), author: user ? user.name : 'Sales Head', authorRole: user ? user.role : 'Sales Head', projectId: p.id, projectName: p.name, message: `[Rejection Reason] ${reason}`, time: new Date().toISOString() };
            PDMS.api.create('issues', record).catch(()=>{});
            if (D.issues) D.issues.unshift(record);
            PDMS.workflowNotify('lead.rejected', p, { reason });
            modal.remove();
            sessionRejected++;
            PDMS.toast('Rejected', `"${p.name}" has been rejected.`, 'warn');
            render();
            updateSessionCounts();
          })
          .catch(err => {
            PDMS.setButtonLoading(btn2, false);
            PDMS.toast('Error', err.message || 'Could not reject project', 'error');
          });
      };
    } else {
      const modal = PDMS.modal('Reject Project', `
        <p style="color:var(--text-soft);margin:0 0 16px;font-size:14px">You are about to reject <strong>${PDMS.esc(p.name)}</strong>. The project will be sent back to the Sales team with a note.</p>
        <div class="form-row"><label>Reason for Rejection / Remarks</label><textarea id="rejectReason" rows="3" placeholder="Provide a reason so the Sales team can address it..."></textarea></div>
      `, `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="confirmRejectBtn" style="background:var(--danger);border-color:var(--danger)">Reject &amp; Return to Sales</button>`);

      modal.querySelector('#confirmRejectBtn').onclick = function() {
        const reason = modal.querySelector('#rejectReason').value.trim();
        if (!reason) { PDMS.toast('Required', 'Please provide a rejection reason', 'error'); return; }
        const btn2 = this;
        PDMS.setButtonLoading(btn2, true, 'Rejecting...');
        PDMS.api.update('projects', id, { status: 'Award/SLA', stage: 'Sales', accountsRejectionNote: reason, rejectionNote: reason })
          .then(() => {
            p.status = 'Award/SLA';
            p.stage = 'Sales';
            p.accountsRejectionNote = reason;
            p.rejectionNote = reason;
            const record = { id: 'tmp-' + Date.now(), author: user ? user.name : 'Accounts', authorRole: user ? user.role : 'Accounts', projectId: p.id, projectName: p.name, message: `[Rejection Reason] ${reason}`, time: new Date().toISOString() };
            PDMS.api.create('issues', record).catch(()=>{});
            if (D.issues) D.issues.unshift(record);
            modal.remove();
            sessionRejected++;
            PDMS.toast('Returned to Sales', `"${p.name}" has been returned to Sales for revision.`, 'warn');
            PDMS.workflowNotify('award.rejected', p, { reason });
            render();
            updateSessionCounts();
          })
          .catch(err => {
            PDMS.setButtonLoading(btn2, false);
            PDMS.toast('Error', err.message || 'Could not reject project', 'error');
          });
      };
    }
  }

  window.approveProject = approveProject;
  window.rejectProject = rejectProject;
  PDMS.onRefresh(render);
</script>
</body>
</html>
