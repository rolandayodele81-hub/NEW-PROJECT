<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Help Center &amp; Complaints — PSE PDMS</title>
  <link rel="stylesheet" href="css/style.css?v=1789158508" />
  <style>
    .help-hero {
      background: linear-gradient(135deg, #090d16 0%, #1d3c88 45%, #6366f1 80%, #8b5cf6 100%);
      border-radius: 20px;
      padding: 32px 36px;
      color: #fff;
      margin-bottom: 24px;
      box-shadow: 0 12px 32px rgba(29, 60, 136, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
    }

    .help-hero-title {
      font-size: 26px;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .help-hero-sub {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.85);
      max-width: 580px;
      line-height: 1.5;
    }

    .help-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .help-stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: var(--shadow-sm);
    }

    .help-stat-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .help-tabs {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
      padding-bottom: 2px;
      overflow-x: auto;
    }

    .help-tab {
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 8px;
      border: none;
      background: transparent;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .help-tab:hover {
      color: var(--text);
      background: var(--surface-2);
    }

    .help-tab.active {
      color: #fff;
      background: var(--primary);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
    }

    .review-card {
      position: relative;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 22px;
      margin-bottom: 16px;
      background: var(--surface);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }

    .review-card:hover {
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }

    .review-head {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }

    .review-avatar {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      flex-shrink: 0;
      color: #fff;
      font-weight: 800;
      font-size: 14px;
      display: grid;
      place-items: center;
      background: var(--gradient);
    }

    .review-author-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .review-role-chip {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--surface-2);
      padding: 2px 8px;
      border-radius: 999px;
    }

    .review-time {
      font-size: 12px;
      color: var(--text-soft);
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .review-body {
      font-size: 14px;
      line-height: 1.6;
      margin: 4px 0 12px;
      color: var(--text);
    }

    .review-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 2px;
    }

    .comment-count-pill {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .comment-thread {
      padding: 12px 0 0;
      margin-top: 12px;
      border-top: 1px solid var(--border);
    }

    .comment {
      padding: 10px 12px;
      background: var(--surface-2);
      border-radius: 12px;
      margin-bottom: 8px;
    }

    .comment-head {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .comment-form {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .comment-form input {
      flex: 1;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      color: var(--text);
      font-size: 13px;
    }

    .comment-form input:focus {
      outline: none;
      border-color: var(--primary);
    }

    /* Status Dropdown Trigger Button */
    .status-dropdown-trigger {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s ease;
      background: var(--surface-2);
      color: var(--text);
    }

    .status-dropdown-trigger:hover {
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      transform: translateY(-0.5px);
    }

    .status-dropdown-trigger.status-open {
      background: rgba(245, 158, 11, 0.12);
      color: #b45309;
      border-color: rgba(245, 158, 11, 0.25);
    }

    .status-dropdown-trigger.status-in-review {
      background: rgba(139, 92, 246, 0.12);
      color: #7c3aed;
      border-color: rgba(139, 92, 246, 0.25);
    }

    .status-dropdown-trigger.status-in-progress {
      background: rgba(59, 130, 246, 0.12);
      color: #1d4ed8;
      border-color: rgba(59, 130, 246, 0.25);
    }

    .status-dropdown-trigger.status-resolved {
      background: rgba(16, 185, 129, 0.12);
      color: #047857;
      border-color: rgba(16, 185, 129, 0.25);
    }

    /* Custom Floating Popover Menu */
    .status-popover-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      z-index: 100;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      min-width: 175px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      animation: popoverFadeIn 0.15s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes popoverFadeIn {
      from { opacity: 0; transform: translateY(-4px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .status-menu-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      background: none;
      border: none;
      width: 100%;
      text-align: left;
      cursor: pointer;
      transition: all 0.12s;
    }

    .status-menu-item:hover {
      background: var(--surface-2);
    }

    .status-menu-item.active {
      font-weight: 700;
      background: rgba(99, 102, 241, 0.08);
      color: var(--primary);
    }

    .status-menu-divider {
      height: 1px;
      background: var(--border);
      margin: 4px 0;
    }

    .status-menu-item.danger {
      color: var(--danger);
    }

    .status-menu-item.danger:hover {
      background: rgba(239, 68, 68, 0.08);
    }

    .ticket-delete-btn {
      background: none;
      border: none;
      color: var(--text-soft);
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      transition: all 0.15s;
    }

    .faq-accordion {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 10px;
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .faq-header {
      padding: 14px 18px;
      font-weight: 600;
      font-size: 13.5px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      transition: background 0.15s;
    }

    .faq-header:hover {
      background: var(--surface-2);
    }

    .faq-body {
      padding: 0 18px 14px 18px;
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.55;
      border-top: 1px solid var(--border);
      display: none;
    }

    .faq-accordion.open .faq-body {
      display: block;
      padding-top: 12px;
    }

    .faq-accordion.open .faq-arrow {
      transform: rotate(180deg);
    }

    .faq-arrow {
      transition: transform 0.2s ease;
      color: var(--text-muted);
      font-size: 11px;
    }
  </style>
</head>

<body>
  <script src="js/bundle.js?v=1789158508"></script>
  <script>
    PDMS.mountShell('help');
    const D = PDMS_DATA;
    const I = PDMS.icon;
    const currentUser = PDMS.getUser();
    const canManageAll = PDMS.canManageComplaints ? PDMS.canManageComplaints(currentUser) : false;

    let activeTab = canManageAll ? 'all' : 'my';

    const CATEGORIES = [
      'Workplace & Conduct',
      'Project & Delivery Roadblock',
      'Finance & Invoicing Dispute',
      'Commission & Earnings',
      'Staff & Management Roadblock',
      'Technical & Tooling Issue',
      'Access & Permissions',
      'General Complaint / Feedback'
    ];

    const PRIORITIES = ['Low', 'Medium', 'High', 'Critical'];
    const STATUSES = ['Open', 'In Review', 'In Progress', 'Resolved'];

    function allComplaints() {
      const live = (window.PDMS_REMOTE && window.PDMS_REMOTE.complaints) || D.complaints || [];
      const arr = Array.isArray(live) ? live : [];
      const seen = new Set();
      return arr.filter(item => {
        if (!item) return false;
        const key = String(item.id || item.ticketNumber || '').trim();
        if (!key) return true;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    function timeAgo(iso) {
      if (!iso) return '';
      const diffMs = Date.now() - new Date(iso).getTime();
      const mins = Math.round(diffMs / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return mins + 'm ago';
      const hrs = Math.round(mins / 60);
      if (hrs < 24) return hrs + 'h ago';
      return Math.round(hrs / 24) + 'd ago';
    }

    function getPriorityBadge(priority) {
      const p = String(priority || 'Low').toLowerCase();
      if (p === 'critical') return `<span class="badge" style="background:rgba(239,68,68,.12);color:#ef4444;border:1px solid rgba(239,68,68,.3);font-weight:700">⚡ Critical</span>`;
      if (p === 'high') return `<span class="badge" style="background:rgba(245,158,11,.12);color:#d97706;border:1px solid rgba(245,158,11,.3);font-weight:700">▲ High</span>`;
      return '';
    }

    function getStatusBadge(status) {
      const s = String(status || 'Open').toLowerCase();
      if (s === 'open') return `<span class="badge badge-status-open">● Open</span>`;
      if (s === 'in review' || s === 'in-review') return `<span class="badge badge-status-in-review">⏳ In Review</span>`;
      if (s === 'in progress' || s === 'in-progress') return `<span class="badge badge-status-in-progress">⚙️ In Progress</span>`;
      if (s === 'resolved') return `<span class="badge badge-status-resolved">✓ Resolved</span>`;
      return `<span class="badge badge-secondary">${PDMS.esc(status)}</span>`;
    }

    function render() {
      const user = PDMS.getUser();
      if (!user) return;

      const list = allComplaints();
      const myComplaints = list.filter(c => PDMS.complaintOwnedByUser ? PDMS.complaintOwnedByUser(c, user) : (String(c.submittedById || c.submittedByEmail || '').toLowerCase() === String(user.id || user.email || '').toLowerCase()));

      const targetList = (activeTab === 'all' && canManageAll) ? list : myComplaints;

      const openCount = list.filter(c => c.status === 'Open' || !c.status).length;
      const inReviewCount = list.filter(c => c.status === 'In Review' || c.status === 'In Progress').length;
      const resolvedCount = list.filter(c => c.status === 'Resolved').length;

      let filtered = targetList.slice();
      // Sort newest first
      filtered.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));

      const content = document.getElementById('content');
      if (!content) return;

      content.innerHTML = `
        <div class="help-hero">
          <div>
            <div class="help-hero-title">Help Center &amp; Support Desk</div>
            <div class="help-hero-sub">
              ${canManageAll
                ? 'Centralized complaint and dispute resolution desk for HR, PM Head, HTD, and COO leadership.'
                : 'Lay workplace, delivery, technical, or access complaints directly to HR, HTD, COO, and PM Head leadership.'}
            </div>
          </div>
          <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
            <button class="btn btn-primary" onclick="openNewComplaintModal()" style="background:#fff;color:var(--primary);border:none;box-shadow:0 6px 20px rgba(0,0,0,.15);font-weight:700">
              ${I('plus')} Lay a Complaint / Ticket
            </button>
          </div>
        </div>

        ${canManageAll ? `
        <div class="help-stats" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
          <div class="help-stat-card">
            <div class="help-stat-icon" style="background:rgba(99,102,241,.12);color:var(--primary)">${I('folder')}</div>
            <div>
              <div style="font-size:22px;font-weight:800;color:var(--text)">${list.length}</div>
              <div style="font-size:12px;color:var(--text-muted);font-weight:600">Total Active Tickets</div>
            </div>
          </div>
          <div class="help-stat-card">
            <div class="help-stat-icon" style="background:rgba(245,158,11,.15);color:#d97706">⏳</div>
            <div>
              <div style="font-size:22px;font-weight:800;color:#d97706">${openCount}</div>
              <div style="font-size:12px;color:var(--text-muted);font-weight:600">Open / Pending</div>
            </div>
          </div>
          <div class="help-stat-card">
            <div class="help-stat-icon" style="background:rgba(139,92,246,.15);color:#7c3aed">⚙️</div>
            <div>
              <div style="font-size:22px;font-weight:800;color:#7c3aed">${inReviewCount}</div>
              <div style="font-size:12px;color:var(--text-muted);font-weight:600">In Review / Progress</div>
            </div>
          </div>
          <div class="help-stat-card">
            <div class="help-stat-icon" style="background:rgba(16,185,129,.15);color:#059669">✓</div>
            <div>
              <div style="font-size:22px;font-weight:800;color:#059669">${resolvedCount}</div>
              <div style="font-size:12px;color:var(--text-muted);font-weight:600">Resolved</div>
            </div>
          </div>
        </div>` : ''}

        <div class="help-tabs">
          ${canManageAll ? `
            <button class="help-tab ${activeTab === 'all' ? 'active' : ''}" onclick="switchTab('all')">
              ${I('folder')} All Complaints
              <span class="badge ${activeTab === 'all' ? 'badge-light' : 'badge-primary'}" style="font-size:11px">${list.length}</span>
            </button>
          ` : ''}
          <button class="help-tab ${activeTab === 'my' ? 'active' : ''}" onclick="switchTab('my')">
            ${I('user')} My Complaints &amp; Requests
            <span class="badge ${activeTab === 'my' ? 'badge-light' : 'badge-primary'}" style="font-size:11px">${myComplaints.length}</span>
          </button>
          <button class="help-tab ${activeTab === 'faq' ? 'active' : ''}" onclick="switchTab('faq')">
            ${I('help-circle')} Knowledge Base &amp; FAQs
          </button>
        </div>

        ${activeTab === 'faq' ? renderFaqSection() : `
          <div id="complaintsListContainer" style="max-width:760px">
            ${filtered.length ? filtered.map(c => renderComplaintCard(c)).join('') : `
              <div class="card" style="text-align:center;padding:48px 20px;background:var(--surface);border-radius:16px">
                <div style="font-size:36px;margin-bottom:12px">📭</div>
                <div style="font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px">No complaints found</div>
                <div style="font-size:13px;color:var(--text-muted);max-width:400px;margin:0 auto 16px">
                  No support tickets or complaints submitted in this view.
                </div>
                <button class="btn btn-primary btn-sm" onclick="openNewComplaintModal()">${I('plus')} Submit a Complaint</button>
              </div>
            `}
          </div>
        `}
      `;
    }

    function getStatusLabel(status) {
      const s = String(status || 'Open').toLowerCase();
      if (s === 'open') return '● Open';
      if (s === 'in review' || s === 'in-review') return '⏳ In Review';
      if (s === 'in progress' || s === 'in-progress') return '⚙️ In Progress';
      if (s === 'resolved') return '✓ Resolved';
      return PDMS.esc(status || 'Open');
    }

    function renderComplaintCard(c) {
      const user = PDMS.getUser();
      const responses = Array.isArray(c.responses) ? c.responses : [];
      const hasAttachment = c.attachment && c.attachment.url;
      const statusKey = String(c.status || 'open').toLowerCase().replace(/\s+/g, '-');
      const canClose = PDMS.canCloseComplaint ? PDMS.canCloseComplaint(c, user) : false;

      return `
        <div class="review-card" id="ticket-${c.id}">
          <div class="review-head">
            <div class="review-avatar">${PDMS.initials(c.submittedByName || '?')}</div>
            <div style="flex:1;min-width:0">
              <div class="review-author-row">
                <span class="font-bold text-sm">${PDMS.esc(c.submittedByName || 'User')}</span>
                <span class="review-role-chip">${PDMS.esc(c.submittedByRole || 'Staff')}</span>
              </div>
              <div class="review-time">
                <span>${timeAgo(c.createdAt)}</span>
                <span>·</span>
                <span>${PDMS.esc(c.category || 'General')}</span>
              </div>
            </div>

            <div style="display:flex;align-items:center;gap:6px">
              <div style="position:relative;display:inline-block">
                ${canManageAll ? `
                  <button class="status-dropdown-trigger status-${statusKey}" onclick="toggleStatusMenu('${c.id}', event)" title="Click to update status">
                    ${getStatusLabel(c.status)} <span style="font-size:9px;opacity:0.7">▾</span>
                  </button>
                  <div id="statusMenu-${c.id}" class="status-popover-menu hidden">
                    <button class="status-menu-item ${(c.status === 'Open' || !c.status) ? 'active' : ''}" onclick="setComplaintStatus('${c.id}', 'Open')">
                      <span style="color:#f59e0b">●</span> Open
                    </button>
                    <button class="status-menu-item ${c.status === 'In Review' ? 'active' : ''}" onclick="setComplaintStatus('${c.id}', 'In Review')">
                      <span style="color:#7c3aed">⏳</span> In Review
                    </button>
                    <button class="status-menu-item ${c.status === 'In Progress' ? 'active' : ''}" onclick="setComplaintStatus('${c.id}', 'In Progress')">
                      <span style="color:#1d4ed8">⚙️</span> In Progress
                    </button>
                    <button class="status-menu-item ${c.status === 'Resolved' ? 'active' : ''}" onclick="setComplaintStatus('${c.id}', 'Resolved')">
                      <span style="color:#047857">✓</span> Resolved
                    </button>
                    ${canClose ? `
                      <div class="status-menu-divider"></div>
                      <button class="status-menu-item danger" onclick="closeAndDeleteComplaint('${c.id}')">
                        ${I('trash')} Close &amp; Delete
                      </button>
                    ` : ''}
                  </div>
                ` : `
                  <span class="status-dropdown-trigger status-${statusKey}" style="cursor:default">
                    ${getStatusLabel(c.status)}
                  </span>
                `}
              </div>

              ${(canClose && !canManageAll) ? `
                <button class="ticket-delete-btn" title="Close and delete ticket" onclick="closeAndDeleteComplaint('${c.id}')">
                  ${I('trash')}
                </button>
              ` : ''}
            </div>
          </div>

          <div class="review-body">
            ${c.subject ? `<div style="font-weight:700;color:var(--text);margin-bottom:4px">${PDMS.esc(c.subject)}</div>` : ''}
            <div>${PDMS.esc(c.description || '')}</div>
            ${hasAttachment ? `
              <div style="margin-top:10px">
                <a href="javascript:void(0)" onclick="PDMS.viewDoc('${PDMS.esc(c.attachment.url)}', '${PDMS.esc(c.attachment.name || 'document')}', '${PDMS.esc(c.attachment.fileType || '')}')" class="badge badge-secondary" style="font-size:12px;gap:6px;padding:5px 10px;text-decoration:none;display:inline-flex;align-items:center">
                  ${I('file')} ${PDMS.esc(c.attachment.name || 'Attachment')}
                </a>
              </div>
            ` : ''}
          </div>

          ${responses.length ? `
            <div class="review-footer">
              <div class="comment-count-pill">${I('message')} ${responses.length} ${responses.length === 1 ? 'reply' : 'replies'}</div>
            </div>
            <div class="comment-thread">
              ${responses.map(r => `
                <div class="comment" style="margin-bottom:8px">
                  <div class="comment-head">
                    <div class="avatar avatar-sm" style="width:26px;height:26px;font-size:11px;background:var(--primary)">${PDMS.initials(r.author || '?')}</div>
                    <div style="flex:1">
                      <div class="font-semi text-sm">${PDMS.esc(r.author)} <span class="text-muted font-normal">· ${PDMS.esc(r.authorRole || '')}</span></div>
                    </div>
                    <div class="text-sm text-muted">${timeAgo(r.time)}</div>
                  </div>
                  <div class="text-sm mt-1" style="padding-left:34px;color:var(--text)">${PDMS.esc(r.message || '')}</div>
                </div>
              `).join('')}
            </div>
          ` : ''}

          <div class="comment-form">
            <input id="replyInput-${c.id}" placeholder="Write a reply..." onkeydown="if(event.key==='Enter') sendInlineReply('${c.id}', this)"/>
            <button class="btn btn-secondary btn-sm" onclick="sendInlineReply('${c.id}', this)">Reply</button>
          </div>
        </div>
      `;
    }

    function toggleStatusMenu(complaintId, event) {
      if (event) event.stopPropagation();
      const menu = document.getElementById('statusMenu-' + complaintId);
      if (!menu) return;
      const isHidden = menu.classList.contains('hidden');
      document.querySelectorAll('.status-popover-menu').forEach(el => el.classList.add('hidden'));
      if (isHidden) {
        menu.classList.remove('hidden');
      }
    }

    function setComplaintStatus(complaintId, newStatus) {
      document.querySelectorAll('.status-popover-menu').forEach(el => el.classList.add('hidden'));
      const user = PDMS.getUser();
      const list = allComplaints();
      const c = list.find(item => String(item.id) === String(complaintId));
      if (!c) return;

      const patch = {
        status: newStatus,
        updatedAt: new Date().toISOString()
      };
      if (newStatus === 'Resolved') {
        patch.resolvedAt = new Date().toISOString();
      }

      PDMS.api.update('complaints', c.id, patch)
        .then(saved => {
          Object.assign(c, patch, saved || {});

          if (PDMS.notifyComplaintResponse) {
            PDMS.notifyComplaintResponse(c, `Status updated to ${newStatus}`, user);
          }

          PDMS.toast('Status Updated', `Ticket status is now ${newStatus}.`, 'success');
          render();
        })
        .catch(err => {
          PDMS.toast('Error', err.message || 'Could not update status', 'error');
          render();
        });
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.status-dropdown-trigger') && !e.target.closest('.status-popover-menu')) {
        document.querySelectorAll('.status-popover-menu').forEach(el => el.classList.add('hidden'));
      }
    });

    function sendInlineReply(complaintId, triggerElem) {
      const user = PDMS.getUser();
      const list = allComplaints();
      const c = list.find(item => String(item.id) === String(complaintId));
      if (!c) {
        PDMS.toast('Error', 'Ticket not found', 'error');
        return;
      }

      const input = document.getElementById('replyInput-' + complaintId);
      const message = input ? input.value.trim() : '';
      if (!message) {
        PDMS.toast('Empty Reply', 'Please enter a message to send.', 'error');
        return;
      }

      const btn = triggerElem.tagName === 'BUTTON' ? triggerElem : (input ? input.nextElementSibling : null);
      if (btn) PDMS.setButtonLoading(btn, true, 'Sending...');

      const currentResponses = Array.isArray(c.responses) ? c.responses.slice() : [];
      const newResponse = {
        id: 'RSP-' + Date.now(),
        author: user.name || 'User',
        authorRole: user.role || 'Staff',
        message: message,
        time: new Date().toISOString(),
        isStaff: canManageAll
      };
      currentResponses.push(newResponse);

      const patch = {
        responses: currentResponses,
        updatedAt: new Date().toISOString()
      };

      PDMS.api.update('complaints', c.id, patch)
        .then(saved => {
          Object.assign(c, patch, saved || {});

          if (PDMS.notifyComplaintResponse) {
            PDMS.notifyComplaintResponse(c, message, user);
          }

          PDMS.toast('Reply Sent', 'Your response was added.', 'success');
          render();
        })
        .catch(err => {
          if (btn) PDMS.setButtonLoading(btn, false);
          PDMS.toast('Error', err.message || 'Could not send reply', 'error');
        });
    }

    function closeAndDeleteComplaint(complaintId) {
      const user = PDMS.getUser();
      const list = allComplaints();
      const c = list.find(item => String(item.id) === String(complaintId));
      if (!c) {
        PDMS.toast('Not Found', 'Complaint record could not be found.', 'error');
        return;
      }
      if (!PDMS.canCloseComplaint || !PDMS.canCloseComplaint(c, user)) {
        PDMS.toast('Permission Denied', 'You do not have permission to close this ticket.', 'error');
        return;
      }

      PDMS.confirm(
        'Close & Delete Ticket',
        `Are you sure you want to close Ticket #${c.ticketNumber || c.id}? Closing this ticket will permanently delete it and its conversation from the system.`,
        () => {
          PDMS.api.remove('complaints', c.id)
            .then(() => {
              const removeFrom = (arr) => {
                if (!Array.isArray(arr)) return;
                const idx = arr.findIndex(x => x && (String(x.id) === String(c.id) || (c.ticketNumber && String(x.ticketNumber) === String(c.ticketNumber))));
                if (idx >= 0) arr.splice(idx, 1);
              };
              if (window.PDMS_DATA && window.PDMS_DATA.complaints) removeFrom(window.PDMS_DATA.complaints);
              if (window.PDMS_REMOTE && window.PDMS_REMOTE.complaints) removeFrom(window.PDMS_REMOTE.complaints);

              PDMS.toast('Ticket Closed', `Ticket #${c.ticketNumber || c.id} was closed and permanently deleted.`, 'success');
              render();
            })
            .catch(err => {
              PDMS.toast('Error', err.message || 'Could not close ticket', 'error');
            });
        },
        null,
        'Yes, Close & Delete',
        'btn-danger'
      );
    }

    function switchTab(tab) {
      activeTab = tab;
      render();
    }

    function openNewComplaintModal() {
      const user = PDMS.getUser();
      if (!user) return;

      let uploadedFile = null;

      const bodyHtml = `
        <div class="form-row" style="margin-bottom:14px">
          <label>Category <span style="color:var(--danger)">*</span></label>
          <select id="cmpCategory" style="width:100%">
            ${CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join('')}
          </select>
        </div>

        <div class="form-row" style="margin-bottom:14px">
          <label>Subject / Summary <span style="color:var(--danger)">*</span></label>
          <input id="cmpSubject" placeholder="Brief summary of the issue or dispute" autocomplete="off" style="width:100%"/>
        </div>

        <div class="form-row" style="margin-bottom:14px">
          <label>Detailed Description <span style="color:var(--danger)">*</span></label>
          <textarea id="cmpDescription" rows="5" placeholder="Provide full details, background context, timeline, and parties involved..." style="width:100%"></textarea>
        </div>

        <div class="form-row" style="margin-bottom:6px">
          <label>Supporting Document / Evidence (Optional)</label>
          <div id="cmpDropzone" style="border:1.5px dashed var(--border);border-radius:10px;padding:16px;text-align:center;background:var(--surface-2);cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--text-muted);font-size:13px">
            <span style="display:inline-flex;color:var(--primary);font-size:18px">${I('upload')}</span>
            <span>Click to browse or drag file here (PDF, DOCX, XLSX, Images • max 10MB)</span>
            <input type="file" id="cmpFileInput" style="display:none"/>
          </div>
          <div id="cmpSelectedFile" style="display:none;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;margin-top:8px">
            <div style="display:flex;align-items:center;gap:8px;min-width:0">
              <span style="display:inline-flex;color:var(--primary)">${I('file')}</span>
              <span id="cmpSelectedFileName" style="font-size:13px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
              <span id="cmpSelectedFileSize" style="font-size:11px;color:var(--text-soft)"></span>
            </div>
            <button type="button" id="cmpRemoveFileBtn" class="btn btn-ghost btn-sm" style="color:var(--danger);padding:2px 8px;font-size:12px">Remove</button>
          </div>
        </div>
      `;

      const footHtml = `
        <button class="btn btn-ghost" data-close>Cancel</button>
        <button class="btn btn-primary" id="cmpSubmitBtn">${I('send')} Submit Ticket</button>
      `;

      const modal = PDMS.modal('Submit Support Ticket / Complaint', bodyHtml, footHtml, { modalClass: 'modal-lg' });

      const dropzone = modal.querySelector('#cmpDropzone');
      const fileInput = modal.querySelector('#cmpFileInput');
      const selectedBox = modal.querySelector('#cmpSelectedFile');
      const selectedFileName = modal.querySelector('#cmpSelectedFileName');
      const selectedFileSize = modal.querySelector('#cmpSelectedFileSize');
      const removeFileBtn = modal.querySelector('#cmpRemoveFileBtn');

      const handleSelectedFile = (file) => {
        if (!file) return;
        uploadedFile = file;
        selectedFileName.textContent = file.name;
        selectedFileSize.textContent = `(${PDMS.formatBytes(file.size)})`;
        selectedBox.style.display = 'flex';
        dropzone.style.display = 'none';
      };

      if (dropzone && fileInput) {
        dropzone.onclick = () => fileInput.click();
        
        dropzone.ondragover = (e) => {
          e.preventDefault();
          dropzone.style.borderColor = 'var(--primary)';
          dropzone.style.background = 'rgba(99,102,241,.06)';
        };
        dropzone.ondragleave = () => {
          dropzone.style.borderColor = 'var(--border)';
          dropzone.style.background = 'var(--surface-2)';
        };
        dropzone.ondrop = (e) => {
          e.preventDefault();
          dropzone.style.borderColor = 'var(--border)';
          dropzone.style.background = 'var(--surface-2)';
          const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
          handleSelectedFile(file);
        };

        fileInput.onchange = (e) => {
          const file = e.target.files && e.target.files[0];
          handleSelectedFile(file);
        };
      }

      if (removeFileBtn) {
        removeFileBtn.onclick = () => {
          uploadedFile = null;
          fileInput.value = '';
          selectedBox.style.display = 'none';
          dropzone.style.display = 'flex';
        };
      }

      const submitBtn = modal.querySelector('#cmpSubmitBtn');
      if (submitBtn) {
        submitBtn.onclick = function () {
          const category = modal.querySelector('#cmpCategory').value;
          const subject = modal.querySelector('#cmpSubject').value.trim();
          const description = modal.querySelector('#cmpDescription').value.trim();

          if (!subject || !description) {
            PDMS.toast('Required Fields Missing', 'Please provide a subject and description.', 'error');
            return;
          }

          const btn = this;
          PDMS.setButtonLoading(btn, true, 'Submitting...');

          const doSave = (attachmentObj) => {
            const ticketNumber = 'TKT-' + Math.floor(1000 + Math.random() * 9000);
            const record = {
              id: 'CMP-' + Date.now(),
              ticketNumber: ticketNumber,
              subject: subject,
              category: category,
              status: 'Open',
              description: description,
              submittedById: String(user.id || ''),
              submittedByName: String(user.name || ''),
              submittedByEmail: String(user.email || ''),
              submittedByRole: String(user.role || ''),
              createdAt: new Date().toISOString(),
              updatedAt: new Date().toISOString(),
              responses: [],
              attachment: attachmentObj || null
            };

            PDMS.api.create('complaints', record)
              .then(saved => {
                const finalObj = Object.assign({}, record, saved || {});
                
                const syncTo = (arr) => {
                  if (!Array.isArray(arr)) return;
                  const idx = arr.findIndex(x => x && (String(x.id) === String(finalObj.id) || (record.id && String(x.id) === String(record.id))));
                  if (idx >= 0) {
                    arr[idx] = finalObj;
                  } else {
                    arr.unshift(finalObj);
                  }
                };
                if (window.PDMS_DATA && window.PDMS_DATA.complaints) syncTo(window.PDMS_DATA.complaints);
                if (window.PDMS_REMOTE && window.PDMS_REMOTE.complaints) syncTo(window.PDMS_REMOTE.complaints);

                if (PDMS.notifyComplaintSubmitted) {
                  PDMS.notifyComplaintSubmitted(finalObj, user);
                }

                modal.remove();
                PDMS.toast('Complaint Submitted', `Ticket #${ticketNumber} has been delivered to HR, HTD, COO, and PM Head.`, 'success');
                activeTab = canManageAll ? 'all' : 'my';
                render();
              })
              .catch(err => {
                PDMS.setButtonLoading(btn, false);
                PDMS.toast('Submission Failed', err.message || 'Could not submit complaint', 'error');
              });
          };

          if (uploadedFile) {
            const reader = new FileReader();
            reader.onload = () => {
              const res = reader.result;
              const base64 = typeof res === 'string' && res.includes(',') ? res.split(',')[1] : res;
              PDMS.api.uploadDoc(uploadedFile.name, uploadedFile.type || 'application/octet-stream', base64)
                .then(uploadRes => {
                  const url = (uploadRes && uploadRes.url) ? uploadRes.url : res;
                  doSave({
                    name: uploadedFile.name,
                    url: url,
                    fileSize: uploadedFile.size,
                    fileType: uploadedFile.type
                  });
                })
                .catch(() => {
                  doSave({
                    name: uploadedFile.name,
                    url: res,
                    fileSize: uploadedFile.size,
                    fileType: uploadedFile.type
                  });
                });
            };
            reader.readAsDataURL(uploadedFile);
          } else {
            doSave(null);
          }
        };
      }
    }

          {

          },
          {
            q: 'How do I manage users and consultants in the system?',

          },
          {

            a: 'As HR leadership, you have full access to the "All Complaints" tab in this Help Center. You can read ticket details, post replies directly in the feed, and update resolution statuses.'
          }

      }

        return [

            a: 'You have full executive visibility over the "All Complaints" tab. You can inspect submitter details, review attached evidence directly, post leadership responses in the chat thread, and update resolution statuses (Open, In Review, In Progress, Resolved) or close tickets.'

    function renderFaqSection() {
      const faqs = getFaqsForRole(currentUser);
      return `
        <div style="max-width:760px;margin:0 auto;padding-top:4px">
          <div style="margin-bottom:20px;text-align:center">
            <div style="font-size:22px;font-weight:800;color:var(--text);margin-bottom:6px">
              Frequently Asked Questions
            </div>
            <div style="font-size:13.5px;color:var(--text-muted)">
              Essential guides and workflows tailored specifically to your role and permissions.
            </div>
          </div>

          <div>
            ${faqs.map((faq, idx) => `
              <div class="faq-accordion ${idx === 0 ? 'open' : ''}" id="faq-${idx}">
                <div class="faq-header" onclick="toggleFaq(${idx})">
                  <div style="display:flex;align-items:center;gap:10px">
                    <span style="color:var(--primary);font-size:15px">❓</span>
                    <span style="color:var(--text)">${PDMS.esc(faq.q)}</span>
                  </div>
                  <span class="faq-arrow">▼</span>
                </div>
                <div class="faq-body">
                  ${PDMS.esc(faq.a)}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function toggleFaq(idx) {
      const el = document.getElementById(`faq-${idx}`);
      if (el) el.classList.toggle('open');
    }

    window.switchTab = switchTab;
    window.openNewComplaintModal = openNewComplaintModal;
    window.sendInlineReply = sendInlineReply;
    window.setComplaintStatus = setComplaintStatus;
    window.toggleStatusMenu = toggleStatusMenu;
    window.closeAndDeleteComplaint = closeAndDeleteComplaint;
    window.toggleFaq = toggleFaq;

    // Deep link support: if url has #ticket=CMP-... open it automatically
    function checkHashDeepLink() {
      const hash = location.hash.replace(/^#/, '');
      if (hash.startsWith('ticket=')) {
        const ticketId = hash.replace('ticket=', '');
        setTimeout(() => {
          const el = document.getElementById('ticket-' + ticketId);
          if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            el.style.borderColor = 'var(--primary)';
            setTimeout(() => { el.style.borderColor = ''; }, 2000);
          }
        }, 300);
      }
    }

    PDMS.onRefresh(render);
    setTimeout(checkHashDeepLink, 400);
  </script>
</body>
