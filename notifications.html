<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Notifications — PSE PDMS</title>


<link rel="stylesheet" href="css/style.css?v=1789986276"/>
<style>
  .notif-tabs{
    display:flex;gap:8px;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:12px;
  }
  .notif-tab{
    padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;
    border:1px solid var(--border);background:var(--surface);color:var(--text-soft);
    cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;
  }
  .notif-tab.active{
    background:var(--primary);color:#fff;border-color:var(--primary);
  }
  .notif-tab .tab-badge{
    font-size:11px;padding:1px 6px;border-radius:10px;background:rgba(255,255,255,.2);color:#fff;
  }
  .notif-tab:not(.active) .tab-badge{
    background:var(--surface-2);color:var(--text-soft);border:1px solid var(--border);
  }
  .notif-card{
    display:flex;align-items:flex-start;gap:14px;padding:16px 20px;
    border-bottom:1px solid var(--border);transition:all .15s;cursor:pointer;
    position:relative;
  }
  .notif-card:last-child{border-bottom:none}
  .notif-card.unread{background:var(--primary-10,rgba(99,102,241,.05))}
  .notif-card:hover{background:var(--surface-2)}
  .notif-icon-wrap{
    width:40px;height:40px;border-radius:12px;background:var(--primary-10,rgba(99,102,241,.1));
    color:var(--primary);display:grid;place-items:center;flex-shrink:0;
  }
  .notif-icon-wrap.icon-zap{background:rgba(234,179,8,.1);color:#ca8a04}
  .notif-icon-wrap.icon-refresh{background:rgba(99,102,241,.1);color:var(--primary)}
  .notif-icon-wrap.icon-users{background:rgba(16,185,129,.1);color:#059669}
  .notif-icon-wrap.icon-user-plus{background:rgba(139,92,246,.1);color:#7c3aed}
  .notif-icon-wrap.icon-message{background:rgba(59,130,246,.1);color:#2563eb}
  .notif-icon-wrap.icon-folder{background:rgba(249,115,22,.1);color:#ea580c}
  .notif-title{font-weight:700;font-size:14px;color:var(--text)}
  .notif-msg{font-size:13px;color:var(--text-muted);margin-top:2px;line-height:1.4}
  .notif-meta{display:flex;align-items:center;gap:10px;margin-top:6px}
  .notif-time{font-size:12px;color:var(--text-soft)}
  .notif-link{font-size:12px;font-weight:600;color:var(--primary);text-decoration:none}
  .notif-link:hover{text-decoration:underline}
  .notif-dismiss-btn{
    padding:6px 14px;border-radius:8px;border:1px solid var(--border);
    background:var(--surface);color:var(--text-soft);font-size:12px;font-weight:600;
    cursor:pointer;transition:all .15s;flex-shrink:0;align-self:center;line-height:1.2;
  }
  .notif-card:hover .notif-dismiss-btn{border-color:rgba(99,102,241,.3)}
  .notif-dismiss-btn:hover{
    background:rgba(239,68,68,.1)!important;color:#ef4444!important;border-color:rgba(239,68,68,.3)!important;
  }
</style>
</head><body>
<script src="js/bundle.js?v=1789986276"></script>
<script>
PDMS.mountShell('notifications');
const D = PDMS_DATA; const I = PDMS.icon;
let currentTab = 'active'; // 'active' or 'all'

function timeAgo(iso){
  if(!iso) return '';
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.round(diffMs/60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins + 'm ago';
  const hrs = Math.round(mins/60);
  if(hrs < 24) return hrs + 'h ago';
  return Math.round(hrs/24) + 'd ago';
}

function iconClass(icon){
  return 'icon-'+(icon||'bell');
}

function clearAll(){
  const btn = document.querySelector('.page-head button');
  if(btn) btn.disabled = true;
  if(PDMS.clearAllNotifications){
    PDMS.clearAllNotifications().then(()=>{
      PDMS.toast('Cleared','All active notifications cleared from your feed','success');
      render();
    }).catch(()=>render());
  }
}

function dismissOne(id, e){
  if(e) {
    e.stopPropagation();
    e.preventDefault();
  }
  if(PDMS.dismissNotification){
    PDMS.dismissNotification(id, e);
    PDMS.toast('Dismissed','Notification cleared','info');
    render();
  }
}

function switchTab(tab){
  currentTab = tab;
  render();
}

function render(){
  const user = PDMS.getUser();
  const liveNotifs = (window.PDMS_REMOTE && window.PDMS_REMOTE.notifications) || D.notifications || [];

  // Active unread notifications
  const activeNotifs = PDMS.notificationsFor ? PDMS.notificationsFor(user) : liveNotifs.filter(n => PDMS.isNotificationUnread ? PDMS.isNotificationUnread(n, user) : n.unread);
  
  // All notifications including archive
  const allNotifs = PDMS.notificationsFor ? PDMS.notificationsFor(user, { includeCleared: true }) : liveNotifs;

  const currentList = (currentTab === 'active') ? activeNotifs : allNotifs;
  const sorted = currentList.slice().sort((a,b)=>new Date(b.time || 0)-new Date(a.time || 0));

  document.getElementById('content').innerHTML = `
  <div class="page-head">
    <div>
      <div class="breadcrumbs"><span>Home</span><span>Notifications</span></div>
      <h1 class="page-title">Notifications</h1>
      <div class="page-sub">${activeNotifs.length} active · ${allNotifs.length} total received</div>
    </div>
    <div class="flex gap-2">
      ${activeNotifs.length ? `<button class="btn btn-secondary" onclick="clearAll()">${I('check')} Clear all active</button>` : ''}
    </div>
  </div>

  <div class="notif-tabs">
    <button class="notif-tab ${currentTab === 'active' ? 'active' : ''}" onclick="switchTab('active')">
      Active <span class="tab-badge">${activeNotifs.length}</span>
    </button>
    <button class="notif-tab ${currentTab === 'all' ? 'active' : ''}" onclick="switchTab('all')">
      Archive &amp; History <span class="tab-badge">${allNotifs.length}</span>
    </button>
  </div>

  <div class="card" style="padding:0;overflow:hidden">
    ${sorted.length ? sorted.map(n => {
      const ic = n.icon || 'bell';
      const isCleared = PDMS.isNotificationCleared ? PDMS.isNotificationCleared(n, user) : !n.unread;
      return `
      <div class="notif-card ${isCleared ? '' : 'unread'}" onclick="PDMS.markNotificationAsRead('${PDMS.esc(n.id)}', '${PDMS.esc(n.link||'')}')">
        <div class="notif-icon-wrap ${iconClass(ic)}">${I(ic)}</div>
        <div style="flex:1;min-width:0">
          <div class="notif-title">${PDMS.esc(n.title||'')}</div>
          <div class="notif-msg">${PDMS.esc(n.msg||'')}</div>
          <div class="notif-meta">
            <span class="notif-time">${timeAgo(n.time)}</span>
            ${n.link ? `<span class="notif-link">View Details →</span>` : ''}
          </div>
        </div>
        ${!isCleared ? `<button class="notif-dismiss-btn" onclick="dismissOne('${PDMS.esc(n.id)}', event)">Dismiss</button>` : ''}
      </div>`;
    }).join('') : `
    <div style="text-align:center;padding:48px 24px;color:var(--text-muted)">
      ${PDMS.emptyOrLoading(currentTab === 'active' ? 'All caught up! No active notifications in your feed.' : 'No notification history.')}
    </div>`}
  </div>
  `;
}

window.clearAll = clearAll;
window.dismissOne = dismissOne;
window.switchTab = switchTab;
PDMS.onRefresh(render);
</script>
</body></html>
