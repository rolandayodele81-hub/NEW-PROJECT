<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Delivery Dashboard — PSE PDMS</title>
  
  
<link rel="stylesheet" href="css/style.css"/>
  <style>
    .htd-hero {
      display: grid;
      grid-template-columns: 1.3fr 0.7fr;
      gap: 20px;
      padding: 24px 26px;
      border-radius: 28px;
      background: linear-gradient(135deg, #090d16 0%, #1d3c88 40%, #8b5cf6 75%, #ec4899 100%);
      color: #fff;
      position: relative;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(29, 60, 136, .25);
      margin-bottom: 24px;
    }

    .htd-hero::before {
      content: "";
      position: absolute;
      inset: -20% -10% auto auto;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(255, 255, 255, .2), rgba(255, 255, 255, 0) 70%);
      filter: blur(10px);
      animation: drift 8s ease-in-out infinite alternate;
    }

    .htd-hero-copy {
      position: relative;
      z-index: 1
    }

    .htd-hero-card {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px;
      border-radius: 20px;
      background: rgba(255, 255, 255, .12);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, .18);
    }

    .staffing-select {
      font-size: 12px;
      padding: 4px 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      box-sizing: border-box;
    }

    /* Typeahead for staffing table */
    .ht-ac-wrap {
      position: relative
    }

    .ht-ac-wrap input {
      font-size: 12px;
      padding: 4px 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      width: 100%;
      box-sizing: border-box
    }

    .ht-ac-drop {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      z-index: 9999;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .12);
      max-height: 160px;
      overflow-y: auto;
      display: none
    }

    .ht-ac-drop.open {
      display: block
    }

    .ht-ac-item {
      padding: 6px 10px;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px
    }

    .ht-ac-item:hover {
      background: var(--surface-2)
    }

    .ht-ac-avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      flex-shrink: 0
    }

    @keyframes drift {
      from {
        transform: translate3d(0, 0, 0)
      }

      to {
        transform: translate3d(-20px, -10px, 0)
      }
    }

    @media(max-width:900px) {
      .htd-hero {
        grid-template-columns: 1fr
      }

      .htd-hero-card {
        margin-top: 8px
      }
    }
  </style>
</head>

<body>
  <script src="js/bundle.js"></script>
  <script>
    PDMS.mountShell('dashboard');
    const D = PDMS_DATA; const I = PDMS.icon;

    function render() {
      const currentUser = PDMS.getUser();
      const isPMO = currentUser && currentUser.role === 'PMO';
      const liveProjects = (window.PDMS_REMOTE && window.PDMS_REMOTE.projects) || D.projects;
      const salesProjects = liveProjects.filter(p => D.salesStatuses && D.salesStatuses.includes(p.status));
      const deliveryProjects = isPMO
        ? liveProjects.filter(p => {
            const myName = (currentUser.name || '').toLowerCase();
            const consultants = Array.isArray(p.consultants) ? p.consultants.map(n => n.toLowerCase()) : [];
            return (p.pm || '').toLowerCase() === myName || (p.lead || '').toLowerCase() === myName || consultants.includes(myName);
          })
        : liveProjects.filter(p => (D.deliveryStatuses && D.deliveryStatuses.includes(p.status)) || p.status === 'Awaiting Account Approval');
      const allProjects = isPMO ? deliveryProjects : liveProjects;
      const activeProjects = deliveryProjects.length;
      const ongoingProjects = allProjects.filter(p => p.status === 'In Progress').length;
      const completedProjects = allProjects.filter(p => p.status === 'Completed').length;
      const closedProjects = allProjects.filter(p => p.status === 'Closed').length;
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const in14 = new Date(today); in14.setDate(in14.getDate() + 14);
      const dueForCompletion = allProjects.filter(p => { if (!p.due || p.status === 'Completed' || p.status === 'Closed') return false; const d = new Date(p.due); return d >= today && d <= in14; }).length;
      const consultants = (window.PDMS_REMOTE && window.PDMS_REMOTE.users || D.users).filter(u => u.role === 'Consultant');
      const allocated = consultants.filter(c => { const assigned = allProjects.filter(p => p.pm === c.name || p.lead === c.name || (p.consultants || []).includes(c.name)); return assigned.length > 0; }).length;

      document.getElementById('content').innerHTML = `
  <div class="htd-hero">
    <div class="htd-hero-copy">
      <h1 class="page-title" style="font-size:30px;line-height:1.1;margin-top:10px">Delivery & Operations Dashboard</h1>
      <p class="page-sub" style="font-size:14px;max-width:640px;color:rgba(255,255,255,.9);margin-top:8px">Onboard delivery leaders, assign PMs and Leads, manage consultant allocations, and oversee technical governance.</p>
      <div class="hero-actions">
        ${isPMO ? '' : `<button class="btn btn-primary" onclick="newProject()">${I('plus')} Onboard Project</button>`}
        <a class="btn btn-secondary" href="projects.html#view=delivery" style="background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.18)">${I('folder')} View Projects</a>
      </div>
    </div>
    <div class="htd-hero-card">
      <div>
        <div class="hero-card-title">Bench Utilization</div>
        <div class="hero-card-text">${allocated} of ${consultants.length} consultants are actively staffed.</div>
        <div class="hero-card-foot">Dynamic Allocation</div>
      </div>
    </div>
  </div>

  <div class="grid mb-4" style="grid-template-columns:repeat(5,1fr);gap:16px">
    <div class="stat i-primary">
      <div class="label">Total In Delivery</div>
      <div class="value">${activeProjects}</div>
      <div class="delta up">All delivery projects</div>
      <div class="icon-wrap">${I('folder')}</div>
    </div>
    <div class="stat i-warn">
      <div class="label">Ongoing</div>
      <div class="value">${ongoingProjects}</div>
      <div class="delta up">Currently in progress</div>
      <div class="icon-wrap">${I('activity')}</div>
    </div>
    <div class="stat i-success">
      <div class="label">Completed</div>
      <div class="value">${completedProjects}</div>
      <div class="delta up">Delivered successfully</div>
      <div class="icon-wrap">${I('check')}</div>
    </div>
    <div class="stat i-muted">
      <div class="label">Closed</div>
      <div class="value">${closedProjects}</div>
      <div class="delta">Formally closed out</div>
      <div class="icon-wrap">${I('zap')}</div>
    </div>
    <div class="stat i-danger">
      <div class="label">Due for Completion</div>
      <div class="value">${dueForCompletion}</div>
      <div class="delta down">Due within 14 days</div>
      <div class="icon-wrap">${I('calendar')}</div>
    </div>
  </div>

  <div class="grid" style="grid-template-columns:2fr 1fr;gap:20px;margin-bottom:24px">
    <div class="card">
      <div class="card-head">
        <div><div class="card-title">Delivery Status Breakdown</div><div class="card-sub">How many projects sit in each delivery status</div></div>
        <span class="badge badge-primary">${deliveryProjects.length} total</span>
      </div>
      <div class="card-body" style="padding:12px 20px">
        ${(() => {
          const max = Math.max(...D.deliveryStatuses.map(s => deliveryProjects.filter(p => p.status === s).length), 1);
          const sc = { 'Not Started': '#94a3b8', 'In Progress': '#f59e0b', 'On Hold': '#64748b', 'Awaiting Review': '#eab308', 'Testing / Quality Assurance': '#8b5cf6', 'Completed': '#10b981', 'Approved': '#4f46e5', 'Rejected': '#ef4444' };
          return D.deliveryStatuses.map(s => {
            const count = deliveryProjects.filter(p => p.status === s).length;
            const pct = Math.round((count / max) * 100);
            const color = sc[s] || '#94a3b8';
            return `
            <div style="display:grid;grid-template-columns:160px 1fr 36px;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--border)">
              <div class="text-sm" style="display:flex;align-items:center;gap:6px;min-width:0">
                <span style="width:8px;height:8px;border-radius:2px;background:${color};flex-shrink:0;display:inline-block"></span>
                <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s}</span>
              </div>
              <div style="background:var(--surface-2);border-radius:6px;height:14px;overflow:hidden">
                <div style="width:${pct}%;height:100%;background:${color};border-radius:6px;transition:width .4s ease;opacity:${count === 0 ? '0.25' : '1'}"></div>
              </div>
              <div class="text-sm font-semi" style="text-align:right;color:${count === 0 ? 'var(--text-muted)' : 'var(--text)'}">${count}</div>
            </div>`;
          }).join('');
        })()}
        ${deliveryProjects.length === 0 ? `<div class="text-muted text-sm text-center" style="padding:16px 0">${PDMS.emptyOrLoading('No delivery projects yet')}</div>` : ''}
      </div>
    </div>
    <div class="card">
      <div class="card-head"><div><div class="card-title">Project Progress</div><div class="card-sub">Ongoing vs completed</div></div></div>
      <div class="card-body" style="padding:8px 16px 20px">
        <div class="chart-wrap" style="height:180px"><canvas id="htdDonut"></canvas></div>
        <div id="htdDonutLegend" style="margin-top:12px;display:flex;flex-direction:column;gap:8px"></div>
      </div>
    </div>
  </div>

  <!-- Pending Account Approval -->
  ${(() => {
    const pendingApproval = deliveryProjects.filter(p => p.status === 'Awaiting Account Approval');
    if(!pendingApproval.length) return '';
    return `<div class="card mb-4" style="border:1.5px solid rgba(124,58,237,.35);box-shadow:0 4px 24px rgba(124,58,237,.1)">
      <div class="card-head">
        <div>
          <div class="card-title" style="display:flex;align-items:center;gap:8px">
            <span style="width:10px;height:10px;border-radius:50%;background:#7c3aed;display:inline-block;animation:pulse 2s infinite"></span>
            Pending Account Approval
          </div>
          <div class="card-sub">These projects are awaiting financial review by Accounts before delivery can begin</div>
        </div>
        <span class="badge" style="background:rgba(124,58,237,.12);color:#7c3aed;border:1px solid rgba(124,58,237,.25)">${pendingApproval.length} pending</span>
      </div>
      <div class="card-body" style="padding:0">
        <div style="overflow-x:auto">
          <table class="data">
            <thead><tr><th>Project</th><th>Client</th><th>Type</th><th>Priority</th><th>Status</th></tr></thead>
            <tbody>
              ${pendingApproval.map(p => `
                <tr style="opacity:.8;cursor:default" title="Locked until Accounts approves">
                  <td>
                    <div style="display:flex;align-items:center;gap:8px">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                      <div>
                        <div class="font-semi">${PDMS.esc(p.name)}</div>
                        <div style="font-size:11px;color:var(--text-soft)">${PDMS.esc(p.id)}</div>
                      </div>
                    </div>
                  </td>
                  <td class="text-muted">${PDMS.esc(p.client||'—')}</td>
                  <td class="text-muted">${PDMS.esc(p.type||'—')}</td>
                  <td><span class="badge badge-${D.prioColors[p.priority]||'muted'}">${PDMS.esc(p.priority||'—')}</span></td>
                  <td><span class="badge" style="background:rgba(124,58,237,.12);color:#7c3aed">Awaiting Account Approval</span></td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>`;
  })()}
  <style>@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}</style>

  <!-- Projects Due for Completion -->
  <div class="card mb-4">
    <div class="card-head">
      <div>
        <div class="card-title">Projects Due for Completion</div>
        <div class="card-sub">Delivery projects due within the next 14 days</div>
      </div>
      <span class="badge badge-danger">${dueForCompletion} due soon</span>
    </div>
    <div class="card-body" style="padding:0">
      <div style="overflow-x:auto">
        <table class="data">
          <thead><tr><th>Project</th><th>Client</th><th>Workstream</th><th>Due Date</th><th>Status</th></tr></thead>
          <tbody>
            ${(() => {
          const lp = (window.PDMS_REMOTE && window.PDMS_REMOTE.projects) || D.projects;
          const t = new Date(); t.setHours(0, 0, 0, 0);
          const i14 = new Date(t); i14.setDate(i14.getDate() + 14);
          const due = lp.filter(p => { if (!p.due || p.status === 'Completed' || p.status === 'Closed') return false; const d = new Date(p.due); return d >= t && d <= i14; }).sort((a, b) => new Date(a.due) - new Date(b.due));
          return due.length ? due.map(p => {
            const daysLeft = Math.ceil((new Date(p.due) - t) / 86400000);
            const urgency = daysLeft <= 3 ? 'badge-danger' : daysLeft <= 7 ? 'badge-warn' : 'badge-muted';
            return `<tr onclick="location.href='project-details.html#id=${p.id}'" style="cursor:pointer">
                  <td><div style="font-weight:600;color:var(--primary)">${PDMS.esc(p.name)}</div><div style="font-size:11px;color:var(--text-soft)">${PDMS.esc(p.id)}</div></td>
                  <td class="text-muted">${PDMS.esc(p.client || '—')}</td>
                  <td class="text-muted">${PDMS.esc(p.workstream || p.dept || '—')}</td>
                  <td><span class="badge ${urgency}">${PDMS.esc(p.due)} · ${daysLeft}d left</span></td>
                  <td><span class="badge badge-${D.statusColors[p.status] || 'muted'}">${PDMS.esc(p.status)}</span></td>
                </tr>`;
          }).join('') : `<tr><td colspan="5" class="text-muted" style="text-align:center;padding:32px">${PDMS.emptyOrLoading('No projects due in the next 14 days')}</td></tr>`;
        })()}
          </tbody>
        </table>
      </div>
    </div>
  </div>
  `;

      wireAcDrops();
    }

    // Wire autocomplete for inline PM/Lead fields after render
    function wireAcDrops() {
      document.querySelectorAll('.ht-ac-wrap input').forEach(input => {
        const drop = input.nextElementSibling;
        if (!drop) return;
        input.addEventListener('input', function () {
          const q = this.value.trim().toLowerCase();
          if (!q) { drop.classList.remove('open'); return; }
          const hits = D.users.filter(u => u.name.toLowerCase().includes(q)).slice(0, 6);
          drop.innerHTML = hits.map(u => `<div class="ht-ac-item" data-name="${PDMS.esc(u.name)}"><div class="ht-ac-avatar">${PDMS.initials(u.name)}</div><span>${PDMS.esc(u.name)}</span><span style="font-size:11px;color:var(--text-muted)">${PDMS.esc(u.role)}</span></div>`).join('') || `<div class="ht-ac-item" style="color:var(--text-muted)">No matches</div>`;
          drop.classList.add('open');
          drop.querySelectorAll('.ht-ac-item[data-name]').forEach(el => {
            el.addEventListener('mousedown', e => { e.preventDefault(); input.value = el.dataset.name; drop.classList.remove('open'); input.dispatchEvent(new Event('change')); });
          });
        });
        input.addEventListener('blur', () => setTimeout(() => drop.classList.remove('open'), 150));
      });
    }

    // Save PM/Lead field after selection or blur
    const _saveTimers = {};
    function saveField(input, projectId, field, delay) {
      clearTimeout(_saveTimers[projectId + field]);
      _saveTimers[projectId + field] = setTimeout(() => {
        const project = D.projects.find(p => p.id === projectId);
        if (!project) return;
        const val = input.value.trim();
        if (val === (project[field] || '')) return; // no change
        const patch = {}; patch[field] = val;
        PDMS.api.update('projects', projectId, patch).then(saved => {
          Object.assign(project, saved);
          PDMS.notify('Team Updated', `${PDMS.getUser().name} set ${field === 'pm' ? 'PM' : 'Lead'} of "${project.name}" to ${val || '(none)'}`, 'users', 'project-details.html#id=' + projectId);
          PDMS.toast('Saved', `${field.toUpperCase()} updated`, 'success');
        }).catch(err => PDMS.toast('Error', err.message || 'Could not save', 'error'));
      }, delay);
    }

    // acField is only needed to trigger input event for the typeahead — handled by wireAcDrops
    function acField() { }

    function manageConsultants(projectId) {
      const project = D.projects.find(p => p.id === projectId);
      if (!project) return;
      const current = project.consultants || [];
      const consultantUsers = D.users.filter(u => u.role === 'Consultant');

      const modal = PDMS.modal(`Staff Consultants — ${PDMS.esc(project.name)}`, `
    <style>
      .assign-ac-wrap{position:relative}.assign-ac-wrap input{width:100%;box-sizing:border-box}
      .assign-ac-drop{position:absolute;top:100%;left:0;right:0;z-index:9999;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.12);max-height:180px;overflow-y:auto;display:none}
      .assign-ac-drop.open{display:block}
      .assign-ac-item{padding:8px 12px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:8px}
      .assign-ac-item:hover{background:var(--surface-2)}
      .assign-ac-avatar{width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
      .assign-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;min-height:10px}
      .assign-chip{display:inline-flex;align-items:center;gap:4px;background:var(--primary-10,rgba(99,102,241,.1));color:var(--primary);border-radius:20px;padding:4px 10px;font-size:13px;font-weight:500}
      .assign-chip-x{background:none;border:none;cursor:pointer;color:var(--primary);font-size:16px;line-height:1;padding:0 0 0 2px}
    </style>
    <div class="form-row">
      <label>Assigned Consultants</label>
      <div class="assign-chips" id="mcChips"></div>
      <div class="assign-ac-wrap">
        <input id="mcSearch" autocomplete="off" placeholder="Search and add consultants…"/>
        <div class="assign-ac-drop" id="mcDrop"></div>
      </div>
    </div>
  `, `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="saveConsultBtn">${I('check')} Save</button>`);

      const selected = [...current];

      function refreshChips() {
        modal.querySelector('#mcChips').innerHTML = selected.map(name => `
      <span class="assign-chip">${PDMS.esc(name)}<button type="button" class="assign-chip-x" data-name="${PDMS.esc(name)}">×</button></span>`).join('');
        modal.querySelectorAll('.assign-chip-x').forEach(btn => {
          btn.onclick = () => { selected.splice(selected.indexOf(btn.dataset.name), 1); refreshChips(); };
        });
      }
      refreshChips();

      const mcSearch = modal.querySelector('#mcSearch');
      const mcDrop = modal.querySelector('#mcDrop');
      mcSearch.oninput = () => {
        const q = mcSearch.value.trim().toLowerCase();
        if (!q) { mcDrop.classList.remove('open'); return; }
        const hits = consultantUsers.filter(u => u.name.toLowerCase().includes(q) && !selected.includes(u.name)).slice(0, 8);
        mcDrop.innerHTML = hits.map(u => `<div class="assign-ac-item" data-name="${PDMS.esc(u.name)}"><div class="assign-ac-avatar">${PDMS.initials(u.name)}</div><div><div style="font-weight:600">${PDMS.esc(u.name)}</div><div style="font-size:12px;color:var(--text-muted)">${PDMS.esc(u.dept || '')}</div></div></div>`).join('') || `<div class="assign-ac-item" style="color:var(--text-muted)">No matches</div>`;
        mcDrop.classList.add('open');
        mcDrop.querySelectorAll('.assign-ac-item[data-name]').forEach(el => {
          el.addEventListener('mousedown', e => { e.preventDefault(); selected.push(el.dataset.name); mcSearch.value = ''; mcDrop.classList.remove('open'); refreshChips(); });
        });
      };
      mcSearch.onblur = () => setTimeout(() => mcDrop.classList.remove('open'), 150);

      modal.querySelector('#saveConsultBtn').onclick = function () {
        PDMS.api.update('projects', projectId, { consultants: selected }).then(saved => {
          Object.assign(project, saved);
          modal.remove();
          PDMS.notify('Consultants Assigned', `${PDMS.getUser().name} staffed ${selected.length} consultant(s) on "${project.name}"`, 'users', 'project-details.html#id=' + projectId);
          PDMS.toast('Staff updated', `Consultants saved for ${projectId}`, 'success');
          render();
        }).catch(err => PDMS.toast('Error', err.message || 'Could not save', 'error'));
      };
    }

    function newUser() {
      const modal = PDMS.modal('Onboard New Delivery Resource', `
    <div class="form-grid">
      <div class="form-row"><label>Full Name</label><input id="newUserName" placeholder="Jane Smith"/></div>
      <div class="form-row"><label>Email</label><input id="newUserEmail" type="email" placeholder="jane.smith@pse.com"/></div>
      <div class="form-row"><label>Password</label><input id="newUserPassword" type="password" placeholder="Create initial password"/></div>
      <div class="form-row"><label>Role</label><select id="newUserRole">${D.roles.filter(r => r !== 'System Administrator').map(r => `<option value="${r}">${r}</option>`).join('')}</select></div>
      <div class="form-row"><label>Skill Set</label><input id="newUserDept" type="text" placeholder="e.g. Cyber Security"/></div>
      <div class="form-row"><label>Phone</label><input id="newUserPhone" type="text" placeholder="+1 555 123 4567"/></div>
      <div class="form-row"><label>Date of Birth</label><input id="newUserBirthday" type="date"/></div>
      <div class="form-row"><label>Date of Entry</label><input id="newUserEntry" type="date"/></div>
    </div>
  `, `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="createUserBtn">${I('check')} Onboard</button>`);

      modal.querySelector('#createUserBtn').onclick = function () {
        const name = modal.querySelector('#newUserName').value.trim();
        const email = modal.querySelector('#newUserEmail').value.trim().toLowerCase();
        const password = modal.querySelector('#newUserPassword').value;
        const role = modal.querySelector('#newUserRole').value;
        const dept = modal.querySelector('#newUserDept').value.trim();
        const phone = modal.querySelector('#newUserPhone').value.trim();
        const birthday = modal.querySelector('#newUserBirthday').value;
        const dateOfEntry = modal.querySelector('#newUserEntry').value;
        if (!name || !email || !password) { PDMS.toast('Missing info', 'Name, email and password are required', 'error'); return; }
        if (D.users.some(u => u.email.toLowerCase() === email)) { PDMS.toast('Email in use', 'A user with this email already exists', 'error'); return; }
        const record = { name, email, password, role, dept, phone, birthday: birthday || '', dateOfEntry: dateOfEntry || '', workload: 0, joined: new Date().toISOString().slice(0, 10), status: 'Active' };
        PDMS.api.register(record).then(saved => {
          D.users.unshift(saved);
          modal.remove();
          const creator = PDMS.getUser();
          PDMS.notify('User Onboarded', `${creator ? creator.name : 'HTD'} onboarded ${saved.name} as ${saved.role}`, 'user-plus', 'user-details.html#id=' + saved.id);
          showNewUserPasswordNote(saved, password);
          render();
        }).catch(err => PDMS.toast('Error', err.message || 'Could not onboard user', 'error'));
      };
    }

    function showNewUserPasswordNote(user, password) {
      const modal = PDMS.modal('User Onboarded Successfully', `
    <p class="text-sm text-muted" style="margin-bottom:16px">The account for ${PDMS.esc(user.name)} is active. Share this password securely and ask them to change it on first login.</p>
    <div style="text-align:center;padding:18px;background:var(--surface-2);border:1px dashed var(--border);border-radius:10px;font-size:20px;font-weight:800;letter-spacing:1px;color:var(--primary)">${PDMS.esc(password)}</div>
  `, `<button class="btn btn-primary w-full" data-close>Got it</button>`);
      modal.querySelector('.modal').classList.add('modal-sm');
    }

    function npMakeAc(inputEl, dropEl, getItems) {
      inputEl.addEventListener('input', () => {
        const q = inputEl.value.trim().toLowerCase();
        const hits = q ? getItems().filter(x => x.toLowerCase().includes(q)).slice(0, 8) : [];
        if (!hits.length) { dropEl.classList.remove('open'); return; }
        dropEl.innerHTML = hits.map(v => `<div class="np-ac-item" data-val="${PDMS.esc(v)}">${PDMS.esc(v)}</div>`).join('');
        dropEl.classList.add('open');
        dropEl.querySelectorAll('.np-ac-item').forEach(el => {
          el.addEventListener('mousedown', e => { e.preventDefault(); inputEl.value = el.dataset.val; dropEl.classList.remove('open'); });
        });
      });
      inputEl.addEventListener('blur', () => setTimeout(() => dropEl.classList.remove('open'), 150));
    }

    function newProject() {
      const user = PDMS.getUser();
      const statusOptions = D.deliveryStatuses;
      const defaultStatus = statusOptions[0];
      const modal = PDMS.modal('', `
        <style>
          .np-hero{background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 60%,#a855f7 100%);border-radius:16px;padding:20px 22px;margin-bottom:20px;display:flex;align-items:center;gap:14px}
          .np-hero-icon{width:44px;height:44px;background:rgba(255,255,255,.18);border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
          .np-hero-icon svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round}
          .np-hero-copy .np-title{font-size:17px;font-weight:800;color:#fff;line-height:1.2}
          .np-hero-copy .np-sub{font-size:12px;color:rgba(255,255,255,.65);margin-top:3px}
          .np-section{margin-bottom:18px}
          .np-section-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
          .np-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
          .np-field{display:flex;flex-direction:column;gap:5px}
          .np-field.full{grid-column:1/-1}
          .np-field label{font-size:11px;font-weight:600;color:var(--text-soft);letter-spacing:.03em}
          .np-field input,.np-field select,.np-field textarea{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-size:13px;color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s;font-family:Inter,sans-serif;width:100%;box-sizing:border-box}
          .np-field input:focus,.np-field select:focus,.np-field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.12)}
          .np-field textarea{resize:vertical;min-height:72px}
          .np-ac-wrap{position:relative}
          .np-ac-wrap input{width:100%;box-sizing:border-box}
          .np-ac-drop{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:9999;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.13);max-height:180px;overflow-y:auto;display:none}
          .np-ac-drop.open{display:block}
          .np-ac-item{padding:9px 13px;cursor:pointer;font-size:13px;color:var(--text)}
          .np-ac-item:hover{background:var(--surface-2)}
          .np-required{color:#ef4444;margin-left:2px}
        </style>
        <div>
          <div class="np-hero">
            <div class="np-hero-icon"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div>
            <div class="np-hero-copy">
              <div class="np-title">Onboard New Project</div>
              <div class="np-sub">Fill in the details below to add a delivery project</div>
            </div>
          </div>
          <div class="np-section">
            <div class="np-section-label">Project Information</div>
            <div class="np-grid">
              <div class="np-field">
                <label>Client<span class="np-required">*</span></label>
                <div class="np-ac-wrap">
                  <input id="npClient" autocomplete="off" placeholder="Search or type client name…"/>
                  <div class="np-ac-drop" id="npClientDrop"></div>
                </div>
              </div>
              <div class="np-field">
                <label>Project Name<span class="np-required">*</span></label>
                <div class="np-ac-wrap">
                  <input id="npName" autocomplete="off" placeholder="Enter project name…"/>
                  <div class="np-ac-drop" id="npNameDrop"></div>
                </div>
              </div>
              <div class="np-field">
                <label>Project Type</label>
                <input id="npType" type="text" placeholder="e.g. Software Development"/>
              </div>
              <div class="np-field">
                <label>Workstream</label>
                <input id="npWorkstream" type="text" placeholder="e.g. QMS, FSMS…"/>
              </div>
              <div class="np-field full">
                <label>Status</label>
                <select id="npStatus">${statusOptions.map(s => `<option${s === defaultStatus ? ' selected' : ''}>${s}</option>`).join('')}</select>
              </div>
            </div>
          </div>
          <div class="np-section">
            <div class="np-section-label">Timeline</div>
            <div class="np-grid">
              <div class="np-field">
                <label>Start Date</label>
                <input id="npStart" type="date"/>
              </div>
              <div class="np-field">
                <label>Planned Completion</label>
                <input id="npDue" type="date"/>
              </div>
              <div class="np-field full">
                <label>Actual Completion</label>
                <input id="npActual" type="date"/>
              </div>
            </div>
          </div>
          <div class="np-section" style="margin-bottom:0">
            <div class="np-section-label">Description</div>
            <div class="np-field">
              <textarea id="npDesc" placeholder="Scope, goals, deliverables…"></textarea>
            </div>
          </div>
        </div>
      `, `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="npCreateBtn">${I('plus')} Create Project</button>`);

      npMakeAc(modal.querySelector('#npClient'), modal.querySelector('#npClientDrop'), () => D.clients.map(c => c.name));
      npMakeAc(modal.querySelector('#npName'), modal.querySelector('#npNameDrop'), () => D.projects.map(p => p.name));

      modal.querySelector('#npCreateBtn').onclick = function () {
        const name = modal.querySelector('#npName').value.trim();
        const clientTyped = modal.querySelector('#npClient').value.trim();
        const type = modal.querySelector('#npType').value.trim();
        const workstream = modal.querySelector('#npWorkstream').value.trim();
        const status = modal.querySelector('#npStatus').value;
        const start = modal.querySelector('#npStart').value;
        const due = modal.querySelector('#npDue').value;
        const actualCompletion = modal.querySelector('#npActual').value;
        const desc = modal.querySelector('#npDesc').value.trim();
        if (!name || !clientTyped) { PDMS.toast('Missing info', 'Project name and client are required', 'error'); return; }
        const btn = this;
        PDMS.setButtonLoading(btn, true, 'Creating...');
        setTimeout(() => PDMS.setButtonLoading(btn, false), 10000);
        const existingClient = D.clients.find(cl => cl.name.toLowerCase() === clientTyped.toLowerCase());
        const ensureClient = existingClient ? Promise.resolve(existingClient) : PDMS.api.create('clients', { name: clientTyped, industry: '', email: '', phone: '', address: '', projects: 0 });
        ensureClient.then(client => {
          if (!existingClient) D.clients.unshift(client);
          return PDMS.api.create('projects', {
            name, client: client.name, type, workstream, dept: workstream,
            sales: '', pm: '', lead: '', consultants: [],
            status, stage: 'Delivery', createdByRole: user ? user.role : 'HTD', progress: 0,
            start: start || '', due: due || '', actualCompletion: actualCompletion || '', completion: null,
            description: desc, files: 0, remarks: 0
          });
        }).then(saved => {
          D.projects.unshift(saved);
          modal.remove();
          PDMS.toast('Project created', 'New delivery project onboarded', 'success');
          PDMS.notify('Project Onboarded', `${user ? user.name : 'HTD'} onboarded "${saved.name}" for ${saved.client}`, 'folder', 'project-details.html#id=' + saved.id);
          renderAll();
        }).catch(err => PDMS.toast('Error', err.message || 'Could not create project', 'error'));
      };
    }
    window.newProject = newProject;
    window.newUser = newUser;
    window.manageConsultants = manageConsultants;
    window.acField = acField;
    window.saveField = saveField;

    function renderHtdDonut() {
      const canvas = document.getElementById('htdDonut');
      const legend = document.getElementById('htdDonutLegend');
      if (!canvas || !legend) return;
      const lp = (window.PDMS_REMOTE && window.PDMS_REMOTE.projects) || D.projects;
      const dp = lp.filter(p => PDMS.stageOf(p) === 'Delivery');
      const ongoing = dp.filter(p => p.status === 'In Progress').length;
      const completed = dp.filter(p => p.status === 'Completed').length;
      const rest = dp.length - ongoing - completed;
      PDMS.charts.donut(canvas, [ongoing, completed], ['#f59e0b', '#10b981']);
      legend.innerHTML = [
        ['#f59e0b', 'Ongoing', ongoing],
        ['#10b981', 'Completed', completed]
      ].map(([c, l, v]) => `<div style="display:flex;align-items:center;justify-content:space-between;font-size:12px">
        <div style="display:flex;align-items:center;gap:7px"><span style="width:10px;height:10px;border-radius:50%;background:${c};flex-shrink:0"></span><span style="color:var(--text-muted)">${l}</span></div>
        <span style="font-weight:700;color:var(--text)">${v}</span>
      </div>`).join('');
    }

    function renderAll() { render(); setTimeout(renderHtdDonut, 50); }
    PDMS.onRefresh(renderAll);
  </script>
</body>

</html>
