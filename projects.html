<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Projects — PSE PDMS</title>


<link rel="stylesheet" href="css/style.css?v=1788867580"/>
<style>
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
.sh-pending-dot { width:8px;height:8px;border-radius:50%;background:#f59e0b;display:inline-block;animation:pulse 2s infinite }
.locked-badge { display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;background:rgba(245,158,11,.12);color:#d97706;border:1px solid rgba(245,158,11,.25); }
</style>
</head><body>
<script src="js/bundle.js?v=1788867580"></script>
<script>
// A hash (not a query string) survives any host's clean-URL rewriting untouched,
// since it's never sent to the server — unlike ?view=, which some static hosts strip.
const hashParams = new URLSearchParams(location.hash.replace(/^#/,''));
const searchParams = new URLSearchParams(location.search);
const viewParam = hashParams.get('view') || searchParams.get('view');
let initialStatusParam = hashParams.get('status') || searchParams.get('status') || '';
let initialFilterParam = hashParams.get('filter') || searchParams.get('filter') || '';
let initialTaskFilterParam = hashParams.get('taskFilter') || searchParams.get('taskFilter') || '';

window.addEventListener('hashchange', ()=>location.reload());

const activeNavId = viewParam==='sales' ? 'sales-pipeline' : viewParam==='delivery' ? 'delivery-projects' : 'projects';
PDMS.mountShell(activeNavId);
const D = PDMS_DATA; const I = PDMS.icon;
const currentUser = PDMS.getUser();

const pageInfo = viewParam==='sales' ? {title:'Sales Pipeline', sub:'Projects created by Sales, from first contact to client approval'}
  : viewParam==='delivery' ? {title:'Projects in Delivery', sub:'Projects created directly by the delivery team (COO/HTD/PM Head/PMO)'}
  : {title:'Projects', sub:'Manage all engagements across the organization'};

// Bucketing is by WHO created the project, not its current status — a project
// created by Sales stays in Sales Pipeline for its whole life; a project created
// by a delivery role stays in Projects in Delivery for its whole life.
function scopedProjects(){
  const liveProjects = (window.PDMS_REMOTE && window.PDMS_REMOTE.projects) || D.projects;
  const user = PDMS.getUser() || currentUser;
  let list = liveProjects;
  if(user && (user.role === 'Consultant' || user.role === 'PMO')){
    const myName = (user.name||'').toLowerCase();
    const myEmail = (user.email||'').toLowerCase();
    const myId = String(user.id||'').toLowerCase();
    list = liveProjects.filter(p=>{
      const consultants = Array.isArray(p.consultants) ? p.consultants.map(String).map(n=>n.toLowerCase()) : [];
      return consultants.includes(myName) || consultants.includes(myEmail) || consultants.includes(myId)
        || (p.pm||'').toLowerCase()===myName
        || (p.pm||'').toLowerCase()===myEmail
        || (p.lead||'').toLowerCase()===myName
        || (p.lead||'').toLowerCase()===myEmail
        || (PDMS.projectOwnedByUser && PDMS.projectOwnedByUser(p, user));
    });
  } else if(viewParam==='sales' || (!viewParam && user && String(user.role).trim().toLowerCase() === 'sales')) {
    const isSalesOnly = user && String(user.role).trim().toLowerCase() === 'sales';
    const isSalesOriginProject = p => {
      if (!p) return false;
      const role = String(p.createdByRole || '').trim();
      if (['HTD', 'COO', 'PM Head', 'PMO', 'Consultant', 'General Admin'].includes(role)) return false;
      if (p.stage === 'Delivery' && !p.sales && !p.projectOwnerId && !p.projectOwnerName && !role.toLowerCase().includes('sales')) return false;
      return true;
    };

    if(isSalesOnly) {
      const mySales = liveProjects.filter(p => isSalesOriginProject(p) && (PDMS.isSalesStatus(p.status) || p.status==='Awaiting Account Approval' || p.status==='Awaiting Sales Head Approval' || p.status==='Cancelled' || p.stage==='Delivery' || p.status==='Closed' || (D.deliveryStatuses && D.deliveryStatuses.includes(p.status))));
      list = mySales.filter(p => PDMS.projectOwnedByUser(p, user));
    } else {
      list = liveProjects.filter(p => {
        if (!isSalesOriginProject(p)) return false;
        if (p.status === 'Awaiting Sales Head Approval') return false;
        return PDMS.isSalesStatus(p.status) || p.status==='Cancelled' || p.status==='Awaiting Account Approval' || p.stage==='Delivery' || p.status==='Closed' || (D.deliveryStatuses && D.deliveryStatuses.includes(p.status));
      });
    }
  } else if(viewParam==='delivery') {
    list = liveProjects.filter(p => {
      if (p.status === 'Awaiting Account Approval' || p.status === 'Awaiting Sales Head Approval') return false;
      const preAward = ['Lead', 'Opportunity', 'Initial Proposal', 'Negotiation', 'Invoicing', 'Award/SLA'];
      if (preAward.includes(p.status)) return false;
      if (p.status === 'Cancelled' && p.stage === 'Sales' && !p.deliveryStatus) return false;
      return true;
    });
  }
  return PDMS.sortNewestFirst ? PDMS.sortNewestFirst(list.slice()) : list;
}

// Each bucket is filtered/kanban'd using its own status vocabulary.
const bucketStatuses = (viewParam==='sales' ? ['Active Pipeline', ...D.salesStatuses] : viewParam==='delivery' ? ['Ongoing', ...D.deliveryStatuses] : D.statuses).filter(s => s !== 'Awaiting Sales Head Approval' && s !== 'Awaiting Account Approval');
const kanbanStatuses = (viewParam==='sales' ? D.salesStatuses : viewParam==='delivery' ? D.deliveryStatuses : D.statuses).filter(s => s !== 'Awaiting Sales Head Approval' && s !== 'Awaiting Account Approval');
const isSalesUserOwner = viewParam==='sales' && currentUser && currentUser.role === 'Sales';

// "In Pipeline" / "Active Pipeline" represents all leads/deals that have been approved by Sales Head but not yet awarded SLA
const matchInPipeline = p => {
  const norm = PDMS.normalizeStatus ? PDMS.normalizeStatus(p.status) : p.status;
  const isPipelineStage = ['Lead', 'Opportunity', 'Initial Proposal', 'Negotiation', 'Invoicing'].includes(norm);
  const isApprovedBySalesHead = p.status !== 'Awaiting Sales Head Approval' && !(p.status === 'Cancelled' && p.salesHeadRejectionNote);
  const notAwarded = p.status !== 'Award/SLA' && p.status !== 'Awaiting Account Approval' && p.status !== 'Closed' && p.stage !== 'Delivery' && p.status !== 'Cancelled' && p.status !== 'On Hold';
  return isPipelineStage && isApprovedBySalesHead && notAwarded;
};

const statTiles = viewParam==='sales'
  ? (isSalesUserOwner
      ? [
          {label:'Total Deals', match:()=>true, filterStatus:null, color:'primary', icon:'folder'},
          {label:'In Pipeline', filterStatus:'Active Pipeline', match:matchInPipeline, color:'info', icon:'activity'},
          {label:'Pending Approval', filterStatus:'Awaiting Sales Head Approval', match:p=>p.status==='Awaiting Sales Head Approval', color:'warn', icon:'clock'},
          {label:'Award/SLA', filterStatus:'Award/SLA', match:p=>(p.status==='Award/SLA' || p.status==='Awaiting Account Approval') && p.status!=='Cancelled' && p.status!=='On Hold', color:'purple', icon:'check'},
          {label:'Closed Deals', filterStatus:'Closed', match:p=>(p.status==='Closed'||((p.stage==='Delivery'||(PDMS.stageOf&&PDMS.stageOf(p)==='Delivery'))&&p.status!=='Cancelled'&&p.status!=='On Hold'&&p.status!=='Awaiting Account Approval'&&p.status!=='Awaiting Sales Head Approval')), color:'success', icon:'briefcase'},
          {label:'On Hold', filterStatus:'On Hold', match:p=>p.status==='On Hold', color:'warn', icon:'clock'},
          {label:'Cancelled', filterStatus:'Cancelled', match:p=>p.status==='Cancelled', color:'danger', icon:'close'}
        ]
      : [
          {label:'Total Deals', match:()=>true, filterStatus:null, color:'primary', icon:'folder'},
          {label:'In Pipeline', filterStatus:'Active Pipeline', match:matchInPipeline, color:'info', icon:'activity'},
          {label:'Award/SLA', filterStatus:'Award/SLA', match:p=>(p.status==='Award/SLA' || p.status==='Awaiting Account Approval') && p.status!=='Cancelled' && p.status!=='On Hold', color:'purple', icon:'check'},
          {label:'Closed Deals', filterStatus:'Closed', match:p=>(p.status==='Closed'||((p.stage==='Delivery'||(PDMS.stageOf&&PDMS.stageOf(p)==='Delivery'))&&p.status!=='Cancelled'&&p.status!=='On Hold'&&p.status!=='Awaiting Account Approval')), color:'success', icon:'briefcase'},
          {label:'On Hold', filterStatus:'On Hold', match:p=>p.status==='On Hold', color:'warn', icon:'clock'},
          {label:'Cancelled', filterStatus:'Cancelled', match:p=>p.status==='Cancelled', color:'danger', icon:'close'}
        ])
  : viewParam==='delivery'
  ? [
      {label:'Total', match:()=>true, filterStatus:null, color:'primary', icon:'folder'},
      {label:'Ongoing', filterStatus:'Ongoing', match:p=>{
        const s = PDMS.deliveryStatusOf ? PDMS.deliveryStatusOf(p) : (p.deliveryStatus || p.status);
        return !!s && !['Not Started','Completed','Closure','Project Closure','Closed','On Hold','Cancelled'].includes(s);
      }, color:'warn', icon:'activity'},
      {label:'On Hold', filterStatus:'On Hold', match:p=>{
        const s = PDMS.deliveryStatusOf ? PDMS.deliveryStatusOf(p) : (p.deliveryStatus || p.status);
        return s==='On Hold' || p.status==='On Hold';
      }, color:'warn', icon:'clock'},
      {label:'Completed', filterStatus:'Completed', match:p=>{
        const s = PDMS.deliveryStatusOf ? PDMS.deliveryStatusOf(p) : (p.deliveryStatus || p.status);
        return s === 'Completed';
      }, color:'success', icon:'check'},
      {label:'Closed', filterStatus:'Closure', match:p=>{
        const s = PDMS.deliveryStatusOf ? PDMS.deliveryStatusOf(p) : (p.deliveryStatus || p.status);
        return ['Closure','Project Closure'].includes(s);
      }, color:'info', icon:'zap'},
      {label:'Cancelled', filterStatus:'Cancelled', match:p=>{
        const s = PDMS.deliveryStatusOf ? PDMS.deliveryStatusOf(p) : (p.deliveryStatus || p.status);
        return s==='Cancelled' || p.status==='Cancelled';
      }, color:'danger', icon:'close'}
    ]
  : (currentUser && currentUser.role==='Consultant')
  ? [
      {label:'Total', match:()=>true, filterStatus:null, color:'primary', icon:'folder'},
      {label:'With Active Tasks', filterKey:'activeTasks', filterFn:p=>(p.privateTasks||[]).some(t=>!t.done), match:p=>(p.privateTasks||[]).some(t=>!t.done), color:'warn', icon:'activity', sub:'projects'},
      {label:'Tasks Completed', filterKey:'tasksCompleted', filterFn:p=>(p.privateTasks||[]).length>0&&(p.privateTasks||[]).every(t=>t.done), match:p=>(p.privateTasks||[]).length>0&&(p.privateTasks||[]).every(t=>t.done), color:'success', icon:'check', sub:'projects'}
    ]
  : [
      {label:'Total', match:()=>true, filterStatus:null, color:'primary', icon:'folder'},
      {label:'In Progress', filterStatus:'In Progress', match:p=>p.status==='In Progress', color:'warn', icon:'activity'},
      {label:'Completed', filterStatus:'Completed', match:p=>p.status==='Completed', color:'success', icon:'check'}
    ];

let selectedTileIndex = null;
let currentCustomFilter = null;
let currentStatusFilter = initialStatusParam || '';

if (initialFilterParam === 'pipeline' || initialStatusParam === 'In Pipeline' || initialStatusParam === 'Active Pipeline' || initialStatusParam === 'pipeline') {
  currentStatusFilter = 'Active Pipeline';
  selectedTileIndex = statTiles.findIndex(t => t.label === 'In Pipeline');
} else if (initialFilterParam === 'dueSoon') {
  const today = new Date().toISOString().slice(0,10);
  const future = new Date(Date.now() + 30 * 86400000).toISOString().slice(0,10);
  currentCustomFilter = r => r.due && r.due >= today && r.due <= future && !['Completed','Closed','Cancelled'].includes(PDMS.deliveryStatusOf ? PDMS.deliveryStatusOf(r) : r.status);
} else if (initialFilterParam === 'delayed') {
  const today = new Date().toISOString().slice(0,10);
  currentCustomFilter = r => r.due && r.due < today && !['Completed','Closed','Cancelled'].includes(PDMS.deliveryStatusOf ? PDMS.deliveryStatusOf(r) : r.status);
} else if (initialFilterParam === 'dueToday') {
  const today = new Date().toISOString().slice(0,10);
  currentCustomFilter = r => r.due === today && !['Completed','Closed','Cancelled'].includes(PDMS.deliveryStatusOf ? PDMS.deliveryStatusOf(r) : r.status);
} else if (initialFilterParam === 'activeTasks' || initialTaskFilterParam === 'active') {
  currentCustomFilter = p => (p.privateTasks||[]).some(t=>!t.done);
  selectedTileIndex = statTiles.findIndex(t => t.filterKey === 'activeTasks');
} else if (initialFilterParam === 'tasksCompleted' || initialTaskFilterParam === 'completed') {
  currentCustomFilter = p => (p.privateTasks||[]).length>0 && (p.privateTasks||[]).every(t=>t.done);
  selectedTileIndex = statTiles.findIndex(t => t.filterKey === 'tasksCompleted');
}

if (currentStatusFilter) {
  const isClosedF = f => f && (f.toLowerCase() === 'closed' || f.toLowerCase() === 'closure' || f.toLowerCase() === 'project closure');
  const sIdx = statTiles.findIndex(t => t.filterStatus && (
    t.filterStatus.toLowerCase() === currentStatusFilter.toLowerCase() ||
    (isClosedF(t.filterStatus) && isClosedF(currentStatusFilter))
  ));
  if (sIdx !== -1) selectedTileIndex = sIdx;
}

// Sales can view the delivery bucket but never create there — only a delivery
// role creates projects that belong in Projects in Delivery.
const canCreateHere = viewParam==='sales' ? PDMS.isSalesRole(currentUser)
  : viewParam==='delivery' ? PDMS.isDeliveryRole(currentUser)
  : PDMS.can('Create Project');

// Sales Pipeline and Projects in Delivery default to Table view; the plain
// Projects page (used by delivery roles day-to-day) defaults to Kanban.
const defaultToTable = viewParam==='sales' || viewParam==='delivery' || (currentUser && currentUser.role==='Consultant');

const content = document.getElementById('content');
content.innerHTML = `
  <div class="page-head">
    <div><div class="breadcrumbs"><span>Home</span><span>Projects</span></div>
      <h1 class="page-title">${pageInfo.title}</h1><div class="page-sub">${pageInfo.sub}</div></div>
    <div class="flex gap-2"><button class="btn btn-secondary" id="viewToggle">${defaultToTable ? I('folder')+' Kanban View' : I('folder')+' Table View'}</button>${canCreateHere?`<button class="btn btn-primary" id="newProj">${I('plus')} ${viewParam==='sales'||(PDMS.isSalesRole&&PDMS.isSalesRole(currentUser))?'Create New Leads':'New Project'}</button>`:''}</div>
  </div>
  <div class="grid mb-4" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:16px">
    ${statTiles.map((t,i)=>`
      <div class="stat i-${t.color} ${selectedTileIndex===i?'active-filter':''}" id="stat-tile-${i}" onclick="selectStatTile(${i})" title="Click to filter by ${t.label}">
        <div class="label">${t.label}</div>
        <div class="value" id="stat-${i}">0</div>
        ${t.sub?`<div style="font-size:11px;color:var(--text-muted);margin-top:2px">${t.sub}</div>`:''}
        <div class="icon-wrap">${I(t.icon)}</div>
      </div>`).join('')}
  </div>
  <div id="listView" class="table-wrap ${defaultToTable ? '' : 'hidden'}"></div>
  <div id="kanbanView" class="${defaultToTable ? 'hidden' : ''}"></div>
`;

const canSee = PDMS.canSeePrice && PDMS.canSeePrice(currentUser);
const columns = viewParam === 'sales' ? [
  {key:'client',label:'Client',render:r=>`<div class="font-semi" style="color:var(--primary)">${PDMS.esc(r.client||r.name||'\u2014')}</div><div style="font-size:11px;color:var(--text-soft)">${PDMS.esc(r.id)}</div>`},
  ...(canSee ? [
    {key:'opportunityValue',label:'Opportunity Value',render:r=>`<span class="font-semi" style="color:var(--text)">${Number.isFinite(Number(r.opportunityValue || r.negotiatedPrice)) && Number(r.opportunityValue || r.negotiatedPrice) > 0 ? PDMS.currency(r.opportunityValue || r.negotiatedPrice) : '\u2014'}</span>`},
    {key:'awardValue',label:'Award Value (excl. VAT)',render:r=>`<span class="font-semi" style="color:var(--text)">${Number.isFinite(Number(r.awardValue || (r.stage === 'Delivery' ? r.negotiatedPrice : ''))) && Number(r.awardValue || (r.stage === 'Delivery' ? r.negotiatedPrice : '')) > 0 ? PDMS.currency(r.awardValue || r.negotiatedPrice) : '\u2014'}</span>`}
  ] : []),
  {key:'type',label:'Project Type',render:r=>`<span class="text-sm">${PDMS.esc(r.type||'\u2014')}</span>`},
  {key:'sales',label:'Deal Owner',render:r=>`<span class="text-sm text-muted font-semi">${PDMS.esc(r.projectOwnerName||(r.sales&&r.sales!=='Sales Team'?r.sales:'')||r.sales||'\u2014')}</span>`},
  {key:'status',label:'Status',render:r=> {
    // Pending Sales Head Approval
    if (r.status === 'Awaiting Sales Head Approval') {
      const stageName = r.requestedStatus || r.targetStatus || 'Lead';
      return `<span class="badge" style="background:rgba(245,158,11,.12);color:#d97706;border:1px solid rgba(245,158,11,.25);font-weight:600">${PDMS.esc(stageName)} (Pending Approval)</span>`;
    }
    // Rejected by Sales Head
    if (r.status === 'Cancelled' && r.salesHeadRejectionNote) {
      const stageName = r.requestedStatus || r.targetStatus || 'Lead';
      return `<span class="badge badge-danger" style="background:rgba(239,68,68,.12);color:#ef4444;border:1px solid rgba(239,68,68,.25);font-weight:600">${PDMS.esc(stageName)} (Rejected)</span>`;
    }
    // Pending Account Approval
    if (r.status === 'Awaiting Account Approval') {
      return `<span class="badge" style="background:rgba(124,58,237,.12);color:#7c3aed;border:1px solid rgba(124,58,237,.25);font-weight:600">Award/SLA (Pending Accounts)</span>`;
    }
    // Rejected / Returned by Accounts
    const isAccountsRejected = (r.accountsRejectionNote || r.rejectionNote) && r.status !== 'Cancelled' && !r.salesHeadRejectionNote;
    if (isAccountsRejected) {
      return `<span class="badge badge-danger" style="background:rgba(239,68,68,.12);color:#ef4444;border:1px solid rgba(239,68,68,.25);font-weight:600">Award/SLA (Returned)</span>`;
    }
    const isClosedWon = (r.status === 'Closed' || ((r.stage === 'Delivery' || (PDMS.stageOf && PDMS.stageOf(r) === 'Delivery')) && r.status !== 'Cancelled' && r.status !== 'On Hold' && r.status !== 'Award/SLA' && r.status !== 'Awaiting Account Approval'));
    const displayStatus = isClosedWon ? 'Closed' : r.status;
    return `<span class="badge badge-${D.statusColors[displayStatus]||D.statusColors[r.status]||'muted'}">${displayStatus}</span>`;
  }}
] : [
  {key:'client',label:'Client',render:r=>`<div class="font-semi" style="color:var(--primary)">${PDMS.esc(r.client||r.name||'\u2014')}</div>`},
  {key:'type',label:'Project Type',render:r=>`<span class="text-sm">${PDMS.esc(r.type||'\u2014')}</span>`},
  {key:'status',label:'Status',render:r=> {
    if (r.status === 'Awaiting Sales Head Approval') {
      const stageName = r.requestedStatus || r.targetStatus || 'Lead';
      return `<span class="badge" style="background:rgba(245,158,11,.12);color:#d97706;border:1px solid rgba(245,158,11,.25);font-weight:600">${PDMS.esc(stageName)} (Pending Approval)</span>`;
    }
    if (r.status === 'Cancelled' && r.salesHeadRejectionNote) {
      const stageName = r.requestedStatus || r.targetStatus || 'Lead';
      return `<span class="badge badge-danger" style="background:rgba(239,68,68,.12);color:#ef4444;border:1px solid rgba(239,68,68,.25);font-weight:600">${PDMS.esc(stageName)} (Rejected)</span>`;
    }
    if (r.status === 'Awaiting Account Approval') {
      return `<span class="badge" style="background:rgba(124,58,237,.12);color:#7c3aed;border:1px solid rgba(124,58,237,.25);font-weight:600">Award/SLA (Pending Accounts)</span>`;
    }
    const isAccountsRejected = (r.accountsRejectionNote || r.rejectionNote) && r.status !== 'Cancelled' && !r.salesHeadRejectionNote;
    if (isAccountsRejected) {
      return `<span class="badge badge-danger" style="background:rgba(239,68,68,.12);color:#ef4444;border:1px solid rgba(239,68,68,.25);font-weight:600">Award/SLA (Returned)</span>`;
    }
    const dStatus = viewParam === 'delivery' ? PDMS.deliveryStatusOf(r) : r.status;
    return `<span class="badge badge-${D.statusColors[dStatus]||'muted'}">${dStatus}</span>`;
  }},
  {key:'due',label:'Due'}
];

function selectStatTile(i) {
  if (selectedTileIndex === i || i === 0) {
    selectedTileIndex = null;
    currentStatusFilter = '';
    currentCustomFilter = null;
  } else {
    selectedTileIndex = i;
    const tile = statTiles[i];
    if (tile.filterStatus) {
      currentStatusFilter = tile.filterStatus;
      currentCustomFilter = null;
    } else if (tile.filterFn) {
      currentStatusFilter = '';
      currentCustomFilter = tile.filterFn;
    } else if (tile.match) {
      currentStatusFilter = '';
      currentCustomFilter = tile.match;
    }
  }
  renderProjects();
}
window.selectStatTile = selectStatTile;

function renderStats(rows){
  statTiles.forEach((t,i)=>{
    const el = document.getElementById('stat-'+i);
    if (el) el.textContent = rows.filter(t.match).length;
    const tileCard = document.getElementById('stat-tile-'+i);
    if (tileCard) {
      if (selectedTileIndex === i) {
        tileCard.classList.add('active-filter');
      } else {
        tileCard.classList.remove('active-filter');
      }
    }
  });
}

function renderProjects(){
  const liveAll = (window.PDMS_REMOTE && window.PDMS_REMOTE.projects) || D.projects;
  const rows = scopedProjects();
  renderStats(rows);

  PDMS.renderTable(document.getElementById('listView'),{
    columns, rows, pageSize:20,
    isDeliveryTable: viewParam === 'delivery',
    searchKeys:['id','client','pm','status','type'],
    filters: currentStatusFilter ? { status: currentStatusFilter } : {},
    customFilter: currentCustomFilter,
    onFilterChange: (newFilters) => {
      currentStatusFilter = newFilters.status || '';
      currentCustomFilter = null;
      const isClosedF = f => f && (f.toLowerCase() === 'closed' || f.toLowerCase() === 'closure' || f.toLowerCase() === 'project closure');
      const matchedIdx = statTiles.findIndex((t, idx) => idx > 0 && t.filterStatus && (
        t.filterStatus.toLowerCase() === currentStatusFilter.toLowerCase() ||
        (isClosedF(t.filterStatus) && isClosedF(currentStatusFilter))
      ));
      selectedTileIndex = matchedIdx !== -1 ? matchedIdx : (currentStatusFilter ? -1 : null);
      renderStats(rows);
    },
    rowHref:r=>'project-details.html#id='+r.id+(viewParam==='sales'?'&from=sales':viewParam==='delivery'?'&from=delivery':''),
    filterOptions:[
      {key:'status',label:'Status',options:bucketStatuses},
      {key:'type',label:'Project Type',options:D.types||[]}
    ],
    dateFilter: (viewParam==='sales' || viewParam==='delivery') ? { key:'start', label:'Start date' } : null
  });

  document.getElementById('kanbanView').innerHTML = `<div class="kanban">${kanbanStatuses.map(s=>{
    const matchCol = p => {
      if (currentCustomFilter && !currentCustomFilter(p)) return false;
      if (currentStatusFilter) {
        if (currentStatusFilter === 'In Pipeline' || currentStatusFilter === 'Active Pipeline') {
          const norm = PDMS.normalizeStatus ? PDMS.normalizeStatus(p.status) : p.status;
          if (!['Lead','Opportunity','Initial Proposal','Negotiation','Invoicing'].includes(norm)) return false;
          if (p.status === 'Awaiting Sales Head Approval' || p.status === 'Awaiting Account Approval' || p.status === 'Closed' || p.stage === 'Delivery' || p.status === 'Cancelled' || p.status === 'On Hold') return false;
        } else if (currentStatusFilter === 'Ongoing') {
          const dS = PDMS.deliveryStatusOf ? PDMS.deliveryStatusOf(p) : (p.deliveryStatus || p.status);
          if (!dS || ['Not Started','Completed','Closure','Project Closure','Closed','On Hold','Cancelled'].includes(dS)) return false;
        } else if (currentStatusFilter === 'Completed') {
          const dS = PDMS.deliveryStatusOf ? PDMS.deliveryStatusOf(p) : (p.deliveryStatus || p.status);
          if (dS !== 'Completed') return false;
        } else if (currentStatusFilter === 'Closed' || currentStatusFilter === 'Closure' || currentStatusFilter === 'Project Closure') {
          const dS = PDMS.deliveryStatusOf ? PDMS.deliveryStatusOf(p) : (p.deliveryStatus || p.status);
          if (!['Closure','Project Closure'].includes(dS)) return false;
        } else if (currentStatusFilter !== s && p.status !== currentStatusFilter) {
          return false;
        }
      }
      if (viewParam === 'sales') {
        if (s === 'Award/SLA') return (p.status === 'Award/SLA' || p.status === 'Awaiting Account Approval');
        const isAccountsRejected = p.status === 'Award/SLA' && (p.accountsRejectionNote || p.rejectionNote);
        const isDelivery = !isAccountsRejected && (p.status === 'Closed' || ((p.stage === 'Delivery' || (PDMS.stageOf && PDMS.stageOf(p) === 'Delivery')) && p.status !== 'Cancelled' && p.status !== 'On Hold' && p.status !== 'Awaiting Account Approval'));
        if (s === 'Closed') return isDelivery;
        return p.status === s && !isDelivery;
      }
      if (viewParam === 'delivery') {
        return PDMS.deliveryStatusOf(p) === s;
      }
      return p.status === s;
    };
    const colRows = rows.filter(matchCol);
    return `
    <div class="kb-col" data-status="${PDMS.esc(s)}" ondragover="handleKbDragOver(event)" ondragleave="handleKbDragLeave(event)" ondrop="handleKbDrop(event, '${PDMS.esc(s)}')">
      <div class="kb-head"><span class="kb-title">${PDMS.esc(s)}</span><span class="badge badge-muted">${colRows.length}</span></div>
      ${colRows.length === 0 ? `
        <div style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-soft);font-size:12px;padding:24px 8px;opacity:0.65;border:1px dashed var(--border);border-radius:8px;text-align:center">No projects in this stage</div>
      ` : colRows.map(p=>{
        let badgeHtml = '';
        if (viewParam === 'delivery') {
          const dStatus = PDMS.deliveryStatusOf(p) || s;
          badgeHtml = `<span class="badge badge-${D.statusColors[dStatus]||'muted'}">${PDMS.esc(dStatus)}</span>`;
        } else if (viewParam === 'sales') {
          if (p.status === 'Awaiting Sales Head Approval') {
            const stageName = p.requestedStatus || p.targetStatus || 'Lead';
            badgeHtml = `<span class="badge" style="background:rgba(245,158,11,.12);color:#d97706;border:1px solid rgba(245,158,11,.25);font-size:10px;font-weight:600">${PDMS.esc(stageName)} (Pending)</span>`;
          } else if (p.status === 'Cancelled' && p.salesHeadRejectionNote) {
            const stageName = p.requestedStatus || p.targetStatus || 'Lead';
            badgeHtml = `<span class="badge badge-danger" style="background:rgba(239,68,68,.12);color:#ef4444;border:1px solid rgba(239,68,68,.25);font-size:10px;font-weight:600">${PDMS.esc(stageName)} (Rejected)</span>`;
          } else if (p.status === 'Awaiting Account Approval') {
            badgeHtml = `<span class="badge" style="background:rgba(124,58,237,.12);color:#7c3aed;border:1px solid rgba(124,58,237,.25);font-size:10px;font-weight:600">Award/SLA (Pending Accounts)</span>`;
          } else if ((p.accountsRejectionNote || p.rejectionNote) && p.status !== 'Cancelled') {
            badgeHtml = `<span class="badge badge-danger" style="background:rgba(239,68,68,.12);color:#ef4444;border:1px solid rgba(239,68,68,.25);font-size:10px;font-weight:600">Award/SLA (Returned)</span>`;
          } else if (p.status !== 'Cancelled' && p.status !== 'On Hold' && p.status !== 'Award/SLA' && (p.status === 'Closed' || p.stage === 'Delivery' || (PDMS.stageOf && PDMS.stageOf(p) === 'Delivery'))) {
            badgeHtml = `<span class="badge badge-success">Closed</span>`;
          } else {
            badgeHtml = `<span class="badge badge-${D.statusColors[p.status]||'muted'}">${PDMS.esc(p.status)}</span>`;
          }
        } else {
          badgeHtml = `<span class="badge badge-${D.statusColors[p.status]||'muted'}">${PDMS.esc(p.status)}</span>`;
        }
        return `<div class="kb-card" draggable="true" data-id="${p.id}" ondragstart="handleKbDragStart(event, '${p.id}')" ondragend="handleKbDragEnd(event)" onclick="handleKbCardClick(event, '${p.id}')" title="Drag to change status, or click to view details">
        <div class="t">${PDMS.esc(p.client||p.name||'—')}</div>
        <div class="m"><span class="text-muted" style="font-size:11px">${PDMS.esc(p.type||'—')}</span><span>${p.due||'—'}</span></div>
        <div class="mt-2">${badgeHtml}</div>
      </div>`;
      }).join('')}
    </div>`;
  }).join('')}</div>`;
}

let isKbDragging = false;
let draggedKbProjectId = null;

function handleKbDragStart(e, id) {
  isKbDragging = true;
  draggedKbProjectId = id;
  e.dataTransfer.setData('text/plain', id);
  e.dataTransfer.effectAllowed = 'move';
  const card = e.currentTarget;
  setTimeout(() => card.classList.add('dragging'), 0);
}

function handleKbDragEnd(e) {
  draggedKbProjectId = null;
  const card = e.currentTarget;
  card.classList.remove('dragging');
  document.querySelectorAll('.kb-col').forEach(col => col.classList.remove('drag-over'));
  setTimeout(() => { isKbDragging = false; }, 100);
}

function handleKbDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const col = e.currentTarget;
  if (!col.classList.contains('drag-over')) {
    col.classList.add('drag-over');
  }
}

function handleKbDragLeave(e) {
  const col = e.currentTarget;
  if (!col.contains(e.relatedTarget)) {
    col.classList.remove('drag-over');
  }
}

function getMilestonesMap(project) {
  if (!project) return {};
  if (project.milestones && typeof project.milestones === 'object' && !Array.isArray(project.milestones)) {
    return project.milestones;
  }
  if (Array.isArray(project.milestones)) {
    const map = {};
    project.milestones.forEach(m => {
      if (m && m.stage) map[m.stage] = m;
    });
    return map;
  }
  if (typeof project.milestones === 'string' && project.milestones.trim()) {
    try {
      const parsed = JSON.parse(project.milestones);
      if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) return parsed;
      if (Array.isArray(parsed)) {
        const map = {};
        parsed.forEach(m => { if (m && m.stage) map[m.stage] = m; });
        return map;
      }
    } catch (e) { }
  }
  return {};
}

function handleKbDrop(e, targetStatus) {
  e.preventDefault();
  const col = e.currentTarget;
  col.classList.remove('drag-over');

  const id = e.dataTransfer.getData('text/plain') || draggedKbProjectId;
  if (!id) return;

  const liveProjects = (window.PDMS_REMOTE && window.PDMS_REMOTE.projects) || D.projects;
  const p = liveProjects.find(x => x.id === id);
  if (!p) return;

  const currentStatus = viewParam === 'delivery' ? (PDMS.deliveryStatusOf(p) || p.status) : p.status;
  if (currentStatus === targetStatus) return;

  if (!PDMS.canChangeStatus(p, targetStatus)) {
    PDMS.toast('Not allowed', `You don't have permission to move to "${targetStatus}"`, 'error');
    return;
  }

  // Handle special status Award/SLA
  if (targetStatus === 'Award/SLA') {
    window.editProject(p.id);
    return;
  }

  const mDataMap = getMilestonesMap(p);
  const mInfo = mDataMap[targetStatus] || {};
  const currentDueDate = mInfo.dueDate || '';
  const currentNotes = mInfo.notes || '';

  const modal = PDMS.modal(`Update Status: ${PDMS.esc(targetStatus)}`, `
    <p style="color:var(--text-soft);margin:0 0 16px;font-size:14px">
      Move <strong>${PDMS.esc(p.name || p.client)}</strong> to <strong style="color:var(--primary);font-size:15px">${PDMS.esc(targetStatus)}</strong>.
    </p>

    <div class="form-row">
      <label>Stage Target Due Date</label>
      <input type="date" id="kbStageDueDate" value="${PDMS.esc(currentDueDate)}" style="width:100%" />
    </div>

    <div class="form-row" style="margin-top:12px">
      <label>Milestone Notes / Deliverables (Optional)</label>
      <textarea id="kbStageNotes" rows="3" placeholder="Enter deliverables or notes for this stage...">${PDMS.esc(currentNotes)}</textarea>
    </div>
  `, `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="confirmKbDropBtn">Update Status</button>`);

  modal.querySelector('#confirmKbDropBtn').onclick = function () {
    const dueDate = modal.querySelector('#kbStageDueDate').value;
    const notes = modal.querySelector('#kbStageNotes').value.trim();

    const btn = this;
    PDMS.setButtonLoading(btn, true, 'Updating...');

    const updatedMap = Object.assign({}, mDataMap);
    updatedMap[targetStatus] = {
      stage: targetStatus,
      dueDate: dueDate || '',
      notes: notes,
      updatedAt: new Date().toISOString()
    };

    const patch = {
      status: targetStatus,
      milestones: updatedMap
    };

    if (targetStatus === 'On Hold') {
      patch.previousStatus = currentStatus !== 'On Hold' ? currentStatus : (p.previousStatus || 'Lead');
      patch.heldAtStatus = patch.previousStatus;
    }

    if (viewParam === 'delivery' || (PDMS.stageOf && PDMS.stageOf(p) === 'Delivery')) {
      patch.deliveryStatus = targetStatus;
    }

    PDMS.api.update('projects', p.id, patch).then(saved => {
      Object.assign(p, saved, patch);
      modal.remove();
      PDMS.toast('Status Updated', `Moved "${p.name || p.client}" to "${targetStatus}"`, 'success');
      const u = PDMS.getUser();
      if (u) {
        PDMS.notify('Status Changed', `${u.name} (${u.role}) moved "${p.name || p.client}" to "${targetStatus}"`, 'refresh', 'project-details.html#id=' + p.id, '', '', p.id);
      }
      renderProjects();
    }).catch(err => {
      PDMS.setButtonLoading(btn, false);
      PDMS.toast('Error', err.message || 'Could not update project status', 'error');
    });
  };
}

function handleKbCardClick(e, id) {
  if (isKbDragging) return;
  location.href = `project-details.html#id=${id}${viewParam==='sales'?'&from=sales':viewParam==='delivery'?'&from=delivery':''}`;
}

// Shared typeahead helper for project form
function makeAc(inputEl, dropEl, getItems, itemClass, dropClass){
  const cls = itemClass || 'proj-ac-item';
  inputEl.addEventListener('input', ()=>{
    const q = inputEl.value.trim().toLowerCase();
    const hits = q ? getItems().filter(x=>x.toLowerCase().includes(q)).slice(0,8) : [];
    if(!hits.length){ dropEl.classList.remove('open'); return; }
    dropEl.innerHTML = hits.map(v=>`<div class="${cls}" data-val="${PDMS.esc(v)}">${PDMS.esc(v)}</div>`).join('');
    dropEl.classList.add('open');
    dropEl.querySelectorAll('.'+cls).forEach(el=>{
      el.addEventListener('mousedown', e=>{ e.preventDefault(); inputEl.value=el.dataset.val; dropEl.classList.remove('open'); });
    });
  });
  inputEl.addEventListener('blur', ()=>setTimeout(()=>dropEl.classList.remove('open'),150));
}

        if (modal.querySelector('#editProjDue')) patch.due = modal.querySelector('#editProjDue').value;
        if (modal.querySelector('#editProjActual')) patch.actualCompletion = modal.querySelector('#editProjActual').value;
        const priceField = modal.querySelector('#editProjPrice');
        if (priceField && PDMS.canEditPrice()) {
          const numPrice = priceField.value.trim() === '' ? '' : Number(priceField.value);
          if (Number.isFinite(numPrice)) {
            patch.negotiatedPrice = numPrice;
            if (project.awardValue || project.stage === 'Delivery' || project.status === 'Award/SLA' || project.status === 'Awaiting Account Approval') {
              patch.awardValue = numPrice;
            }
          }
        }
      }

      const btn = this;
      PDMS.setButtonLoading(btn, true, 'Saving...');
      PDMS.api.update('projects',project.id,patch).then(saved=>{
        Object.assign(project,patch,saved);
        modal.remove();
        if (priceChangeRequested) {
          PDMS.notify('Opportunity Value Update Request', `${currentUser ? currentUser.name : 'Sales'} requested to update Opportunity Value for "${project.name}" to ${PDMS.currency(requestedPriceVal)}`, 'clock', 'awaiting-projects.html', 'Sales Head', '', project.id);
          PDMS.toast('Request Sent', `Project updated. Opportunity value change (${PDMS.currency(requestedPriceVal)}) was sent to Sales Head for approval.`, 'success');
        } else if (resubmissionRequested) {
          PDMS.workflowNotify('lead.resubmitted', project);
          PDMS.toast('Re-submitted', `Revised lead details submitted to Sales Head for approval.`, 'success');
        } else {
          PDMS.toast('Project updated','Project details were saved','success');
        }
        renderProjects();
      }).catch(err=>{
        PDMS.setButtonLoading(btn, false);
        PDMS.toast('Error',err.message||'Could not update project','error');
      });
  };
}
window.editProject = editProject;
</script></body></html>
