<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Projects — PSE PDMS</title>


<link rel="stylesheet" href="css/style.css?v=1788351174"/>
<style>
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
.sh-pending-dot { width:8px;height:8px;border-radius:50%;background:#f59e0b;display:inline-block;animation:pulse 2s infinite }
.locked-badge { display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;background:rgba(245,158,11,.12);color:#d97706;border:1px solid rgba(245,158,11,.25); }
</style>
</head><body>
<script src="js/bundle.js?v=1788351174"></script>
<script>
// A hash (not a query string) survives any host's clean-URL rewriting untouched,
// since it's never sent to the server — unlike ?view=, which some static hosts strip.
const viewParam = new URLSearchParams(location.hash.replace(/^#/,'')).get('view');
window.addEventListener('hashchange', ()=>location.reload());

const activeNavId = viewParam==='sales' ? 'sales-pipeline' : viewParam==='delivery' ? 'delivery-projects' : 'projects';
PDMS.mountShell(activeNavId);
const D = PDMS_DATA; const I = PDMS.icon;
const currentUser = PDMS.getUser();

const pageInfo = viewParam==='sales' ? {title:'Sales Pipeline', sub:'Projects created by Sales, from first contact to client approval'}
  : viewParam==='delivery' ? {title:'Projects in Delivery', sub:'Projects created directly by the delivery team (COO/HTD/PM Head/PMO)'}
  : {title:'Projects', sub:'Manage all engagements across the organization'};

// Bucketing is by WHO created the project, not its current status — a project
// created by Sales stays in Sales Pipeline for its whole life; a project created
// by a delivery role stays in Projects in Delivery for its whole life.
function scopedProjects(){
  const liveProjects = (window.PDMS_REMOTE && window.PDMS_REMOTE.projects) || D.projects;
  const user = PDMS.getUser() || currentUser;
  if(user && (user.role === 'Consultant' || user.role === 'PMO')){
    const myName = (user.name||'').toLowerCase();
    const myId = (user.id||'').toLowerCase();
    return liveProjects.filter(p=>{
      const consultants = Array.isArray(p.consultants) ? p.consultants.map(String).map(n=>n.toLowerCase()) : [];
      return consultants.includes(myName) || consultants.includes(myId)
        || (p.pm||'').toLowerCase()===myName
        || (p.lead||'').toLowerCase()===myName;
    });
  }
  // Bucket purely by current status: sales statuses → Sales Pipeline, delivery statuses → Delivery
  if(viewParam==='sales' || (!viewParam && user && String(user.role).trim().toLowerCase() === 'sales')) {
    const isSalesOnly = user && String(user.role).trim().toLowerCase() === 'sales';
    if(isSalesOnly) {
      // Sales user sees ALL their own deals (including their own pending approval & cancelled leads)
      const mySales = liveProjects.filter(p => PDMS.isSalesStatus(p.status) || p.status==='Awaiting Account Approval' || p.status==='Awaiting Sales Head Approval' || p.status==='Cancelled' || p.stage==='Delivery' || p.status==='Closed' || (D.deliveryStatuses && D.deliveryStatuses.includes(p.status)));
      return mySales.filter(p => PDMS.projectOwnedByUser(p, user));
    }
    // For general viewers (Sales Head, Delivery team, PMO, HTD, COO, etc.):
    // Only show active, approved sales pipeline deals (exclude unapproved awaiting approval and cancelled deals)
    return liveProjects.filter(p => {
      if (p.status === 'Awaiting Sales Head Approval' || p.status === 'Cancelled') return false;
      return PDMS.isSalesStatus(p.status) || p.status==='Awaiting Account Approval' || p.stage==='Delivery' || p.status==='Closed' || (D.deliveryStatuses && D.deliveryStatuses.includes(p.status));
    });
  }
  if(viewParam==='delivery') {
    return liveProjects.filter(p => {
      if (p.status === 'Awaiting Account Approval' || p.status === 'Awaiting Sales Head Approval') return false;
      const preAward = ['Lead', 'Opportunity', 'Initial Proposal', 'Negotiation', 'Invoicing', 'Award/SLA'];
      if (preAward.includes(p.status)) return false;
      if (p.status === 'Cancelled' && p.stage === 'Sales' && !p.deliveryStatus) return false;
      return true;
    });
  }
  return liveProjects;
}
// Each bucket is filtered/kanban'd using its own status vocabulary.
const bucketStatuses = (viewParam==='sales' ? D.salesStatuses : viewParam==='delivery' ? D.deliveryStatuses : D.statuses).filter(s => s !== 'Awaiting Sales Head Approval' && s !== 'Awaiting Account Approval' && (viewParam !== 'sales' || s !== 'Cancelled'));
const kanbanStatuses = (viewParam==='sales' ? D.salesStatuses : viewParam==='delivery' ? D.deliveryStatuses : ['Incoming','In Progress','Awaiting Review','Completed']).filter(s => s !== 'Awaiting Sales Head Approval' && s !== 'Awaiting Account Approval' && (viewParam !== 'sales' || s !== 'Cancelled'));
const isSalesUserOwner = viewParam==='sales' && currentUser && currentUser.role === 'Sales';
const statTiles = viewParam==='sales'
  ? (isSalesUserOwner
      ? [
          {label:'Total Deals', match:()=>true, color:'primary', icon:'folder'},
          {label:'In Pipeline', match:p=>['Lead','Opportunity','Initial Proposal','Negotiation','Invoicing'].includes(PDMS.normalizeStatus ? PDMS.normalizeStatus(p.status) : p.status) && p.status!=='Awaiting Sales Head Approval' && p.status!=='Awaiting Account Approval' && p.status!=='Cancelled' && p.status!=='On Hold' && p.status!=='Closed' && p.stage!=='Delivery', color:'info', icon:'activity'},
          {label:'Pending Approval', match:p=>p.status==='Awaiting Sales Head Approval', color:'warn', icon:'clock'},
          {label:'Award/SLA', match:p=>p.status==='Award/SLA' || p.status==='Awaiting Account Approval', color:'purple', icon:'check'},
          {label:'Closed Deals', match:p=>(p.status==='Closed'||((p.stage==='Delivery'||(PDMS.stageOf&&PDMS.stageOf(p)==='Delivery'))&&p.status!=='Cancelled'&&p.status!=='On Hold'&&p.status!=='Awaiting Account Approval'&&p.status!=='Awaiting Sales Head Approval')), color:'success', icon:'briefcase'}
        ]
      : [
          {label:'Total Deals', match:()=>true, color:'primary', icon:'folder'},
          {label:'In Pipeline', match:p=>['Lead','Opportunity','Initial Proposal','Negotiation','Invoicing'].includes(PDMS.normalizeStatus ? PDMS.normalizeStatus(p.status) : p.status) && p.status!=='Awaiting Account Approval' && p.status!=='Cancelled' && p.status!=='On Hold' && p.status!=='Closed' && p.stage!=='Delivery', color:'info', icon:'activity'},
          {label:'Award/SLA', match:p=>p.status==='Award/SLA' || p.status==='Awaiting Account Approval', color:'warn', icon:'clock'},
          {label:'Closed Deals', match:p=>(p.status==='Closed'||((p.stage==='Delivery'||(PDMS.stageOf&&PDMS.stageOf(p)==='Delivery'))&&p.status!=='Cancelled'&&p.status!=='On Hold'&&p.status!=='Awaiting Account Approval')), color:'success', icon:'check'}
        ])
  : viewParam==='delivery'
  ? [
      {label:'Total', match:()=>true, color:'primary', icon:'folder'},
      {label:'Not Started', match:p=>PDMS.deliveryStatusOf(p)==='Not Started', color:'muted', icon:'clock'},
      // In Progress = any delivery project that has started (past "Not Started")
      // and is not yet finished (Completed / Closed / Cancelled). This rolls up
      // On Hold, Awaiting Review, Internal/External Audit, Testing/QA, etc.
      {label:'In Progress', match:p=>{
        const s = PDMS.deliveryStatusOf(p);
        return !!s && !['Not Started','Completed','Closed','Cancelled'].includes(s);
      }, color:'warn', icon:'activity'},
      {label:'Completed', match:p=>PDMS.deliveryStatusOf(p)==='Completed', color:'success', icon:'check'}
    ]
  : (currentUser && currentUser.role==='Consultant')
  ? [{label:'Total', match:()=>true, color:'primary', icon:'folder'}, {label:'With Active Tasks', match:p=>(p.privateTasks||[]).some(t=>!t.done), color:'warn', icon:'activity', sub:'projects'}, {label:'Tasks Completed', match:p=>(p.privateTasks||[]).length>0&&(p.privateTasks||[]).every(t=>t.done), color:'success', icon:'check', sub:'projects'}]
  : [{label:'Total', match:()=>true, color:'primary', icon:'folder'}, {label:'In Progress', match:p=>p.status==='In Progress', color:'warn', icon:'activity'}, {label:'Completed', match:p=>p.status==='Completed', color:'success', icon:'check'}];

// Sales can view the delivery bucket but never create there — only a delivery
// role creates projects that belong in Projects in Delivery.
const canCreateHere = viewParam==='sales' ? PDMS.isSalesRole(currentUser)
  : viewParam==='delivery' ? PDMS.isDeliveryRole(currentUser)
  : PDMS.can('Create Project');

// Sales Pipeline and Projects in Delivery default to Table view; the plain
// Projects page (used by delivery roles day-to-day) defaults to Kanban.
const defaultToTable = viewParam==='sales' || viewParam==='delivery' || (currentUser && currentUser.role==='Consultant');

const content = document.getElementById('content');
content.innerHTML = `
  <div class="page-head">
    <div><div class="breadcrumbs"><span>Home</span><span>Projects</span></div>
      <h1 class="page-title">${pageInfo.title}</h1><div class="page-sub">${pageInfo.sub}</div></div>
    <div class="flex gap-2"><button class="btn btn-secondary" id="viewToggle">${defaultToTable ? I('folder')+' Kanban View' : I('folder')+' Table View'}</button>${canCreateHere?`<button class="btn btn-primary" id="newProj">${I('plus')} ${viewParam==='sales'||(PDMS.isSalesRole&&PDMS.isSalesRole(currentUser))?'Create New Leads':'New Project'}</button>`:''}</div>
  </div>
  <div class="grid ${(viewParam==='sales' && isSalesUserOwner)?'grid-5':(viewParam==='sales'||viewParam==='delivery')?'grid-4':'grid-3'} mb-4">
    ${statTiles.map((t,i)=>`<div class="stat i-${t.color}"><div class="label">${t.label}</div><div class="value" id="stat-${i}">0</div>${t.sub?`<div style="font-size:11px;color:var(--text-muted);margin-top:2px">${t.sub}</div>`:''}<div class="icon-wrap">${I(t.icon)}</div></div>`).join('')}
  </div>
  <div id="listView" class="table-wrap ${defaultToTable ? '' : 'hidden'}"></div>
  <div id="kanbanView" class="${defaultToTable ? 'hidden' : ''}"></div>
`;

const canSee = PDMS.canSeePrice && PDMS.canSeePrice(currentUser);
const columns = viewParam === 'sales' ? [
  {key:'client',label:'Client',render:r=>`<div class="font-semi" style="color:var(--primary)">${PDMS.esc(r.client||r.name||'\u2014')}</div><div style="font-size:11px;color:var(--text-soft)">${PDMS.esc(r.id)}</div>`},
  ...(canSee ? [
    {key:'opportunityValue',label:'Opportunity Value',render:r=>`<span class="font-semi" style="color:var(--text)">${Number.isFinite(Number(r.opportunityValue || r.negotiatedPrice)) && Number(r.opportunityValue || r.negotiatedPrice) > 0 ? PDMS.currency(r.opportunityValue || r.negotiatedPrice) : '\u2014'}</span>`},
    {key:'awardValue',label:'Award Value (excl. VAT)',render:r=>`<span class="font-semi" style="color:var(--text)">${Number.isFinite(Number(r.awardValue || (r.stage === 'Delivery' ? r.negotiatedPrice : ''))) && Number(r.awardValue || (r.stage === 'Delivery' ? r.negotiatedPrice : '')) > 0 ? PDMS.currency(r.awardValue || r.negotiatedPrice) : '\u2014'}</span>`}
  ] : []),
  {key:'type',label:'Project Type',render:r=>`<span class="text-sm">${PDMS.esc(r.type||'\u2014')}</span>`},
  {key:'sales',label:'Deal Owner',render:r=>`<span class="text-sm text-muted font-semi">${PDMS.esc(r.projectOwnerName||(r.sales&&r.sales!=='Sales Team'?r.sales:'')||r.sales||'\u2014')}</span>`},
  {key:'status',label:'Status',render:r=> {
    // Pending Sales Head Approval
    if (r.status === 'Awaiting Sales Head Approval') {
      const stageName = r.requestedStatus || r.targetStatus || 'Lead';
      return `<span class="badge" style="background:rgba(245,158,11,.12);color:#d97706;border:1px solid rgba(245,158,11,.25);font-weight:600">${PDMS.esc(stageName)} (Pending Approval)</span>`;
    }
    // Rejected by Sales Head
    if (r.status === 'Cancelled' && r.salesHeadRejectionNote) {
      const stageName = r.requestedStatus || r.targetStatus || 'Lead';
      return `<span class="badge badge-danger" style="background:rgba(239,68,68,.12);color:#ef4444;border:1px solid rgba(239,68,68,.25);font-weight:600">${PDMS.esc(stageName)} (Rejected)</span>`;
    }
    // Pending Account Approval
    if (r.status === 'Awaiting Account Approval') {
      return `<span class="badge" style="background:rgba(124,58,237,.12);color:#7c3aed;border:1px solid rgba(124,58,237,.25);font-weight:600">Award/SLA (Pending Accounts)</span>`;
    }
    // Rejected / Returned by Accounts
    const isAccountsRejected = (r.accountsRejectionNote || r.rejectionNote) && r.status !== 'Cancelled' && !r.salesHeadRejectionNote;
    if (isAccountsRejected) {
      return `<span class="badge badge-danger" style="background:rgba(239,68,68,.12);color:#ef4444;border:1px solid rgba(239,68,68,.25);font-weight:600">Award/SLA (Returned)</span>`;
    }
    const isClosedWon = (r.status === 'Closed' || ((r.stage === 'Delivery' || (PDMS.stageOf && PDMS.stageOf(r) === 'Delivery')) && r.status !== 'Cancelled' && r.status !== 'On Hold' && r.status !== 'Award/SLA' && r.status !== 'Awaiting Account Approval'));
    const displayStatus = isClosedWon ? 'Closed' : r.status;
    return `<span class="badge badge-${D.statusColors[displayStatus]||D.statusColors[r.status]||'muted'}">${displayStatus}</span>`;
  }}
] : [
  {key:'client',label:'Client',render:r=>`<div class="font-semi" style="color:var(--primary)">${PDMS.esc(r.client||r.name||'\u2014')}</div>`},
  {key:'type',label:'Project Type',render:r=>`<span class="text-sm">${PDMS.esc(r.type||'\u2014')}</span>`},
  {key:'status',label:'Status',render:r=> {
    if (r.status === 'Awaiting Sales Head Approval') {
      const stageName = r.requestedStatus || r.targetStatus || 'Lead';
      return `<span class="badge" style="background:rgba(245,158,11,.12);color:#d97706;border:1px solid rgba(245,158,11,.25);font-weight:600">${PDMS.esc(stageName)} (Pending Approval)</span>`;
    }
    if (r.status === 'Cancelled' && r.salesHeadRejectionNote) {
      const stageName = r.requestedStatus || r.targetStatus || 'Lead';
      return `<span class="badge badge-danger" style="background:rgba(239,68,68,.12);color:#ef4444;border:1px solid rgba(239,68,68,.25);font-weight:600">${PDMS.esc(stageName)} (Rejected)</span>`;
    }
    if (r.status === 'Awaiting Account Approval') {
      return `<span class="badge" style="background:rgba(124,58,237,.12);color:#7c3aed;border:1px solid rgba(124,58,237,.25);font-weight:600">Award/SLA (Pending Accounts)</span>`;
    }
    const isAccountsRejected = (r.accountsRejectionNote || r.rejectionNote) && r.status !== 'Cancelled' && !r.salesHeadRejectionNote;
    if (isAccountsRejected) {
      return `<span class="badge badge-danger" style="background:rgba(239,68,68,.12);color:#ef4444;border:1px solid rgba(239,68,68,.25);font-weight:600">Award/SLA (Returned)</span>`;
    }
    const dStatus = viewParam === 'delivery' ? PDMS.deliveryStatusOf(r) : r.status;
    return `<span class="badge badge-${D.statusColors[dStatus]||'muted'}">${dStatus}</span>`;
  }},
  {key:'due',label:'Due'}
];
function renderStats(rows){
  statTiles.forEach((t,i)=>{ document.getElementById('stat-'+i).textContent = rows.filter(t.match).length; });
}
function renderProjects(){
  const liveAll = (window.PDMS_REMOTE && window.PDMS_REMOTE.projects) || D.projects;
  const rows = scopedProjects();
  renderStats(rows);
  PDMS.renderTable(document.getElementById('listView'),{
    columns, rows, pageSize:12,
    searchKeys:['id','client','pm','status','type'],
    rowHref:r=>'project-details.html#id='+r.id+(viewParam==='sales'?'&from=sales':viewParam==='delivery'?'&from=delivery':''),
    filterOptions:[
      {key:'status',label:'Status',options:bucketStatuses},
      {key:'type',label:'Project Type',options:D.types||[]}
    ],
    dateFilter: (viewParam==='sales' || viewParam==='delivery') ? { key:'start', label:'Start date' } : null
  });
  document.getElementById('kanbanView').innerHTML = `<div class="kanban">${kanbanStatuses.map(s=>{
    const matchCol = p => {
      if (viewParam === 'sales') {
        if (s === 'Award/SLA') return (p.status === 'Award/SLA' || p.status === 'Awaiting Account Approval');
        const isAccountsRejected = p.status === 'Award/SLA' && (p.accountsRejectionNote || p.rejectionNote);
        const isDelivery = !isAccountsRejected && (p.status === 'Closed' || ((p.stage === 'Delivery' || (PDMS.stageOf && PDMS.stageOf(p) === 'Delivery')) && p.status !== 'Cancelled' && p.status !== 'On Hold' && p.status !== 'Awaiting Account Approval'));
        if (s === 'Closed') return isDelivery;
        return p.status === s && !isDelivery;
      }
      if (viewParam === 'delivery') {
        return PDMS.deliveryStatusOf(p) === s;
      }
      return p.status === s;
    };
    const colRows = rows.filter(matchCol);
    return `
    <div class="kb-col"><div class="kb-head"><span class="kb-title">${s}</span><span class="badge badge-muted">${colRows.length}</span></div>
      ${colRows.slice(0,8).map(p=>{
        let badgeHtml = '';
        if (viewParam === 'delivery') {
          const dStatus = PDMS.deliveryStatusOf(p) || 'Not Started';
          badgeHtml = `<span class="badge badge-${D.statusColors[dStatus]||'muted'}">${PDMS.esc(dStatus)}</span>`;
        } else if (viewParam === 'sales') {
          if (p.status === 'Awaiting Sales Head Approval') {
            const stageName = p.requestedStatus || p.targetStatus || 'Lead';
            badgeHtml = `<span class="badge" style="background:rgba(245,158,11,.12);color:#d97706;border:1px solid rgba(245,158,11,.25);font-size:10px;font-weight:600">${PDMS.esc(stageName)} (Pending)</span>`;
          } else if (p.status === 'Cancelled' && p.salesHeadRejectionNote) {
            const stageName = p.requestedStatus || p.targetStatus || 'Lead';
            badgeHtml = `<span class="badge badge-danger" style="background:rgba(239,68,68,.12);color:#ef4444;border:1px solid rgba(239,68,68,.25);font-size:10px;font-weight:600">${PDMS.esc(stageName)} (Rejected)</span>`;
          } else if (p.status === 'Awaiting Account Approval') {
            badgeHtml = `<span class="badge" style="background:rgba(124,58,237,.12);color:#7c3aed;border:1px solid rgba(124,58,237,.25);font-size:10px;font-weight:600">Award/SLA (Pending Accounts)</span>`;
          } else if ((p.accountsRejectionNote || p.rejectionNote) && p.status !== 'Cancelled') {
            badgeHtml = `<span class="badge badge-danger" style="background:rgba(239,68,68,.12);color:#ef4444;border:1px solid rgba(239,68,68,.25);font-size:10px;font-weight:600">Award/SLA (Returned)</span>`;
          } else if (p.status !== 'Cancelled' && p.status !== 'On Hold' && p.status !== 'Award/SLA' && (p.status === 'Closed' || p.stage === 'Delivery' || (PDMS.stageOf && PDMS.stageOf(p) === 'Delivery'))) {
            badgeHtml = `<span class="badge badge-success">Closed</span>`;
          } else {
            badgeHtml = `<span class="badge badge-${D.statusColors[p.status]||'muted'}">${PDMS.esc(p.status)}</span>`;
          }
        } else {
          badgeHtml = `<span class="badge badge-${D.statusColors[p.status]||'muted'}">${PDMS.esc(p.status)}</span>`;
        }
        return `<div class="kb-card" onclick="location.href='project-details.html#id=${p.id}${viewParam==='sales'?'&from=sales':viewParam==='delivery'?'&from=delivery':''}'">
        <div class="t">${PDMS.esc(p.client||p.name||'—')}</div>
        <div class="m"><span class="text-muted" style="font-size:11px">${PDMS.esc(p.type||'—')}</span><span>${p.due||'—'}</span></div>
        <div class="mt-2">${badgeHtml}</div>
      </div>`;
      }).join('')}
    </div>`;
  }).join('')}</div>`;
}
PDMS.onRefresh(renderProjects);
document.getElementById('viewToggle').onclick = ()=>{
  const lv=document.getElementById('listView'),kv=document.getElementById('kanbanView');
  lv.classList.toggle('hidden');kv.classList.toggle('hidden');
  document.getElementById('viewToggle').innerHTML = (lv.classList.contains('hidden')?I('folder')+' Table View':I('folder')+' Kanban View');
};

// Shared typeahead helper for project form
function makeAc(inputEl, dropEl, getItems, itemClass, dropClass){
  const cls = itemClass || 'proj-ac-item';
  inputEl.addEventListener('input', ()=>{
    const q = inputEl.value.trim().toLowerCase();
    const hits = q ? getItems().filter(x=>x.toLowerCase().includes(q)).slice(0,8) : [];
    if(!hits.length){ dropEl.classList.remove('open'); return; }
    dropEl.innerHTML = hits.map(v=>`<div class="${cls}" data-val="${PDMS.esc(v)}">${PDMS.esc(v)}</div>`).join('');
    dropEl.classList.add('open');
    dropEl.querySelectorAll('.'+cls).forEach(el=>{
      el.addEventListener('mousedown', e=>{ e.preventDefault(); inputEl.value=el.dataset.val; dropEl.classList.remove('open'); });
    });
  });
  inputEl.addEventListener('blur', ()=>setTimeout(()=>dropEl.classList.remove('open'),150));
}

if(document.getElementById('newProj')) document.getElementById('newProj').onclick = ()=>{
  const isSales = viewParam==='sales' || (PDMS.isSalesRole && PDMS.isSalesRole(currentUser));
  if (isSales) {
    PDMS.openSalesProjectWizard({
      onSuccess: () => renderProjects(),
      redirectUrl: false
    });
    return;
  }
  const createdByRole = viewParam==='sales' ? 'Sales' : currentUser.role;
  const stage = viewParam==='sales' ? 'Sales' : viewParam==='delivery' ? 'Delivery' : (PDMS.isSalesRole(currentUser) ? 'Sales' : 'Delivery');
  const statusOptions = viewParam==='sales' ? D.salesStatuses : viewParam==='delivery' ? D.deliveryStatuses : PDMS.statusOptionsFor(currentUser);
  const defaultStatus = statusOptions[0];
  const modal = PDMS.modal('',`
    <style>
      .np-modal{font-family:Inter,sans-serif}
      .np-hero{background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 60%,#a855f7 100%);border-radius:16px;padding:20px 22px;margin-bottom:20px;display:flex;align-items:center;gap:14px}
      .np-hero-icon{width:44px;height:44px;background:rgba(255,255,255,.18);border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
      .np-hero-icon svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2}
      .np-hero-copy .np-title{font-size:17px;font-weight:800;color:#fff;line-height:1.2}
      .np-hero-copy .np-sub{font-size:12px;color:rgba(255,255,255,.65);margin-top:3px}
      .np-section{margin-bottom:18px}
      .np-section-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
      .np-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
      .np-field{display:flex;flex-direction:column;gap:5px}
      .np-field.full{grid-column:1/-1}
      .np-field label{font-size:11px;font-weight:600;color:var(--text-soft);letter-spacing:.03em}
      .np-field input,.np-field select,.np-field textarea{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-size:13px;color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s;font-family:Inter,sans-serif;width:100%;box-sizing:border-box}
      .np-field input:focus,.np-field select:focus,.np-field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.12)}
      .np-field textarea{resize:vertical;min-height:72px}
      .np-ac-wrap{position:relative}
      .np-ac-wrap input{width:100%;box-sizing:border-box}
      .np-ac-drop{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:9999;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.13);max-height:180px;overflow-y:auto;display:none}
      .np-ac-drop.open{display:block}
      .np-ac-item{padding:9px 13px;cursor:pointer;font-size:13px;color:var(--text)}
      .np-ac-item:hover{background:var(--surface-2)}
      .np-required{color:#ef4444;margin-left:2px}
    </style>
    <div class="np-modal">
      <div class="np-hero">
        <div class="np-hero-icon"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div>
        <div class="np-hero-copy">
          <div class="np-title">Create New Project</div>
          <div class="np-sub">Fill in the details below to add a project to the pipeline</div>
        </div>
      </div>

      <div class="np-section">
        <div class="np-section-label">Project Information</div>
        <div class="np-grid">
          <div class="np-field">
            <label>Client<span class="np-required">*</span></label>
            <div class="np-ac-wrap">
              <input id="newProjClient" autocomplete="off" placeholder="Search or type client name…"/>
              <div class="np-ac-drop" id="newClientDrop"></div>
            </div>
            <div id="newProjClientNotice" style="margin-top:6px;font-size:12px;color:#b91c1c;min-height:16px"></div>
          </div>
          <div class="np-field">
            <label>Project Type</label>
            <select id="newProjType">${(D.types||[]).map(t=>`<option>${t}</option>`).join('')}</select>
          </div>
          <div class="np-field">
            <label>Workstream</label>
            <input id="newProjWorkstream" type="text" placeholder="e.g. QMS, FSMS…"/>
          </div>
          <div class="np-field">
            <label>Status</label>
            <select id="newProjStatus">${statusOptions.map(s=>`<option${s===defaultStatus?' selected':''}>${s}</option>`).join('')}</select>
          </div>
        </div>
      </div>

      <div class="np-section" style="margin-bottom:0">
        <div class="np-section-label">Description</div>
        <div class="np-field">
          <textarea id="newProjDesc" placeholder="Scope, goals, deliverables…"></textarea>
        </div>
      </div>
    </div>
  `,`<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="createProjectBtn">${I('plus')} Create Project</button>`, { hideCloseButton: true });

  // Wire typeaheads
  makeAc(modal.querySelector('#newProjClient'), modal.querySelector('#newClientDrop'),
    ()=>D.clients.map(c=>c.name), 'np-ac-item', 'np-ac-drop');

  const clientInput = modal.querySelector('#newProjClient');
  const clientNotice = modal.querySelector('#newProjClientNotice');
  const updateClientNotice = () => {
    const typed = clientInput.value.trim();
    if (!typed) {
      clientNotice.textContent = '';
      return;
    }
    const matches = (D.clients || []).some(c => (c.name || '').toLowerCase() === typed.toLowerCase());
    clientNotice.textContent = matches ? '' : 'That is not an existing client name.';
  };
  clientInput.addEventListener('input', updateClientNotice);
  updateClientNotice();

  modal.querySelector('#createProjectBtn').onclick = function(){
    const norm = s => (s||'').toString().trim().replace(/\s+/g,' ').toLowerCase();
    const clientTyped = modal.querySelector('#newProjClient').value.trim();
    const type = modal.querySelector('#newProjType').value.trim();
    const workstream = modal.querySelector('#newProjWorkstream').value;
    const status = modal.querySelector('#newProjStatus').value;
    const desc = modal.querySelector('#newProjDesc').value.trim();
    if(!clientTyped){
      PDMS.toast('Missing project info','Client is required','error');
      return;
    }
    const btn = this;
    PDMS.setButtonLoading(btn, true, 'Creating...');
    setTimeout(()=>PDMS.setButtonLoading(btn, false), 10000);
    const existingClient = D.clients.find(cl=>norm(cl.name)===norm(clientTyped));
    const ensureClient = existingClient ? Promise.resolve(existingClient) : PDMS.api.create('clients',{name:clientTyped, industry:'', email:'', phone:'', address:'', projects:0, createdById:String(currentUser&&currentUser.id||''), createdByName:String(currentUser&&currentUser.name||''), createdAt:new Date().toISOString().slice(0,10)});
    ensureClient.then(client=>{
      if(!existingClient) D.clients.unshift(client);
      let finalStatus = status;
      let finalStage = stage;
      if (currentUser.role === 'Sales') {
        // Every lead a Sales user creates goes to the Sales Head first, whatever
        // stage it was entered at (Award/SLA included).
        finalStatus = 'Awaiting Sales Head Approval';
        finalStage = 'Sales';
      } else if (finalStatus === 'SLA Signed' || finalStatus === 'Award/SLA') {
        finalStatus = 'Awaiting Account Approval';
        finalStage = 'Delivery';
      }
      
      const record = {
        name: client.name, client:client.name, type, workstream, dept:workstream,
        sales: currentUser.name || 'Sales Team', pm:'', lead:'', consultants:[],
        status: finalStatus, stage: finalStage, requestedStatus: status, createdByRole: currentUser.role, progress:0,
        projectOwnerId: String(currentUser.id || ''), projectOwnerName: String(currentUser.name || ''),
        start:'', due:'', actualCompletion:'', completion:null,
        description:desc, files:0, remarks:0,
        submissionCount: 1
      };
      // Optimistic UI: insert temp project immediately
      const tmpId = 'TMP-' + Date.now();
      const tmp = Object.assign({id: tmpId, _optimistic: true}, record);
      if (window.PDMS_REMOTE && Array.isArray(window.PDMS_REMOTE.projects)) {
        window.PDMS_REMOTE.projects.unshift(tmp);
      }
      D.projects.unshift(tmp);
      renderProjects();
      return PDMS.api.create('projects', record).then(saved => {
        // Drop the optimistic TMP placeholder + any duplicate, leaving one real record
        const reconcile = (arr) => {
          if (!Array.isArray(arr)) return;
          for (let i = arr.length - 1; i >= 0; i--) {
            if (arr[i] && (arr[i].id === tmpId || String(arr[i].id) === String(saved.id))) arr.splice(i, 1);
          }
          arr.unshift(saved);
        };
        reconcile(window.PDMS_REMOTE && window.PDMS_REMOTE.projects);
        if (D.projects && D.projects !== (window.PDMS_REMOTE && window.PDMS_REMOTE.projects)) reconcile(D.projects);
        modal.remove();
        PDMS.toast('Project created','New project added to pipeline','success');
        if (saved.status === 'Awaiting Sales Head Approval') {
          PDMS.workflowNotify('lead.created', saved);
        } else if (saved.status === 'Awaiting Account Approval') {
          PDMS.workflowNotify('award.submitted', saved);
        }
        renderProjects();
        PDMS.awaitFreshData('Saving...', 'Updating projects');
      }).catch(err => {
        // Rollback optimistic insert
        if (window.PDMS_REMOTE && Array.isArray(window.PDMS_REMOTE.projects)) {
          const rIdx = window.PDMS_REMOTE.projects.findIndex(p => p.id === tmpId);
          if (rIdx > -1) window.PDMS_REMOTE.projects.splice(rIdx, 1);
        }
        const idx = D.projects.findIndex(p => p.id === tmpId);
        if (idx > -1) D.projects.splice(idx,1);
        renderProjects();
        PDMS.toast('Error', err.message || 'Could not create project','error');
      });
    }).catch(err=>PDMS.toast('Error',err.message||'Could not create project','error'));
  };
};

function editProject(id){
  const project = D.projects.find(p=>p.id===id);
  if(!project){ return; }
  const isSalesEdit = (currentUser && currentUser.role === 'Sales') || project.stage === 'Sales' || PDMS.isSalesRole(currentUser);
  const liveClients = (window.PDMS_REMOTE && window.PDMS_REMOTE.clients) || D.clients || [];
  const currentClient = project.client || project.name || '';
  const clientExists = liveClients.some(c => (c.name || c) === currentClient);
  const clientOpts = `
    ${!clientExists && currentClient ? `<option value="${PDMS.esc(currentClient)}" selected>${PDMS.esc(currentClient)}</option>` : ''}
    ${liveClients.map(c => {
      const cName = c.name || c;
      return `<option value="${PDMS.esc(cName)}" ${cName === currentClient ? 'selected' : ''}>${PDMS.esc(cName)}</option>`;
    }).join('')}
  `;
  const clientDisplayName = project.client || project.name || 'Project';
  const modal = PDMS.modal('',`
    <style>
      .np-modal{font-family:Inter,sans-serif}
      .np-hero{background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 60%,#a855f7 100%);border-radius:16px;padding:20px 22px;margin-bottom:20px;display:flex;align-items:center;gap:14px}
      .np-hero-icon{width:44px;height:44px;background:rgba(255,255,255,.18);border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
      .np-hero-icon svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2}
      .np-hero-copy .np-title{font-size:17px;font-weight:800;color:#fff;line-height:1.2}
      .np-hero-copy .np-sub{font-size:12px;color:rgba(255,255,255,.65);margin-top:3px}
      .np-section{margin-bottom:18px}
      .np-section-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
      .np-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
      .np-field{display:flex;flex-direction:column;gap:5px}
      .np-field.full{grid-column:1/-1}
      .np-field label{font-size:11px;font-weight:600;color:var(--text-soft);letter-spacing:.03em}
      .np-field input,.np-field select,.np-field textarea{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-size:13px;color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s;font-family:Inter,sans-serif;width:100%;box-sizing:border-box}
      .np-field input:focus,.np-field select:focus,.np-field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.12)}
      .np-field textarea{resize:vertical;min-height:72px}
      .np-ac-wrap{position:relative}
      .np-ac-wrap input{width:100%;box-sizing:border-box}
      .np-ac-drop{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:9999;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.13);max-height:180px;overflow-y:auto;display:none}
      .np-ac-drop.open{display:block}
      .np-ac-item{padding:9px 13px;cursor:pointer;font-size:13px;color:var(--text)}
      .np-ac-item:hover{background:var(--surface-2)}
      .np-required{color:#ef4444;margin-left:2px}
    </style>
    <div class="np-modal">
      <div class="np-hero">
        <div class="np-hero-icon"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg></div>
        <div class="np-hero-copy">
          <div class="np-title">Edit ${PDMS.esc(clientDisplayName)}</div>
          <div class="np-sub">Update project information, timeline, and deliverables</div>
        </div>
      </div>

      <div class="np-section">
        <div class="np-section-label">Project Information</div>
        <div class="np-grid">
          <div class="np-field full">
            <label>Client</label>
            <select id="editProjClient">
              ${clientOpts}
            </select>
          </div>
          <div class="np-field">
            <label>Project Type</label>
            <select id="editProjType">${(D.types||[]).map(t=>`<option${project.type===t?' selected':''}>${t}</option>`).join('')}</select>
          </div>
          <div class="np-field">
            <label>Workstream</label>
            <input id="editProjWorkstream" type="text" value="${PDMS.esc(project.workstream||project.dept||'')}" placeholder="e.g. QMS, FSMS…"/>
          </div>
          <div class="np-field full">
            <label>${(project.awardValue || project.stage === 'Delivery' || project.status === 'Award/SLA' || project.status === 'Awaiting Account Approval') ? 'Award Value (Exclusive of VAT)' : 'Opportunity Value (₦)'}</label>
            <input id="editProjPrice" type="number" min="0" step="0.01" value="${PDMS.esc((project.requestedNegotiatedPrice !== undefined && project.requestedNegotiatedPrice !== null && project.requestedNegotiatedPrice !== '') ? String(project.requestedNegotiatedPrice) : ((project.awardValue !== undefined && project.awardValue !== null && project.awardValue !== '') ? String(project.awardValue) : ((project.negotiatedPrice === '' || project.negotiatedPrice === null || project.negotiatedPrice === undefined) ? '' : String(project.negotiatedPrice))))}" placeholder="0.00" ${isSalesEdit ? 'disabled style="background:var(--surface-2);color:var(--text-muted);cursor:not-allowed;opacity:.8"' : ''}/>
            ${isSalesEdit ? `<div style="font-size:11px;color:var(--text-muted);margin-top:2px">Current Value: ${Number.isFinite(Number(project.negotiatedPrice)) && Number(project.negotiatedPrice) > 0 ? PDMS.currency(project.negotiatedPrice) : 'Not set'}</div>` : ''}
          </div>
        </div>
      </div>

      ${!isSalesEdit ? `
      <div class="np-section">
        <div class="np-section-label">Timeline & Completion</div>
        <div class="np-grid" style="grid-template-columns:1fr 1fr 1fr">
          <div class="np-field">
            <label>Start Date</label>
            <input id="editProjStart" type="date" value="${PDMS.esc(project.start||'')}"/>
          </div>
          <div class="np-field">
            <label>Planned Completion</label>
            <input id="editProjDue" type="date" value="${PDMS.esc(project.due||'')}"/>
          </div>
          <div class="np-field">
            <label>Actual Completion</label>
            <input id="editProjActual" type="date" value="${PDMS.esc(project.actualCompletion||'')}"/>
          </div>
        </div>
      </div>` : ''}

      <div class="np-section" style="${isSalesEdit ? 'margin-bottom:14px' : 'margin-bottom:0'}">
        <div class="np-section-label">Description</div>
        <div class="np-field">
          <textarea id="editProjDesc" placeholder="Scope, goals, deliverables…">${PDMS.esc(project.description||'')}</textarea>
        </div>
      </div>

      ${isSalesEdit ? `
      <div style="background:var(--surface-2);border:1.5px solid var(--border);border-radius:12px;padding:14px 16px;margin-top:6px">
        <label for="toggleProjPriceUpdate" style="display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;user-select:none;margin:0">
          <div>
            <div style="font-weight:700;font-size:13px;color:var(--text)">Update Opportunity Value?</div>
            <div style="font-size:12px;color:var(--text-soft);margin-top:2px">Tick to unlock the Opportunity Value field above. Updating it will submit an approval request to the Sales Head before taking effect.</div>
          </div>
          <input type="checkbox" id="toggleProjPriceUpdate" style="width:20px;height:20px;cursor:pointer;flex-shrink:0;accent-color:var(--primary,#4f46e5)"/>
        </label>
      </div>` : ''}
    </div>
  `,`<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="saveProjectChangesBtn">${I('check')} Save Changes</button>`, { hideCloseButton: true });

  if (isSalesEdit) {
    const toggleBox = modal.querySelector('#toggleProjPriceUpdate');
    const priceInput = modal.querySelector('#editProjPrice');
    const originalPrice = (project.negotiatedPrice === '' || project.negotiatedPrice === null || project.negotiatedPrice === undefined) ? '' : String(project.negotiatedPrice);
    if (toggleBox && priceInput) {
      toggleBox.addEventListener('change', function() {
        if (this.checked) {
          priceInput.disabled = false;
          priceInput.style.cursor = 'text';
          priceInput.style.color = 'var(--text)';
          priceInput.style.opacity = '1';
          priceInput.style.borderColor = 'var(--primary)';
          priceInput.focus();
        } else {
          priceInput.disabled = true;
          priceInput.style.cursor = 'not-allowed';
          priceInput.style.color = 'var(--text-muted)';
          priceInput.style.opacity = '.8';
          priceInput.style.borderColor = 'var(--border)';
          priceInput.value = originalPrice;
        }
      });
    }
  }

  modal.querySelector('#saveProjectChangesBtn').onclick = function(){
    const clientVal = modal.querySelector('#editProjClient') ? modal.querySelector('#editProjClient').value.trim() : (project.client || project.name);
    const ws = modal.querySelector('#editProjWorkstream').value.trim();
    const patch = {
      name: clientVal,
      client: clientVal,
      type: modal.querySelector('#editProjType').value,
      workstream: ws, dept: ws,
      priority: project.priority || 'Medium',
      description: modal.querySelector('#editProjDesc').value.trim()
    };

      const isCancelledLead = project.status === 'Cancelled';
      let resubmissionRequested = false;
      let priceChangeRequested = false;
      let requestedPriceVal = null;

      if (isSalesEdit) {
        const toggleBox = modal.querySelector('#toggleProjPriceUpdate');
        const priceField = modal.querySelector('#editProjPrice');
        if (toggleBox && toggleBox.checked && priceField) {
          const rawVal = priceField.value.trim();
          if (rawVal !== '') {
            const num = Number(rawVal);
            const currentVal = Number(project.negotiatedPrice || 0);
            if (Number.isFinite(num) && num >= 0 && (num !== currentVal || isCancelledLead)) {
              priceChangeRequested = true;
              requestedPriceVal = num;
              patch.negotiatedPrice = num;
              patch.opportunityValue = num;
              patch.requestedNegotiatedPrice = num;
              patch.previousStatus = project.previousStatus || 'Lead';
              patch.requestedStatus = project.previousStatus || 'Lead';
              patch.status = 'Awaiting Sales Head Approval';
              patch.priceUpdatePending = true;
              patch.salesHeadRejectionNote = '';
              patch.submissionCount = (project.submissionCount || 0) + 1;
            }
          }
        }

        // If the project was cancelled by Sales Head, ANY field update sends a re-submission request to Sales Head
        if (isCancelledLead && !priceChangeRequested) {
          resubmissionRequested = true;
          patch.status = 'Awaiting Sales Head Approval';
          patch.requestedStatus = project.previousStatus || 'Lead';
          patch.previousStatus = project.previousStatus || 'Lead';
          patch.salesHeadRejectionNote = '';
          patch.priceUpdatePending = false;
          patch.submissionCount = (project.submissionCount || 0) + 1;
        }
      } else {
        if (modal.querySelector('#editProjStart')) patch.start = modal.querySelector('#editProjStart').value;
        if (modal.querySelector('#editProjDue')) patch.due = modal.querySelector('#editProjDue').value;
        if (modal.querySelector('#editProjActual')) patch.actualCompletion = modal.querySelector('#editProjActual').value;
        const priceField = modal.querySelector('#editProjPrice');
        if (priceField && PDMS.canEditPrice()) {
          const numPrice = priceField.value.trim() === '' ? '' : Number(priceField.value);
          if (Number.isFinite(numPrice)) {
            patch.negotiatedPrice = numPrice;
            if (project.awardValue || project.stage === 'Delivery' || project.status === 'Award/SLA' || project.status === 'Awaiting Account Approval') {
              patch.awardValue = numPrice;
            }
          }
        }
      }

      const btn = this;
      PDMS.setButtonLoading(btn, true, 'Saving...');
      PDMS.api.update('projects',project.id,patch).then(saved=>{
        Object.assign(project,patch,saved);
        modal.remove();
        if (priceChangeRequested) {
          PDMS.notify('Opportunity Value Update Request', `${currentUser ? currentUser.name : 'Sales'} requested to update Opportunity Value for "${project.name}" to ${PDMS.currency(requestedPriceVal)}`, 'clock', 'awaiting-projects.html', 'Sales Head', '', project.id);
          PDMS.toast('Request Sent', `Project updated. Opportunity value change (${PDMS.currency(requestedPriceVal)}) was sent to Sales Head for approval.`, 'success');
        } else if (resubmissionRequested) {
          PDMS.workflowNotify('lead.resubmitted', project);
          PDMS.toast('Re-submitted', `Revised lead details submitted to Sales Head for approval.`, 'success');
        } else {
          PDMS.toast('Project updated','Project details were saved','success');
        }
        renderProjects();
      }).catch(err=>{
        PDMS.setButtonLoading(btn, false);
        PDMS.toast('Error',err.message||'Could not update project','error');
      });
  };
}
window.editProject = editProject;
</script></body></html>
