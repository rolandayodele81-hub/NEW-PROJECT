<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PSE PDMS — Sign in</title>
  <meta name="description" content="PSE PDMS — Project Delivery Management System for enterprise teams." />
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  
<link rel="stylesheet" href="css/style.css?v=1788961869"/>
</head>

<body class="login-page">
  <div class="auth-wrap">
    <div class="auth-brand">
      <div class="brand">
        <div class="brand-logo" style="height:64px"><img src="images/pse-logo.png" alt="PSE PDMS Logo" /></div>
      </div>
      <div>
        <h1>Deliver every project with clarity, speed, and control.</h1>
        <p>The complete project delivery platform for your organization.</p>
        <div class="auth-features">
          <div class="f">
            <div class="fi">✓</div>
            <div>Real-time visibility across 100+ live engagements</div>
          </div>
          <div class="f">
            <div class="fi">✓</div>
            <div>Role-based access for eight enterprise personas</div>
          </div>
          <div class="f">
            <div class="fi">✓</div>
            <div>Beautiful reporting, messaging, and audit logs</div>
          </div>
        </div>
      </div>
      <footer>© 2026 PSE PDMS</footer>
    </div>
    <div class="auth-form-wrap">
      <div class="auth-form">
        <div id="authBox"></div>
      </div>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/permissions.js"></script>
  <script src="js/api.js"></script>
  <script>
    const authBox = document.getElementById('authBox');

    function renderLoginForm() {
      authBox.innerHTML = `
    <h2>Welcome back</h2>
    <p class="sub">Sign in with your corporate credentials.</p>
    <form id="loginForm">
      <div class="form-row"><label>Work email</label><input type="email" id="email" placeholder="name@company.com" required/></div>
      <div class="form-row">
        <label>Password</label>
        <div class="password-input-wrap">
          <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password"/>
          <button type="button" id="togglePasswordBtn" class="password-toggle-btn" aria-label="Toggle password visibility" title="Show password">
            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg id="eyeOffIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>
      <button id="signInBtn" class="btn btn-primary w-full" type="submit">Sign in</button>
      <div class="form-actions"><a href="forgot.html">Forgot password?</a></div>
    </form>
    <div class="auth-note">Accounts are provisioned by HR and system administrators only.</div>
  `;
      const toggleBtn = document.getElementById('togglePasswordBtn');
      const pwdInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');
      const eyeOffIcon = document.getElementById('eyeOffIcon');

      if (toggleBtn && pwdInput) {
        toggleBtn.addEventListener('click', function () {
          const isPassword = pwdInput.type === 'password';
          pwdInput.type = isPassword ? 'text' : 'password';
          eyeIcon.style.display = isPassword ? 'none' : 'block';
          eyeOffIcon.style.display = isPassword ? 'block' : 'none';
          toggleBtn.setAttribute('title', isPassword ? 'Hide password' : 'Show password');
          pwdInput.focus();
        });
      }

      document.getElementById('loginForm').addEventListener('submit', handleLogin);
    }

    async function handleLogin(event) {
      event.preventDefault();
      const btn = document.getElementById('signInBtn');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      
      PDMS.setButtonLoading(btn, true, 'Signing in...');
      try {
        const user = await PDMS.authenticate(email, password);
        PDMS.setUser(user);
        PDMS.toast('Welcome', 'Logging you in...', 'success');
        setTimeout(() => location.href = PDMS.dashboardFor(user), 600);
      } catch (err) {
        PDMS.setButtonLoading(btn, false);
        PDMS.toast('Authentication failed', err.message || 'Invalid login credentials.', 'error');
      }
    }

    renderLoginForm();
  </script>
</body>

</html>
