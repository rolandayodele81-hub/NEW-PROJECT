<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sales Dashboard — PSE PDMS</title>
  
  
<link rel="stylesheet" href="css/style.css?v=1788356681"/>
  <style>
    .sales-hero {
      display: grid;
      grid-template-columns: 1.3fr 0.7fr;
      gap: 20px;
      padding: 24px 26px;
      border-radius: 28px;
      background: linear-gradient(135deg, #090d16 0%, #1d3c88 40%, #8b5cf6 75%, #ec4899 100%);
      color: #fff;
      position: relative;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(29, 60, 136, 0.25);
      margin-bottom: 24px;
    }

    .sales-hero::before {
      content: "";
      position: absolute;
      inset: -20% -10% auto auto;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0) 70%);
      filter: blur(10px);
      animation: drift 8s ease-in-out infinite alternate;
    }

    .sales-hero-copy {
      position: relative;
      z-index: 1;
    }

    .sales-hero-card {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    @keyframes drift {
      from {
        transform: translate3d(0, 0, 0)
      }

      to {
        transform: translate3d(-20px, -10px, 0)
      }
    }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    .sh-pending-dot { width:8px;height:8px;border-radius:50%;background:#f59e0b;display:inline-block;animation:pulse 2s infinite }
    .sh-approve-btn {
      padding:5px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;
      background:#10b981;color:#fff;border:none;transition:opacity .15s;
    }
    .sh-approve-btn:hover { opacity:.85 }
    .sh-reject-btn {
      padding:5px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;
      background:transparent;color:var(--danger);border:1px solid var(--danger);transition:opacity .15s;
    }
    .sh-reject-btn:hover { opacity:.7 }
    .sh-action-row { display:flex;gap:8px;align-items:center }
    .locked-badge {
      display:inline-flex;align-items:center;gap:5px;
      padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;
      background:rgba(245,158,11,.12);color:#d97706;border:1px solid rgba(245,158,11,.25);
    }

    @media(max-width:900px) {
      .sales-hero {
        grid-template-columns: 1fr;
      }

      .sales-hero-card {
        margin-top: 8px;
      }
    }
  </style>
</head>

<body>
  <script src="js/bundle.js?v=1788356681"></script>
  <script>
    PDMS.mountShell('dashboard');
    const D = PDMS_DATA; const I = PDMS.icon;

    function projectOwnedByUser(project, user){
      if(!project || !user) return false;
      const userId = String(user.id || '').trim().toLowerCase();
      const userName = String(user.name || '').trim().toLowerCase();
      const ownerValues = [
        String(project.projectOwnerId || project.onboardedById || project.salesOwnerId || project.createdByUserId || '').trim().toLowerCase(),
        String(project.projectOwnerName || project.onboardedByName || project.salesOwnerName || project.createdByUserName || '').trim().toLowerCase(),
        String(project.sales || '').trim().toLowerCase()
      ];
      return ownerValues.includes(userId) || ownerValues.includes(userName);
    }

    function isSalesProject(p) {
      if (!p) return false;
      if (p.stage === 'Sales') return true;
      const role = String(p.createdByRole || '').toLowerCase();
      if (role === 'sales' || role === 'sales head') return true;
      if (p.status === 'Awaiting Sales Head Approval' || p.status === 'Awaiting Account Approval') return true;
      if (PDMS.isSalesStatus && PDMS.isSalesStatus(p.status)) return true;
      if (p.sales && p.sales !== 'TBD' && p.sales !== 'PM Team' && p.sales !== 'None') return true;
      return false;
    }

    function render() {
      const liveProjects = (window.PDMS_REMOTE && window.PDMS_REMOTE.projects) || D.projects;
      const currentUser = PDMS.getUser();
      const isSalesHead = currentUser && currentUser.role === 'Sales Head';
      const isSalesUser = currentUser && currentUser.role === 'Sales';
      const salesProjectSet = liveProjects.filter(isSalesProject);
      // Sales Head: pending approval queue (only projects created by Sales users, not Sales Head's own)
      const pendingSalesHeadApproval = isSalesHead
        ? liveProjects.filter(p => p.status === 'Awaiting Sales Head Approval')
        : [];
      const userSalesSet = isSalesUser
        ? salesProjectSet.filter(p => projectOwnedByUser(p, currentUser))
        : salesProjectSet;
      // Sales user sees their own projects; general/Sales Head see active approved pipeline
      const salesProjects = isSalesUser
        ? userSalesSet
        : salesProjectSet.filter(p => p.status !== 'Awaiting Sales Head Approval' && p.status !== 'Cancelled');
      // Delivery table should show deals that Sales created which have moved to Delivery
      const deliveryProjects = salesProjectSet.filter(p => (p.status === 'Closed' || p.stage === 'Delivery' || (PDMS.stageOf && PDMS.stageOf(p) === 'Delivery')) && p.status !== 'Cancelled' && p.status !== 'On Hold');
      const totalInSales = salesProjects.length;
      const inPipeline = salesProjects.filter(p => ['Lead', 'Opportunity', 'Initial Proposal', 'Negotiation', 'Invoicing'].includes(PDMS.normalizeStatus ? PDMS.normalizeStatus(p.status) : p.status) && p.status !== 'Awaiting Sales Head Approval' && p.status !== 'Awaiting Account Approval' && p.status !== 'Cancelled' && p.status !== 'On Hold' && p.status !== 'Closed' && p.stage !== 'Delivery').length;
      const pendingApprovalCount = salesProjects.filter(p => p.status === 'Awaiting Sales Head Approval').length;
      const awardSla = salesProjects.filter(p => p.status === 'Award/SLA' || p.status === 'Awaiting Account Approval').length;
      const closedDeals = salesProjects.filter(p => (p.status === 'Closed' || ((p.stage === 'Delivery' || (PDMS.stageOf && PDMS.stageOf(p) === 'Delivery')) && p.status !== 'Cancelled' && p.status !== 'On Hold' && p.status !== 'Awaiting Account Approval' && p.status !== 'Awaiting Sales Head Approval'))).length;

      // Pipeline conversion funnel: how many projects are sitting at each stage right now.
      const funnelStages = ['Lead', 'Opportunity', 'Initial Proposal', 'Negotiation', 'Invoicing', 'Award/SLA', 'Closed'];
      const funnelCounts = funnelStages.map(s => {
        if (s === 'Closed') {
          return closedDeals;
        }
        if (s === 'Award/SLA') {
          return awardSla;
        }
        return salesProjects.filter(p => {
          const norm = PDMS.normalizeStatus ? PDMS.normalizeStatus(p.status) : p.status;
          return norm === s && p.stage !== 'Delivery' && p.status !== 'Closed' && p.status !== 'Cancelled' && p.status !== 'On Hold';
        }).length;
      });
      const funnelMax = Math.max(salesProjects.length, 1);
      const offRampCounts = {
        Cancelled: userSalesSet.filter(p => p.status === 'Cancelled').length,
        'On Hold': userSalesSet.filter(p => p.status === 'On Hold').length
      };

      document.getElementById('content').innerHTML = `
    <div class="sales-hero">
      <div class="sales-hero-copy">
        <h1 class="page-title" style="font-size:30px;line-height:1.1;margin-top:10px">${isSalesHead ? 'Sales Head Dashboard' : 'Business Development Dashboard'}</h1>
        <p class="page-sub" style="font-size:14px;max-width:640px; color:rgba(255,255,255,.9);margin-top:8px">${isSalesHead ? 'Review and approve new projects from the sales team, and monitor pipeline progress.' : 'A centralized view of business development activities, project opportunities, and consultant capacity.'}</p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="projects.html#view=sales">${I('plus')} Create New Leads</a>
          <a class="btn btn-secondary" href="clients.html" style="background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.18)">${I('users')} Clients</a>
          ${isSalesHead ? `<a class="btn btn-secondary" href="awaiting-projects.html" style="background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.18)">${I('clock')} Awaiting Approval</a>` : ''}
        </div>
      </div>
      <div class="sales-hero-card">
        <div style="width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,0.2);display:grid;place-items:center;font-size:28px;flex-shrink:0">${I('chart')}</div>
        <div>
          <div class="hero-card-title">Pipeline Overview</div>
          <div class="hero-card-text">${salesProjects.length} deal${salesProjects.length !== 1 ? 's' : ''} in pipeline.</div>
          <div class="hero-card-foot">Live Tracking</div>
        </div>
      </div>
    </div>

    <div class="grid ${isSalesUser ? 'grid-6' : 'grid-4'} mb-4">
      <div class="stat i-primary">
        <div class="label">Total in Sales</div>
        <div class="value">${totalInSales}</div>
        <div class="delta up">All pipeline deals</div>
        <div class="icon-wrap">${I('folder')}</div>
      </div>
      <div class="stat i-info">
        <div class="label">In Pipeline</div>
        <div class="value">${inPipeline}</div>
        <div class="delta up">Active prospecting</div>
        <div class="icon-wrap">${I('activity')}</div>
      </div>
      ${isSalesUser ? `
      <div class="stat i-warn">
        <div class="label">Pending Approval</div>
        <div class="value">${pendingApprovalCount}</div>
        <div class="delta up">Sales Head review</div>
        <div class="icon-wrap">${I('clock')}</div>
      </div>` : ''}
      <div class="stat i-${isSalesUser ? 'purple' : 'warn'}">
        <div class="label">Award/SLA</div>
        <div class="value">${awardSla}</div>
        <div class="delta up">Awards &amp; SLA handoffs</div>
        <div class="icon-wrap">${I('check')}</div>
      </div>
      <div class="stat i-success">
        <div class="label">Closed / Won</div>
        <div class="value">${closedDeals}</div>
        <div class="delta up">Handed to delivery</div>
        <div class="icon-wrap">${I('briefcase')}</div>
      </div>
      ${isSalesUser ? `
      <div class="stat i-danger">
        <div class="label">Cancelled</div>
        <div class="value">${offRampCounts.Cancelled}</div>
        <div class="delta down">Rejected / dropped</div>
        <div class="icon-wrap">${I('close')}</div>
      </div>` : ''}
    </div>

    <div class="grid grid-2 mb-4">
      <div class="card">
        <div class="card-head">
          <div>
            <div class="card-title">Pipeline Conversion Funnel</div>
            <div class="card-sub">Where deals are sitting right now, and where they stall</div>
          </div>
          <span class="badge badge-primary">${salesProjects.length} total</span>
        </div>
        <div class="card-body">
          ${funnelStages.map((s, i) => `
            <div class="mb-3">
              <div class="flex justify-between mb-1">
                <span class="font-semi text-sm">${PDMS.esc(s)}</span>
                <span class="font-bold text-sm">${funnelCounts[i]}</span>
              </div>
              <div class="progress"><div class="bar" style="width:${Math.max((funnelCounts[i] / funnelMax) * 100, funnelCounts[i] ? 4 : 0)}%; background:${D.statusColors[s] === 'primary' ? 'var(--gradient)' : D.statusColors[s] === 'success' ? 'var(--gradient-3)' : 'var(--gradient-2)'}"></div></div>
            </div>`).join('')}
          <div class="flex gap-4 mt-3 pt-3" style="border-top:1px solid var(--border)">
            <div class="text-sm text-muted">Cancelled: <span class="font-semi" style="color:var(--danger)">${offRampCounts.Cancelled}</span></div>
            <div class="text-sm text-muted">On Hold: <span class="font-semi">${offRampCounts['On Hold']}</span></div>
            
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <div>
            <div class="card-title">Client Accounts</div>
            <div class="card-sub">Top enterprise accounts by active projects</div>
          </div>
          <a class="btn btn-secondary btn-sm" href="clients.html">View Accounts</a>
        </div>
        <div class="card-body" style="padding:8px 20px">
          ${D.clients.slice(0, 5).map(c => `
            <div class="flex items-center gap-3" style="padding:12px 0;border-bottom:1px solid var(--border)">
              <div style="width:36px;height:36px;border-radius:10px;background:var(--gradient-2);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px">
                ${c.name.split(' ').map(w => w[0]).slice(0, 2).join('')}
              </div>
              <div style="flex:1">
                <div class="font-semi text-sm">${PDMS.esc(c.name)}</div>
                <div class="text-sm text-muted">${c.projects} active projects</div>
              </div>
              <span class="badge badge-primary">${c.industry}</span>
            </div>`).join('')}
        </div>
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-head">
        <div>
          <div class="card-title">Sales Pipeline</div>
          <div class="card-sub">Prospects and deals currently being worked, from first contact to client approval</div>
        </div>
        <div class="flex items-center gap-2">
          <span class="badge badge-success">${salesProjects.length} in pipeline</span>
          <a class="btn btn-secondary btn-sm" href="projects.html#view=sales">View More</a>
        </div>
      </div>
      <div class="card-body" style="padding:0">
        <div style="overflow-x:auto">
          <table class="data">
            <thead>
              <tr>
                <th>Project ID</th>
                <th>Client Partner</th>
                <th>Opportunity Value</th>
                <th>Award Value (excl. VAT)</th>
                <th>Project Type</th>
                <th>Stage</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              ${salesProjects.map(p => {
                const isPendingSH = p.status === 'Awaiting Sales Head Approval';
                const isPendingAcct = p.status === 'Awaiting Account Approval';
                const isAccountsRejected = (p.accountsRejectionNote || p.rejectionNote) && p.status !== 'Cancelled' && !p.salesHeadRejectionNote;
                const isClosedWon = !isPendingAcct && !isAccountsRejected && (p.status === 'Closed' || (p.stage === 'Delivery' && p.status !== 'Cancelled' && p.status !== 'On Hold') || (D.deliveryStatuses && D.deliveryStatuses.includes(p.status)));
                const displayStatus = isClosedWon ? 'Closed' : p.status;
                let statusDisplay = '';
                if (isPendingSH) {
                  const stageName = p.requestedStatus || p.targetStatus || 'Lead';
                  statusDisplay = `<span class="badge" style="background:rgba(245,158,11,.12);color:#d97706;border:1px solid rgba(245,158,11,.25);font-weight:600">${PDMS.esc(stageName)} (Pending Approval)</span>`;
                } else if (p.status === 'Cancelled' && p.salesHeadRejectionNote) {
                  const stageName = p.requestedStatus || p.targetStatus || 'Lead';
                  statusDisplay = `<span class="badge badge-danger" style="background:rgba(239,68,68,.12);color:#ef4444;border:1px solid rgba(239,68,68,.25);font-weight:600">${PDMS.esc(stageName)} (Rejected)</span>`;
                } else if (isPendingAcct) {
                  statusDisplay = `<span class="badge" style="background:rgba(124,58,237,.12);color:#7c3aed;border:1px solid rgba(124,58,237,.25);font-weight:600">Award/SLA (Pending Accounts)</span>`;
                } else if (isAccountsRejected) {
                  statusDisplay = `<span class="badge badge-danger" style="background:rgba(239,68,68,.12);color:#ef4444;border:1px solid rgba(239,68,68,.25);font-weight:600">Award/SLA (Returned)</span>`;
                } else {
                  statusDisplay = `<span class="badge badge-${D.statusColors[displayStatus] || D.statusColors[p.status] || 'muted'}">${PDMS.esc(displayStatus)}</span>`;
                }
                const isDelivery = isClosedWon;
                const actionBtn = isPendingSH && isSalesUser
                  ? '<span class="text-muted text-sm">Awaiting Sales Head</span>'
                  : `<a href="project-details.html#id=${p.id}&from=sales" class="btn btn-secondary btn-sm">Manage</a>`;
                return `
                <tr>
                  <td><a href="project-details.html#id=${p.id}&from=sales" class="font-semi" style="color:var(--primary)">${p.id}</a></td>
                  <td class="font-bold">${PDMS.esc(p.client||p.name||'\u2014')}</td>
                  <td class="font-semi">${Number.isFinite(Number(p.opportunityValue || p.negotiatedPrice)) && Number(p.opportunityValue || p.negotiatedPrice) > 0 ? PDMS.currency(p.opportunityValue || p.negotiatedPrice) : '\u2014'}</td>
                  <td class="font-semi">${Number.isFinite(Number(p.awardValue || (isDelivery ? p.negotiatedPrice : ''))) && Number(p.awardValue || (isDelivery ? p.negotiatedPrice : '')) > 0 ? PDMS.currency(p.awardValue || p.negotiatedPrice) : '\u2014'}</td>
                  <td>${PDMS.esc(p.type||'\u2014')}</td>
                  <td>${statusDisplay}</td>
                  <td>${actionBtn}</td>
                </tr>`;
              }).join('') || `<tr><td colspan="7" class="text-muted" style="text-align:center;padding:24px">${PDMS.emptyOrLoading('No sales pipeline projects yet')}</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <div>
          <div class="card-title">Projects in Delivery</div>
          <div class="card-sub">Deals you closed that delivery has picked up — track how they're progressing</div>
        </div>
        <div class="flex items-center gap-2">
          <span class="badge badge-primary">${deliveryProjects.length} in delivery</span>
          <a class="btn btn-secondary btn-sm" href="projects.html#view=delivery">View More</a>
        </div>
      </div>
      <div class="card-body" style="padding:0">
        <div style="overflow-x:auto">
          <table class="data">
            <thead>
              <tr>
                <th>Project ID</th>
                <th>Client Partner</th>
                <th>Project Type</th>
                <th>PM</th>
                <th>Status</th>
              </tr>
            </thead>
              ${deliveryProjects.map(p => {
                const delivStatus = PDMS.deliveryStatusOf ? (PDMS.deliveryStatusOf(p) || 'Not Started') : (p.deliveryStatus || 'Not Started');
                return `
                <tr>
                  <td><a href="project-details.html#id=${p.id}" class="font-semi" style="color:var(--primary)">${p.id}</a></td>
                  <td class="font-bold">${PDMS.esc(p.client||p.name||'—')}</td>
                  <td>${PDMS.esc(p.type||'—')}</td>
                  <td>${PDMS.esc(p.pm || 'TBD')}</td>
                  <td><span class="badge badge-${D.statusColors[delivStatus] || 'muted'}">${PDMS.esc(delivStatus)}</span></td>
                </tr>`;
              }).join('') || `<tr><td colspan="5" class="text-muted" style="text-align:center;padding:24px">${PDMS.emptyOrLoading('No projects in delivery yet')}</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  `;
    }

    function newDeal() {
      PDMS.openSalesProjectWizard({
        onSuccess: () => render(),
        redirectUrl: 'projects.html#view=sales'
      });
    }

    // ---- Sales Head approve / reject actions ----
    function approveSalesProject(id, btn) {
      PDMS.setButtonLoading(btn, true, 'Approving...');
      const liveProjects = (window.PDMS_REMOTE && window.PDMS_REMOTE.projects) || D.projects;
      const p = liveProjects.find(x => x.id === id);
      if (!p) { PDMS.toast('Error', 'Project not found', 'error'); PDMS.setButtonLoading(btn, false); return; }
      const patch = PDMS.salesHeadApprovalPatch(p);
      const forwardedToAccounts = patch.status === 'Awaiting Account Approval';
      PDMS.api.update('projects', id, patch)
        .then(() => {
          Object.assign(p, patch);
          PDMS.workflowNotify('lead.accepted', p);
          if (forwardedToAccounts) PDMS.workflowNotify('award.submitted', p);
          PDMS.toast('Approved', forwardedToAccounts ? `"${p.name || p.client}" approved and forwarded to Accounts.` : `"${p.name || p.client}" approved and now active at "${patch.status}".`, 'success');
          render();
        })
        .catch(err => {
          PDMS.setButtonLoading(btn, false);
          PDMS.toast('Error', err.message || 'Could not approve project', 'error');
        });
    }

    function rejectSalesProject(id, btn) {
      const liveProjects = (window.PDMS_REMOTE && window.PDMS_REMOTE.projects) || D.projects;
      const p = liveProjects.find(x => x.id === id);
      if (!p) return;

      const modal = PDMS.modal('Reject Project', `
        <p style="color:var(--text-soft);margin:0 0 16px;font-size:14px">You are about to reject <strong>${PDMS.esc(p.name || p.client)}</strong>. The project will be marked as Cancelled and the Sales user will see your rejection note.</p>
        <div class="form-row"><label>Reason for Rejection</label><textarea id="shRejectReason" rows="3" placeholder="Explain why this project was rejected..."></textarea></div>
      `, `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="confirmSHRejectBtn" style="background:var(--danger);border-color:var(--danger)">Reject Project</button>`);

      modal.querySelector('#confirmSHRejectBtn').onclick = function() {
        const reason = modal.querySelector('#shRejectReason').value.trim();
        if (!reason) { PDMS.toast('Required', 'Please provide a rejection reason', 'error'); return; }
        const btn2 = this;
        PDMS.setButtonLoading(btn2, true, 'Rejecting...');
        PDMS.api.update('projects', id, { status: 'Cancelled', salesHeadRejectionNote: reason })
          .then(() => {
            p.status = 'Cancelled';
            p.salesHeadRejectionNote = reason;
            PDMS.workflowNotify('lead.rejected', p, { reason });
            modal.remove();
            PDMS.toast('Rejected', `"${p.name || p.client}" has been rejected.`, 'warn');
            render();
          })
          .catch(err => {
            PDMS.setButtonLoading(btn2, false);
            PDMS.toast('Error', err.message || 'Could not reject project', 'error');
          });
      };
    }

    window.newDeal = newDeal;
    window.approveSalesProject = approveSalesProject;
    window.rejectSalesProject = rejectSalesProject;

    PDMS.onRefresh(render);
  </script>
</body>

</html>
