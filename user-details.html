<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>User Details — PSE PDMS</title>


<link rel="stylesheet" href="css/style.css?v=1789132687"/></head><body>
<script src="js/bundle.js?v=1789132687"></script>
<script>
// A hash survives any host's clean-URL rewriting untouched, since it's never
// sent to the server — unlike ?id=, which some static hosts strip on redirect.
window.addEventListener('hashchange', ()=>location.reload());
PDMS.mountShell('users');
const D = PDMS_DATA; const I = PDMS.icon;
let u;

function projectOwnedByUser(project, user){
  if(!project || !user) return false;
  const userId = String(user.id || '').trim().toLowerCase();
  const userName = String(user.name || '').trim().toLowerCase();
  const ownerIds = [
    String(project.projectOwnerId || project.onboardedById || project.salesOwnerId || project.createdByUserId || '').trim().toLowerCase(),
    String(project.projectOwnerName || project.onboardedByName || project.salesOwnerName || project.createdByUserName || '').trim().toLowerCase()
  ];
  return ownerIds.includes(userId) || ownerIds.includes(userName);
}

function isSalesCurrentProject(project){
  const status = String(project && project.status || '').trim();
  return status !== 'Completed' && status !== 'Closed' && status !== 'Rejected';
}

function getRequestedUserParams() {
  const hash = (location.hash || '').replace(/^#/, '').trim();
  const hashParams = new URLSearchParams(hash);
  const searchParams = new URLSearchParams(location.search || '');
  let id = hashParams.get('id') || searchParams.get('id') || '';
  let email = hashParams.get('email') || searchParams.get('email') || '';
  if (!id && hash && !hash.includes('=')) {
    id = hash;
  }
  return {
    id: decodeURIComponent(String(id || '').trim()),
    email: decodeURIComponent(String(email || '').trim())
  };
}

function projectsFor(user){
  const liveProjects = (window.PDMS_REMOTE && window.PDMS_REMOTE.projects) || D.projects || [];
  if(!user) return [];
  if(user.role === 'Sales') {
    return liveProjects.filter(p => projectOwnedByUser(p, user));
  }
  return liveProjects.filter(p => p.pm===user.name || p.lead===user.name || (p.consultants||[]).includes(user.name) || projectOwnedByUser(p, user));
}

function render(){
  const allUsers = (window.PDMS_REMOTE && Array.isArray(window.PDMS_REMOTE.users) && window.PDMS_REMOTE.users.length)
    ? window.PDMS_REMOTE.users
    : ((window.PDMS_DATA && Array.isArray(window.PDMS_DATA.users)) ? window.PDMS_DATA.users : (PDMS.getUsers ? PDMS.getUsers() : []));

  const params = getRequestedUserParams();
  const reqId = params.id.toLowerCase();
  const reqEmail = params.email.toLowerCase();
  const currentLoggedIn = PDMS.getUser();

  if (reqEmail || reqId) {
    // 1. Match by exact email if available (guarantees unique user even if legacy IDs collided in DB)
    if (reqEmail) {
      u = allUsers.find(x => x && String(x.email || '').trim().toLowerCase() === reqEmail);
    }
    // 2. Match by exact ID if email didn't match or wasn't provided
    if (!u && reqId) {
      u = allUsers.find(x => x && String(x.id || '').trim().toLowerCase() === reqId);
    }
    // 3. Match by email/name as fallback
    if (!u && reqId) {
      u = allUsers.find(x => {
        if (!x) return false;
        const xEmail = String(x.email || '').trim().toLowerCase();
        const xName = String(x.name || '').trim().toLowerCase();
        return xEmail === reqId || xName === reqId;
      });
    }
    if (!u && typeof PDMS.getUsers === 'function') {
      const fallbackList = PDMS.getUsers() || [];
      if (reqEmail) u = fallbackList.find(x => x && String(x.email || '').trim().toLowerCase() === reqEmail);
      if (!u && reqId) u = fallbackList.find(x => x && (String(x.id || '').trim().toLowerCase() === reqId || String(x.email || '').trim().toLowerCase() === reqId));
    }
  } else {
    u = (currentLoggedIn ? allUsers.find(x => String(x.id).toLowerCase() === String(currentLoggedIn.id).toLowerCase() || (x.email && x.email.toLowerCase() === (currentLoggedIn.email || '').toLowerCase())) : null)
      || currentLoggedIn
      || allUsers[0];
  }

  if(!u){
    if (reqId) {
      document.getElementById('content').innerHTML = `
        <div class="page-head"><div><div class="breadcrumbs"><span>Home</span><span>Users</span></div>
          <h1 class="page-title">User Not Found</h1><div class="page-sub">Could not find a user profile matching &ldquo;${PDMS.esc(reqId)}&rdquo;.</div></div>
          <div class="flex gap-2"><a class="btn btn-primary" href="users.html">Back to Users Directory</a></div></div>
      `;
      return;
    }
    document.getElementById('content').innerHTML = window.PDMS_REMOTE ? `
      <div class="page-head"><div><div class="breadcrumbs"><span>Home</span><span>Users</span></div>
        <h1 class="page-title">No User Data</h1><div class="page-sub">You currently do not have any user records.</div></div>
        <div class="flex gap-2"><a class="btn btn-primary" href="users.html">Open Users</a></div></div>
    ` : `
      <div class="page-head"><div><div class="breadcrumbs"><span>Home</span><span>Users</span></div>
        <h1 class="page-title">Loading User...</h1><div class="page-sub">Fetching user data</div></div></div>
      <div class="card"><div class="card-body pdms-loading-inline"><span class="pdms-spinner"></span>Loading...</div></div>
    `;
    return;
  }

  const isHistoryProject = (p) => {
    if (!p) return false;
    const isDelivery = (PDMS.stageOf ? PDMS.stageOf(p) === 'Delivery' : p.stage === 'Delivery');
    const isSales = (PDMS.stageOf ? PDMS.stageOf(p) === 'Sales' : p.stage === 'Sales');
    const dStat = String((PDMS.deliveryStatusOf ? PDMS.deliveryStatusOf(p) : p.deliveryStatus) || '').trim();
    const s = String(p.status || '').trim();

    if (isDelivery) {
      const activeDeliveryStatuses = ['Not Started', 'Gap Assessment', 'Risk Assessment', 'Design & Documentation/Implementation', 'VAPT', 'Internal Testing', 'Penetration Testing', 'Report Submission', 'Review', 'Training & Awareness', 'Internal Audit & Management Review', 'Remediation & Certification Readiness', 'Certification Audit', 'Ongoing', 'In Progress', 'Assess', 'Target State', 'GAP', 'Roadmap', 'Tailor/Design', 'Implement', 'Capability Building', 'Post-Implementation Assess', 'Strategy', 'Governance', 'Design', 'Select/Contract', 'Transition', 'Operate', 'Monitor', 'Improve', 'Previous Findings Closure', 'Awareness', 'Management Review', 'Readiness Assessment', 'Remediation', 'Surveillance Audit', 'Requirements Gathering', 'Configuration & Design', 'Data Preparation & Migration', 'Integration', 'Testing', 'User Acceptance Testing (UAT)', 'Go-Live', 'Project Initiation & Business Case', 'Requirements & Use-Case Definition', 'Architecture & Solution Design', 'Data Readiness & Preparation', 'PoC / Prototype', 'Software Development & AI Model Build', 'System Integration', 'Testing & AI Validation', 'UAT & Business Acceptance', 'Production Deployment & Go-Live', 'Hypercare & Operational Handover', 'On Hold'];
      if (activeDeliveryStatuses.some(a => a.toLowerCase() === dStat.toLowerCase())) {
        return false;
      }
      const deliveryDoneStatuses = ['Completed', 'Closure', 'Project Closure', 'Certification & Post Engagement', 'Closed', 'Cancelled', 'Rejected'];
      if (deliveryDoneStatuses.some(h => h.toLowerCase() === dStat.toLowerCase())) {
        return true;
      }
      return false;
    }

    if (isSales) {
      const salesHistoryStatuses = ['Cancelled', 'Rejected'];
      return salesHistoryStatuses.some(h => h.toLowerCase() === s.toLowerCase());
    }

    const historyStatuses = ['Completed', 'Closure', 'Project Closure', 'Certification & Post Engagement', 'Closed', 'Rejected', 'Cancelled'];
    return historyStatuses.some(h => h.toLowerCase() === s.toLowerCase() || (dStat && h.toLowerCase() === dStat.toLowerCase()));
  };

  const userProjects = projectsFor(u);
  const sortByClient = arr => arr.slice().sort((a, b) => {
    const nameA = String(a.client || a.name || '').trim().toLowerCase();
    const nameB = String(b.client || b.name || '').trim().toLowerCase();
    return nameA.localeCompare(nameB, undefined, { sensitivity: 'base', numeric: true });
  });
  const currentProjects = sortByClient(userProjects.filter(p => !isHistoryProject(p)));
  const previousProjects = sortByClient(userProjects.filter(p => isHistoryProject(p)));

  const userLeaves = PDMS.getUserLeaveHistory ? PDMS.getUserLeaveHistory(u) : [];
  const activeLeave = PDMS.getUserActiveLeave ? PDMS.getUserActiveLeave(u) : null;
  const currentYearStr = new Date().getFullYear().toString();
  const approvedThisYear = userLeaves.filter(l => l.status === 'Approved' && (l.startDate || '').startsWith(currentYearStr)).reduce((sum, l) => sum + (parseInt(l.daysCount) || 1), 0);
  const pendingCount = userLeaves.filter(l => l.status === 'Pending' || l.status === 'Pending Approval').length;

  const isSelf = currentLoggedIn && u && (String(currentLoggedIn.id) === String(u.id) || (currentLoggedIn.email && String(currentLoggedIn.email).toLowerCase() === String(u.email || '').toLowerCase()));
  const canManageLeaves = PDMS.canManageLeaveRequests ? PDMS.canManageLeaveRequests(currentLoggedIn) : (currentLoggedIn && ['HR', 'System Administrator', 'General Admin'].includes(currentLoggedIn.role));

  const statusColor = u.status==='Active'?'#22c55e':u.status==='On Leave'?'#f59e0b':'#ef4444';

  document.getElementById('content').innerHTML = `

  <!-- ── Profile Hero ── -->
  <div style="border-radius:20px;overflow:hidden;box-shadow:0 8px 32px rgba(29,60,136,.18);margin-bottom:20px">

    <!-- Gradient hero (no separate cover — all content inside) -->
    <div style="background:linear-gradient(135deg,#090d16 0%,#1d3c88 45%,#8b5cf6 80%,#ec4899 100%);padding:22px 28px 20px">
      <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
        <!-- Avatar -->
        <div style="width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,0.15);border:2px solid rgba(255,255,255,0.35);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;flex-shrink:0">${PDMS.initials(u.name)}</div>
        <!-- Name + role + live availability -->
        <div style="flex:1;min-width:160px">
          <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:6px">
            <span style="background:rgba(255,255,255,0.15);color:#fff;border:1px solid rgba(255,255,255,0.25);border-radius:20px;padding:2px 10px;font-size:11px;font-weight:600;letter-spacing:.4px">${PDMS.esc(u.role)}</span>
            ${activeLeave 
              ? `<span style="background:rgba(245,158,11,0.3);color:#fef08a;border:1px solid rgba(245,158,11,0.5);border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700;letter-spacing:.3px">● On Leave (until ${activeLeave.endDate})</span>` 
              : `<span style="background:rgba(34,197,94,0.25);color:#bbf7d0;border:1px solid rgba(34,197,94,0.45);border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700;letter-spacing:.3px">● Available</span>`}
          </div>
          <div style="font-size:20px;font-weight:800;color:#fff;line-height:1.2">${PDMS.esc(u.name)}</div>
          <div style="font-size:12px;color:rgba(255,255,255,0.6);margin-top:2px">${PDMS.esc(u.dept||'')}${u.dept&&u.email?' · ':''}${PDMS.esc(u.email||'')}</div>
        </div>
        <!-- Stat chips -->
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <div style="background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);border-radius:12px;padding:10px 16px;text-align:center;min-width:80px">
            <div style="font-size:20px;font-weight:800;color:#fff;line-height:1">${currentProjects.length}</div>
            <div style="font-size:10px;color:rgba(255,255,255,0.6);font-weight:600;margin-top:2px;letter-spacing:.4px;text-transform:uppercase">Current</div>
          </div>
          <div style="background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);border-radius:12px;padding:10px 16px;text-align:center;min-width:80px">
            <div style="font-size:20px;font-weight:800;color:#fff;line-height:1">${userProjects.length}</div>
            <div style="font-size:10px;color:rgba(255,255,255,0.6);font-weight:600;margin-top:2px;letter-spacing:.4px;text-transform:uppercase">Total</div>
          </div>
          <div style="background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);border-radius:12px;padding:10px 16px;text-align:center;min-width:80px">
            <div style="font-size:20px;font-weight:800;color:#fff;line-height:1">${approvedThisYear}d</div>
            <div style="font-size:10px;color:rgba(255,255,255,0.6);font-weight:600;margin-top:2px;letter-spacing:.4px;text-transform:uppercase">Off-Days</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Actions -->
    ${(() => {
      const canEdit = PDMS.can('Edit User') || (isSelf && ['HR', 'PMO', 'Project Manager', 'PM Head', 'HTD', 'COO', 'System Administrator', 'General Admin'].includes(currentLoggedIn.role));
      const canDelete = PDMS.can('Delete User');
      if (!canEdit && !canDelete) return '';
      return `
      <div style="display:flex;gap:10px;padding:12px 18px;background:var(--surface);border-left:1px solid var(--border);border-right:1px solid var(--border)">
        ${canEdit ? `<button class="btn btn-secondary btn-sm" onclick="editUser()">${I('settings')} Edit User</button>` : ''}
        ${canDelete ? `<button class="btn btn-secondary btn-sm" style="color:var(--danger);border-color:var(--danger)" onclick="deleteUser()">${I('close')} Delete User</button>` : ''}
      </div>`;
    })()}

      <!-- Detail fields -->
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0;border:1px solid var(--border);border-radius:14px;overflow:hidden">
        ${[
          {label:'Email',         value: u.email||'—'},
          {label:'Phone',         value: u.phone||'—'},
          {label:'Date of Entry', value: u.dateOfEntry||u.joined||'—'},
          {label:'Date of Birth', value: u.birthday||'—'},
        ].map((f,i,arr)=>`
          <div style="padding:14px 18px;background:var(--surface-2);${i%2===0&&i<arr.length-1?'border-right:1px solid var(--border)':''};${i<2?'border-bottom:1px solid var(--border)':''}">
            <div style="font-size:10px;font-weight:700;letter-spacing:.7px;color:var(--text-soft);text-transform:uppercase;margin-bottom:4px">${f.label}</div>
            <div style="font-size:13px;font-weight:600;color:var(--text)">${PDMS.esc(f.value)}</div>
          </div>`).join('')}
      </div>
    </div>
  </div>

  <!-- ── Projects & Leave Sections ── -->
  <div style="display:flex;flex-direction:column;gap:20px">

    <!-- Current Projects -->
    <div class="card">
      <div class="card-head">
        <div><div class="card-title">Current Projects</div><div class="card-sub">Ongoing engagements</div></div>
        <span style="background:rgba(99,102,241,.1);color:var(--primary);border-radius:20px;padding:3px 12px;font-size:12px;font-weight:700">${currentProjects.length}</span>
      </div>
      <div style="overflow-x:auto;padding:0">
        <table style="width:100%;border-collapse:collapse">
          <thead>
            <tr style="background:var(--surface-2)">
              <th style="text-align:left;padding:10px 20px;font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--border)">Client</th>
              <th style="text-align:left;padding:10px 16px;font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--border)">Project Type</th>
              <th style="text-align:left;padding:10px 16px;font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--border)">Role</th>
              <th style="text-align:left;padding:10px 20px;font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--border)">Status</th>
            </tr>
          </thead>
          <tbody>
            ${currentProjects.length ? currentProjects.map((p,i)=>{
              const role = p.pm===u.name?'Project Manager':p.lead===u.name?'Project Lead':'Consultant';
              const roleColor = p.pm===u.name?'#4f46e5':p.lead===u.name?'#7c3aed':'#059669';
              const roleBg = p.pm===u.name?'rgba(79,70,229,.08)':p.lead===u.name?'rgba(124,58,237,.08)':'rgba(5,150,105,.08)';
              const dispStatus = (PDMS.deliveryStatusOf ? PDMS.deliveryStatusOf(p) : (p.deliveryStatus || p.status)) || p.status;
              const clientName = p.client || p.name || '—';
              return `<tr onclick="location.href='project-details.html#id=${p.id}'" style="cursor:pointer;border-bottom:1px solid var(--border);transition:background .15s" onmouseenter="this.style.background='var(--surface-2)'" onmouseleave="this.style.background='transparent'">
                <td style="padding:14px 20px">
                  <div style="display:flex;align-items:center;gap:10px">
                    <div style="width:32px;height:32px;border-radius:8px;background:rgba(99,102,241,.12);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--primary);flex-shrink:0">${PDMS.esc(clientName).charAt(0)}</div>
                    <div>
                      <div style="font-size:13px;font-weight:700;color:var(--text)">${PDMS.esc(clientName)}</div>
                      <div style="font-size:11px;color:var(--text-soft);margin-top:1px">${PDMS.esc(p.id)}</div>
                    </div>
                  </div>
                </td>
                <td style="padding:14px 16px;font-size:13px;color:var(--text-muted)">${PDMS.esc(PDMS.formatType ? PDMS.formatType(p.type) : (p.type||'—'))}</td>
                <td style="padding:14px 16px"><span style="font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;background:${roleBg};color:${roleColor}">${role}</span></td>
                <td style="padding:14px 20px"><span class="badge badge-${D.statusColors[dispStatus]||D.statusColors[p.status]||'muted'}">${PDMS.esc(dispStatus)}</span></td>
              </tr>`;
            }).join('') : `<tr><td colspan="4" style="text-align:center;padding:36px;color:var(--text-muted);font-size:13px">${PDMS.emptyOrLoading('No current projects')}</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>

    <!-- Project History -->
    <div class="card">
      <div class="card-head">
        <div><div class="card-title">Project History</div><div class="card-sub">Completed & closed engagements</div></div>
        <span style="background:var(--surface-2);color:var(--text-soft);border-radius:20px;padding:3px 12px;font-size:12px;font-weight:700;border:1px solid var(--border)">${previousProjects.length}</span>
      </div>
      <div style="overflow-x:auto;padding:0">
        <table style="width:100%;border-collapse:collapse">
          <thead>
            <tr style="background:var(--surface-2)">
              <th style="text-align:left;padding:10px 20px;font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--border)">Client</th>
              <th style="text-align:left;padding:10px 16px;font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--border)">Project Type</th>
              <th style="text-align:left;padding:10px 16px;font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--border)">Role</th>
              <th style="text-align:left;padding:10px 20px;font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--border)">Status</th>
            </tr>
          </thead>
          <tbody>
            ${previousProjects.length ? previousProjects.map(p=>{
              const role = p.pm===u.name?'Project Manager':p.lead===u.name?'Project Lead':'Consultant';
              const roleColor = p.pm===u.name?'#4f46e5':p.lead===u.name?'#7c3aed':'#059669';
              const roleBg = p.pm===u.name?'rgba(79,70,229,.08)':p.lead===u.name?'rgba(124,58,237,.08)':'rgba(5,150,105,.08)';
              const dispStatus = (PDMS.deliveryStatusOf ? PDMS.deliveryStatusOf(p) : (p.deliveryStatus || p.status)) || p.status;
              const clientName = p.client || p.name || '—';
              return `<tr onclick="location.href='project-details.html#id=${p.id}'" style="cursor:pointer;border-bottom:1px solid var(--border);transition:background .15s" onmouseenter="this.style.background='var(--surface-2)'" onmouseleave="this.style.background='transparent'">
                <td style="padding:14px 20px">
                  <div style="display:flex;align-items:center;gap:10px">
                    <div style="width:32px;height:32px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--text-muted);flex-shrink:0">${PDMS.esc(clientName).charAt(0)}</div>
                    <div>
                      <div style="font-size:13px;font-weight:700;color:var(--text)">${PDMS.esc(clientName)}</div>
                      <div style="font-size:11px;color:var(--text-soft);margin-top:1px">${PDMS.esc(p.id)}</div>
                    </div>
                  </div>
                </td>
                <td style="padding:14px 16px;font-size:13px;color:var(--text-muted)">${PDMS.esc(PDMS.formatType ? PDMS.formatType(p.type) : (p.type||'—'))}</td>
                <td style="padding:14px 16px"><span style="font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;background:${roleBg};color:${roleColor}">${role}</span></td>
                <td style="padding:14px 20px"><span class="badge badge-${D.statusColors[dispStatus]||D.statusColors[p.status]||'muted'}">${PDMS.esc(dispStatus)}</span></td>
              </tr>`;
            }).join('') : `<tr><td colspan="4" style="text-align:center;padding:36px;color:var(--text-muted);font-size:13px">${PDMS.emptyOrLoading('No project history')}</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>

    <!-- ── Leave History & Requests Section ── -->
    <div class="card" id="leaveHistoryCard">
      <div class="card-head" style="flex-wrap:wrap;gap:10px">
        <div>
          <div class="card-title" style="display:flex;align-items:center;gap:8px">
            Leave History & Requests
            ${activeLeave ? `<span class="badge badge-warn" style="font-size:11px">● On Leave (until ${activeLeave.endDate})</span>` : `<span class="badge badge-success" style="font-size:11px">● Available</span>`}
          </div>
          <div class="card-sub">Off-day records, time-off requests, and availability tracking</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <span style="background:var(--surface-2);color:var(--text-soft);border-radius:20px;padding:3px 12px;font-size:12px;font-weight:700;border:1px solid var(--border)">${userLeaves.length} record${userLeaves.length!==1?'s':''}</span>
          ${(isSelf || canManageLeaves) ? `
            <button class="btn btn-primary btn-sm" onclick="openRequestLeaveModal()" style="display:inline-flex;align-items:center;gap:6px">
              ${I('plus')} ${isSelf ? 'Request Off-Days' : 'Log Time Off'}
            </button>
          ` : ''}
        </div>
      </div>

      <!-- Table of Leave Requests -->
      <div style="overflow-x:auto;padding:0">
        <table style="width:100%;border-collapse:collapse">
          <thead>
            <tr style="background:var(--surface-2)">
              <th style="text-align:left;padding:10px 20px;font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--border)">Category / Type</th>
              <th style="text-align:left;padding:10px 16px;font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--border)">Dates & Duration</th>
              <th style="text-align:left;padding:10px 16px;font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--border)">Reason & Notes</th>
              <th style="text-align:left;padding:10px 16px;font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--border)">Status</th>
              <th style="text-align:right;padding:10px 20px;font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--border)">Actions</th>
            </tr>
          </thead>
          <tbody>
            ${userLeaves.length ? userLeaves.map(lv => {
              const isPending = lv.status === 'Pending' || lv.status === 'Pending Approval';
              const isApproved = lv.status === 'Approved';
              const isRejected = lv.status === 'Rejected';
              
              const statusBadge = isApproved 
                ? '<span class="badge badge-success">Approved</span>' 
                : isPending 
                  ? '<span class="badge badge-warn">Pending HR Review</span>' 
                  : isRejected 
                    ? '<span class="badge badge-danger">Rejected</span>' 
                    : '<span class="badge badge-muted">Cancelled</span>';

              const catName = lv.category || lv.type || 'Off-Days';
              const dCount = parseInt(lv.daysCount) || 1;

              return `
              <tr style="border-bottom:1px solid var(--border);transition:background .15s" onmouseenter="this.style.background='var(--surface-2)'" onmouseleave="this.style.background='transparent'">
                <td style="padding:14px 20px">
                  <div style="font-size:13px;font-weight:700;color:var(--text)">${PDMS.esc(catName)}</div>
                  <div style="font-size:11px;color:var(--text-soft);margin-top:2px">Submitted ${PDMS.formatDate ? PDMS.formatDate(lv.createdAt) : (lv.createdAt ? lv.createdAt.slice(0,10) : '—')}</div>
                </td>
                <td style="padding:14px 16px">
                  <div style="font-size:13px;font-weight:600;color:var(--text)">${PDMS.esc(lv.startDate)} <span style="color:var(--text-muted)">→</span> ${PDMS.esc(lv.endDate)}</div>
                  <div style="font-size:11px;color:var(--primary);font-weight:600;margin-top:2px">${dCount} working day${dCount!==1?'s':''}</div>
                </td>
                <td style="padding:14px 16px;max-width:280px">
                  <div style="font-size:12.5px;color:var(--text);line-height:1.4">${PDMS.esc(lv.reason || '—')}</div>
                  ${lv.reviewNote ? `<div style="font-size:11px;color:var(--danger);margin-top:4px;background:rgba(239,68,68,0.08);padding:3px 8px;border-radius:6px">Note: ${PDMS.esc(lv.reviewNote)}</div>` : ''}
                  ${(lv.reviewerName && isApproved) ? `<div style="font-size:10.5px;color:var(--text-muted);margin-top:2px">Approved by ${PDMS.esc(lv.reviewerName)}</div>` : ''}
                </td>
                <td style="padding:14px 16px">${statusBadge}</td>
                <td style="padding:14px 20px;text-align:right">
                  <div style="display:inline-flex;gap:6px;justify-content:flex-end">
                    ${(isPending && canManageLeaves) ? `
                      <button class="btn btn-primary btn-sm" onclick="approveLeaveRequest('${lv.id}')" style="background:#10b981;border-color:#10b981;padding:4px 10px;font-size:12px">${I('check')} Approve</button>
                      <button class="btn btn-secondary btn-sm" onclick="rejectLeaveRequest('${lv.id}')" style="color:#ef4444;border-color:#ef4444;padding:4px 10px;font-size:12px">${I('close')} Reject</button>
                    ` : ''}
                    ${(isPending && isSelf && !canManageLeaves) ? `
                      <button class="btn btn-secondary btn-sm" onclick="cancelLeaveRequest('${lv.id}')" style="padding:4px 10px;font-size:12px">${I('trash')} Cancel</button>
                    ` : ''}
                    ${(!isPending || (!canManageLeaves && !isSelf)) ? `<span style="font-size:12px;color:var(--text-muted)">—</span>` : ''}
                  </div>
                </td>
              </tr>`;
            }).join('') : `<tr><td colspan="5" style="text-align:center;padding:36px;color:var(--text-muted);font-size:13px">${PDMS.emptyOrLoading('No leave requests or history on record')}</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>

  </div>
  `;
}

const LEAVE_TYPES = [
  'Annual / Vacation Leave',
  'Sick / Medical Leave',
  'Personal / Family Leave',
  'Maternity / Paternity Leave',
  'Study / Exam Leave',
  'Compassionate / Bereavement',
  'Other / Unpaid Leave'
];

window.openRequestLeaveModal = function () {
  if (!u) return;
  const currentLoggedIn = PDMS.getUser();
  const isSelf = currentLoggedIn && (String(currentLoggedIn.id) === String(u.id) || (currentLoggedIn.email && String(currentLoggedIn.email).toLowerCase() === String(u.email || '').toLowerCase()));
  const todayStr = new Date().toISOString().slice(0, 10);

  const bodyHtml = `
    <div class="form-row" style="margin-bottom:14px">
      <label>Employee</label>
      <input value="${PDMS.esc(u.name)} (${PDMS.esc(u.role)})" disabled style="background:var(--surface-2);cursor:not-allowed;width:100%"/>
    </div>

    <div class="form-row" style="margin-bottom:14px">
      <label>Leave Category / Type <span style="color:var(--danger)">*</span></label>
      <select id="leaveType" style="width:100%">
        ${LEAVE_TYPES.map(t => `<option value="${t}">${t}</option>`).join('')}
      </select>
    </div>

    <div class="grid grid-2" style="gap:14px;margin-bottom:14px">
      <div class="form-row" style="margin-bottom:0">
        <label>Start Date <span style="color:var(--danger)">*</span></label>
        <input type="date" id="leaveStartDate" value="${todayStr}" style="width:100%"/>
      </div>
      <div class="form-row" style="margin-bottom:0">
        <label>End Date <span style="color:var(--danger)">*</span></label>
        <input type="date" id="leaveEndDate" value="${todayStr}" style="width:100%"/>
      </div>
    </div>

    <div style="background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between">
      <span style="font-size:12.5px;color:var(--text-muted)">Estimated Duration:</span>
      <span id="leaveDaysDisplay" style="font-weight:700;font-size:13px;color:var(--primary)">1 Day</span>
    </div>

    <div class="form-row" style="margin-bottom:6px">
      <label>Reason / Handover Notes <span style="color:var(--danger)">*</span></label>
      <textarea id="leaveReason" rows="4" placeholder="Describe the reason for time-off..." style="width:100%"></textarea>
    </div>
  `;

  const footHtml = `
    <button class="btn btn-ghost" data-close>Cancel</button>
    <button class="btn btn-primary" id="submitLeaveBtn">${I('send')} ${isSelf ? 'Submit to HR' : 'Log Request'}</button>
  `;

  const modal = PDMS.modal(`Request Off-Days — ${PDMS.esc(u.name)}`, bodyHtml, footHtml);

  const startInput = modal.querySelector('#leaveStartDate');
  const endInput = modal.querySelector('#leaveEndDate');
  const daysDisplay = modal.querySelector('#leaveDaysDisplay');

  function calculateDays() {
    const sVal = startInput.value;
    const eVal = endInput.value;
    if (!sVal || !eVal) return 1;
    const d1 = new Date(sVal);
    const d2 = new Date(eVal);
    const diffTime = d2.getTime() - d1.getTime();
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
    return diffDays > 0 ? diffDays : 0;
  }

  function updateDays() {
    const count = calculateDays();
    if (count <= 0) {
      daysDisplay.textContent = 'Invalid date range';
      daysDisplay.style.color = 'var(--danger)';
    } else {
      daysDisplay.textContent = count === 1 ? '1 Day' : `${count} Days`;
      daysDisplay.style.color = 'var(--primary)';
    }
  }

  startInput.onchange = () => {
    if (endInput.value < startInput.value) {
      endInput.value = startInput.value;
    }
    updateDays();
  };
  endInput.onchange = updateDays;

  const submitBtn = modal.querySelector('#submitLeaveBtn');
  submitBtn.onclick = function () {
    const type = modal.querySelector('#leaveType').value;
    const startDate = startInput.value;
    const endDate = endInput.value;
    const reason = modal.querySelector('#leaveReason').value.trim();
    const daysCount = calculateDays();

    if (!startDate || !endDate || !reason) {
      return PDMS.toast('Missing Info', 'Please provide start date, end date, and reason.', 'error');
    }
    if (daysCount <= 0) {
      return PDMS.toast('Invalid Dates', 'End date must be on or after start date.', 'error');
    }

    const btn = this;
    PDMS.setButtonLoading(btn, true, 'Submitting...');

    const record = {
      id: 'LV-' + Date.now(),
      userId: String(u.id || ''),
      userName: String(u.name || ''),
      userEmail: String(u.email || ''),
      userRole: String(u.role || ''),
      dept: String(u.dept || ''),
      startDate: startDate,
      endDate: endDate,
      daysCount: daysCount,
      type: type,
      category: type,
      reason: reason,
      status: 'Pending Approval',
      createdAt: new Date().toISOString(),
      reviewerId: '',
      reviewerName: '',
      reviewerRole: '',
      reviewNote: '',
      reviewedAt: ''
    };

    PDMS.api.create('leaveRequests', record).then(saved => {
      const finalObj = Object.assign({}, record, saved || {});
      D.leaveRequests = D.leaveRequests || [];
      D.leaveRequests.unshift(finalObj);
      if (window.PDMS_REMOTE) {
        window.PDMS_REMOTE.leaveRequests = window.PDMS_REMOTE.leaveRequests || [];
        window.PDMS_REMOTE.leaveRequests.unshift(finalObj);
      }

      PDMS.notify('New Time-Off Request', `${u.name} requested ${daysCount} off-day(s) (${startDate} to ${endDate})`, 'calendar', 'dashboard-hr.html', 'HR,System Administrator');

      modal.remove();
      PDMS.toast('Request Submitted', `Time off request (${daysCount} day${daysCount===1?'':'s'}) submitted.`, 'success');
      render();
      if (typeof PDMS_REFRESH === 'function') PDMS_REFRESH();
    }).catch(err => {
      PDMS.setButtonLoading(btn, false);
      PDMS.toast('Error', err.message || 'Could not submit time off request', 'error');
    });
  };
};

window.approveLeaveRequest = function (leaveId) {
  const list = PDMS.getAllLeaveRequests ? PDMS.getAllLeaveRequests() : (D.leaveRequests || []);
  const lv = list.find(l => String(l.id) === String(leaveId));
  if (!lv) return;
  const user = PDMS.getUser();

  const patch = {
    status: 'Approved',
    reviewerId: String(user.id || ''),
    reviewerName: String(user.name || 'HR'),
    reviewerRole: String(user.role || 'HR'),
    reviewedAt: new Date().toISOString()
  };

  PDMS.api.update('leaveRequests', leaveId, patch).then(saved => {
    Object.assign(lv, patch, saved || {});
    PDMS.notify('Time-Off Request Approved', `Your request for ${lv.daysCount} off-day(s) (${lv.startDate} to ${lv.endDate}) has been approved by HR.`, 'check', 'profile.html', lv.userRole, lv.userEmail);
    PDMS.toast('Leave Approved', `Approved time off for ${lv.userName} (${lv.startDate} to ${lv.endDate})`, 'success');
    render();
    if (typeof PDMS_REFRESH === 'function') PDMS_REFRESH();
  }).catch(err => {
    PDMS.toast('Error', err.message || 'Could not approve leave request', 'error');
  });
};

window.rejectLeaveRequest = function (leaveId) {
  const list = PDMS.getAllLeaveRequests ? PDMS.getAllLeaveRequests() : (D.leaveRequests || []);
  const lv = list.find(l => String(l.id) === String(leaveId));
  if (!lv) return;
  const user = PDMS.getUser();

  const note = prompt('Please provide a reason / note for rejecting this time-off request:');
  if (note === null) return; // cancelled

  const patch = {
    status: 'Rejected',
    reviewNote: note.trim() || 'Not approved by HR',
    reviewerId: String(user.id || ''),
    reviewerName: String(user.name || 'HR'),
    reviewerRole: String(user.role || 'HR'),
    reviewedAt: new Date().toISOString()
  };

  PDMS.api.update('leaveRequests', leaveId, patch).then(saved => {
    Object.assign(lv, patch, saved || {});
    PDMS.notify('Time-Off Request Rejected', `Your request for off-days (${lv.startDate} to ${lv.endDate}) was not approved. Reason: ${patch.reviewNote}`, 'alert-triangle', 'profile.html', lv.userRole, lv.userEmail);
    PDMS.toast('Leave Rejected', `Time off request for ${lv.userName} was rejected.`, 'info');
    render();
    if (typeof PDMS_REFRESH === 'function') PDMS_REFRESH();
  }).catch(err => {
    PDMS.toast('Error', err.message || 'Could not reject leave request', 'error');
  });
};

window.cancelLeaveRequest = function (leaveId) {
  const list = PDMS.getAllLeaveRequests ? PDMS.getAllLeaveRequests() : (D.leaveRequests || []);
  const item = list.find(l => String(l.id) === String(leaveId));
  if (!item) return;

  if (!confirm('Are you sure you want to cancel this pending time-off request?')) return;

  PDMS.api.update('leaveRequests', leaveId, { status: 'Cancelled', updatedAt: new Date().toISOString() }).then(saved => {
    Object.assign(item, { status: 'Cancelled' }, saved || {});
    PDMS.toast('Cancelled', 'Time off request cancelled.', 'success');
    render();
    if (typeof PDMS_REFRESH === 'function') PDMS_REFRESH();
  }).catch(err => {
    PDMS.toast('Error', err.message || 'Could not cancel request', 'error');
  });
};

window.editUser = function() {
  const modal = PDMS.modal('Edit User', `
    <div class="form-grid">
      <div class="form-row"><label>Full Name</label><input id="editUserName" value="${PDMS.esc(u.name)}"/></div>
      <div class="form-row"><label>Email</label><input id="editUserEmail" type="email" value="${PDMS.esc(u.email)}"/></div>
      <div class="form-row"><label>Role</label><select id="editUserRole" ${!PDMS.can('Edit User') ? 'disabled title="Only HR or System Admin can change roles" style="background:var(--surface-2);opacity:.8;cursor:not-allowed"' : ''}>${D.roles.map(r => `<option ${r===u.role?'selected':''}>${r}</option>`).join('')}</select></div>
      <div class="form-row"><label>Designation</label><input id="editUserDept" value="${PDMS.esc(u.dept||'')}"/></div>
      <div class="form-row"><label>Phone</label><input id="editUserPhone" value="${PDMS.esc(u.phone||'')}"/></div>
      <div class="form-row"><label>Date of Birth</label><input id="editUserBirthday" value="${PDMS.esc(u.birthday||'')}"/></div>
      <div class="form-row"><label>Date of Entry</label><input id="editUserEntry" type="date" value="${PDMS.esc(u.dateOfEntry||u.joined||'')}"/></div>
      <div class="form-row" style="grid-column:1/-1">
        <label>Password <span style="font-size:11px;color:var(--text-soft);font-weight:400">(leave blank to retain current password)</span></label>
        <div style="position:relative;display:flex;align-items:center">
          <input id="editUserPassword" type="text" value="${PDMS.esc(u.password || '')}" placeholder="Enter user password" autocomplete="off" style="width:100%;padding-right:40px;font-family:inherit;font-size:13px"/>
          <button type="button" id="toggleEditPassBtn" style="position:absolute;right:10px;background:none;border:none;color:var(--text-soft);cursor:pointer;padding:4px;display:flex;align-items:center;justify-content:center" title="Toggle visibility">
            <svg id="passEyeIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>
    </div>
  `, '<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="saveEditBtn">Save Changes</button>');

  const passInput = modal.querySelector('#editUserPassword');
  const toggleBtn = modal.querySelector('#toggleEditPassBtn');

  if (toggleBtn && passInput) {
    toggleBtn.onclick = () => {
      const isPass = passInput.type === 'password';
      passInput.type = isPass ? 'text' : 'password';
      toggleBtn.style.color = isPass ? 'var(--primary)' : 'var(--text-soft)';
    };
  }

  modal.querySelector('#saveEditBtn').onclick = function() {
    const btn = this;
    const patch = {
      name: modal.querySelector('#editUserName').value.trim(),
      email: modal.querySelector('#editUserEmail').value.trim().toLowerCase(),
      role: (modal.querySelector('#editUserRole') && !modal.querySelector('#editUserRole').disabled) ? modal.querySelector('#editUserRole').value : u.role,
      dept: modal.querySelector('#editUserDept').value.trim(),
      phone: modal.querySelector('#editUserPhone').value.trim(),
      birthday: modal.querySelector('#editUserBirthday').value.trim(),
      dateOfEntry: modal.querySelector('#editUserEntry').value
    };
    const newPass = modal.querySelector('#editUserPassword').value;
    if (newPass !== undefined && newPass.trim() !== '') {
      patch.password = newPass.trim();
    }
    PDMS.setButtonLoading(btn, true);
    PDMS.api.update('users', u.id, patch).then(saved => {
      Object.assign(u, saved);
      modal.remove();
      PDMS.toast('Success', 'User profile updated & notification email sent', 'success');
      render();
      if(typeof PDMS_REFRESH==='function') PDMS_REFRESH();
    }).catch(err => {
      PDMS.setButtonLoading(btn, false);
      PDMS.toast('Error', err.message, 'error');
    });
  };
};

window.deleteUser = function() {
  const modal = PDMS.modal('Delete User Account', `
    <div style="padding:4px 0">
      <div style="display:flex;align-items:flex-start;gap:14px;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);border-radius:12px;padding:16px;margin-bottom:16px">
        <div style="width:38px;height:38px;border-radius:10px;background:rgba(239,68,68,0.15);display:flex;align-items:center;justify-content:center;color:#ef4444;flex-shrink:0">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        </div>
        <div>
          <div style="font-size:14px;font-weight:700;color:var(--text);margin-bottom:4px">Are you sure you want to delete this user?</div>
          <div style="font-size:13px;color:var(--text-muted);line-height:1.4">You are about to permanently remove <strong style="color:var(--text)">${PDMS.esc(u.name)}</strong> (${PDMS.esc(u.email || u.role)}).</div>
        </div>
      </div>

      <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-soft);margin-bottom:8px">Consequences & Impact</div>
      <ul style="margin:0;padding-left:18px;font-size:13px;color:var(--text-muted);line-height:1.6">
        <li><strong>Immediate Access Revocation:</strong> This account will be deactivated and unable to sign in to the platform.</li>
        <li><strong>Project Disengagement:</strong> The user will be removed from all active project assignments, workflows, and task pipelines.</li>
        <li><strong>Permanent Action:</strong> This operation cannot be reversed. Historical activity audit logs will be preserved.</li>
      </ul>
    </div>
  `, `
    <button class="btn btn-ghost" data-close>Cancel</button>
    <button class="btn btn-primary" id="confirmDeleteUserBtn" style="background:#ef4444;border-color:#ef4444;color:#fff">${I('trash')} Yes, Delete User</button>
  `);

  modal.querySelector('#confirmDeleteUserBtn').onclick = function() {
    const btn = this;
    PDMS.setButtonLoading(btn, true, 'Deleting...');
    PDMS.api.remove('users', u.id).then(() => {
      const idx = D.users.findIndex(x => x.id === u.id);
      if (idx > -1) D.users.splice(idx, 1);
      modal.remove();
      PDMS.toast('Success', `${u.name} was successfully deleted`, 'success');
      if (typeof PDMS_REFRESH === 'function') PDMS_REFRESH();
      setTimeout(() => { location.href = 'users.html'; }, 300);
    }).catch(err => {
      PDMS.setButtonLoading(btn, false);
      PDMS.toast('Error', err.message || 'Could not delete user', 'error');
    });
  };
};

PDMS.onRefresh(render);
</script>
